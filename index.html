                        <TopPeminjam peminjaman={peminjaman} anggota={anggota} onUserClick={onUserClick} sekolah={sekolah} />
                    </div>
                    
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="bg-white p-6 md:p-8 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border-0">
                            <h3 className="text-lg font-black text-slate-800 mb-6 flex items-center justify-between"><div className="flex items-center gap-3"><div className="p-2 bg-indigo-50 rounded-lg text-indigo-500"><i className="fas fa-history"></i></div> Peminjaman Terbaru</div><span className="text-[10px] font-bold text-slate-400 bg-slate-50 px-2 py-1 rounded-md uppercase tracking-widest">5 Terbaru</span></h3>
                            <div className="space-y-4">
                                {peminjaman.filter(p => p.status === 'Dipinjam').slice(0, 5).map(p => (
                                    <div key={p.id} className="flex justify-between items-center p-4 hover:bg-slate-50 rounded-2xl border border-slate-100 transition-colors">
                                        <div><p className="font-bold text-sm text-slate-800">{p.namaPeminjam}</p><p className="text-xs font-semibold text-slate-500 mt-1">{p.judulBuku}</p></div>
                                        <span className="text-[10px] font-black px-3 py-1.5 bg-amber-50 text-amber-600 rounded-lg border border-amber-100 uppercase tracking-widest shrink-0">Dipinjam</span>
                                    </div>
                                ))}
                                {aL === 0 ? <p className="text-sm font-medium text-slate-400 text-center py-6">Belum ada data peminjaman.</p> : null}
                            </div>
                        </div>
                        <div className="bg-white p-6 md:p-8 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border-0">
                            <h3 className="text-lg font-black text-slate-800 mb-6 flex items-center justify-between"><div className="flex items-center gap-3"><div className="p-2 bg-emerald-50 rounded-lg text-emerald-500"><i className="fas fa-shoe-prints"></i></div> Kunjungan Terakhir</div><span className="text-[10px] font-bold text-slate-400 bg-slate-50 px-2 py-1 rounded-md uppercase tracking-widest">5 Terbaru</span></h3>
                            <div className="space-y-4">
                                {kehadiran.slice().reverse().slice(0, 5).map(k => (
                                    <div key={k.id} className="flex justify-between items-center p-4 hover:bg-slate-50 rounded-2xl border border-slate-100 transition-colors">
                                        <div className="flex items-center gap-4">
                                            <div className="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-500 flex items-center justify-center shrink-0 font-bold"><i className="fas fa-user"></i></div>
                                            <div><p className="font-bold text-sm text-slate-800">{k.nama}</p><p className="text-xs font-semibold text-slate-500 mt-1">{k.kategori} {k.kategori === 'Siswa' ? `- ${k.kelas} ${k.jurusan}` : ''}</p></div>
                                        </div>
                                        <span className="text-xs font-bold text-slate-400 bg-slate-100 px-3 py-1.5 rounded-lg shrink-0">{k.waktu}</span>
                                    </div>
                                ))}
                                {kehadiran.length === 0 ? <p className="text-sm font-medium text-slate-400 text-center py-6">Belum ada pengunjung.</p> : null}
                            </div>
                        </div>
                    </div>
                    <BookDetailModal isOpen={!!sB} onClose={() => setSB(null)} book={sB} />
                </div>
            );
        };

    const AdministrasiView = ({ sekolah, onSave, showAlert, showConfirm, allData }) => {
    const [f, setF] = useState({ 
        kota: sekolah?.kota || '', 
        kepalaSekolah: sekolah?.kepalaSekolah || '', 
        nipKepalaSekolah: sekolah?.nipKepalaSekolah || '', 
        kepalaPerpus: sekolah?.kepalaPerpus || '', 
        nipKepala: sekolah?.nipKepala || '' 
    });
    const [isRestoring, setIsRestoring] = useState(false);
    const [restoreProgress, setRestoreProgress] = useState('');

    useEffect(() => { 
        setF({ 
            kota: sekolah?.kota || '', 
            kepalaSekolah: sekolah?.kepalaSekolah || '', 
            nipKepalaSekolah: sekolah?.nipKepalaSekolah || '', 
            kepalaPerpus: sekolah?.kepalaPerpus || '', 
            nipKepala: sekolah?.nipKepala || '' 
        });
    }, [sekolah]);

    // 1. FUNGSI BACKUP FULL DATABASE KE FILE .JSON
    const handleBackupJSON = () => {
        try {
            const tanggalStr = new Date().toISOString().split('T')[0];
            const backupPayload = {
                metadata: {
                    app: "Lokabaca Perpustakaan",
                    version: APP_VERSION,
                    activeAppId: activeAppId,
                    exportedAt: new Date().toISOString(),
                    counts: {
                        buku: (allData?.buku || []).length,
                        anggota: (allData?.anggota || []).length,
                        peminjaman: (allData?.peminjaman || []).length,
                        kehadiran: (allData?.kehadiran || []).length,
                        quotes: (allData?.quotes || []).length
                    }
                },
                pengaturan: sekolah || {},
                collections: {
                    buku: allData?.buku || [],
                    anggota: allData?.anggota || [],
                    peminjaman: allData?.peminjaman || [],
                    kehadiran: allData?.kehadiran || [],
                    quotes: allData?.quotes || []
                }
            };

            const jsonString = JSON.stringify(backupPayload, null, 2);
            const blob = new Blob([jsonString], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `Backup_Lokabaca_${tanggalStr}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showAlert(
                'Backup Berhasil!', 
                `Seluruh database berhasil diunduh:\n• ${backupPayload.metadata.counts.buku} Buku\n• ${backupPayload.metadata.counts.anggota} Anggota\n• ${backupPayload.metadata.counts.peminjaman} Transaksi Sirkulasi\n• ${backupPayload.metadata.counts.kehadiran} Riwayat Hadir`, 
                'success'
            );
        } catch (err) {
            console.error(err);
            showAlert('Gagal Backup', 'Terjadi kesalahan saat membuat file cadangan.', 'error');
        }
    };

    // 2. FUNGSI RESTORE DATABASE DARI FILE .JSON (DENGAN CHUNKED BATCH FIRESTORE)
    const handleRestoreJSON = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (event) => {
            try {
                const parsed = JSON.parse(event.target.result);
                if (!parsed.collections || !parsed.metadata) {
                    e.target.value = null;
                    return showAlert('Format Tidak Valid', 'File JSON ini bukan file backup resmi dari Lokabaca!', 'error');
                }

                const c = parsed.metadata.counts || {};
                const infoMsg = `Anda akan memulihkan data dari tanggal ${formatDate(parsed.metadata.exportedAt)}:\n\n` +
                                `• Buku: ${c.buku || 0} data\n` +
                                `• Anggota: ${c.anggota || 0} data\n` +
                                `• Peminjaman: ${c.peminjaman || 0} data\n` +
                                `• Kehadiran: ${c.kehadiran || 0} data\n\n` +
                                `Data dengan ID yang sama akan diperbarui (merge). Lanjutkan proses Restore?`;

                showConfirm('Konfirmasi Restore Database', infoMsg, async () => {
                    setIsRestoring(true);
                    try {
                        // A. Pulihkan Pengaturan Sekolah
                        if (parsed.pengaturan) {
                            setRestoreProgress('Memulihkan Profil & Pengaturan...');
                            await db.doc(`artifacts/${activeAppId}/public/data/pengaturan/profil`).set(parsed.pengaturan, { merge: true });
                        }

                        // B. Kumpulkan semua dokumen dari 5 koleksi
                        const operations = [];
                        const colNames = ['buku', 'anggota', 'peminjaman', 'kehadiran', 'quotes'];
                        
                        colNames.forEach(colName => {
                            const items = parsed.collections[colName] || [];
                            items.forEach(item => {
                                const { id, ...docData } = item;
                                const docRef = id 
                                    ? db.doc(`artifacts/${activeAppId}/public/data/${colName}/${id}`)
                                    : db.collection(`artifacts/${activeAppId}/public/data/${colName}`).doc();
                                operations.push({ ref: docRef, data: docData });
                            });
                        });

                        // C. Eksekusi dengan Batch Chunking (Maks 400 dokumen per batch agar aman dari limit 500 Firestore)
                        const chunkSize = 400;
                        for (let i = 0; i < operations.length; i += chunkSize) {
                            const chunk = operations.slice(i, i + chunkSize);
                            const batch = db.batch();
                            chunk.forEach(op => batch.set(op.ref, op.data, { merge: true }));
                            
                            const persen = Math.min(100, Math.round(((i + chunk.length) / operations.length) * 100));
                            setRestoreProgress(`Memulihkan Database... (${persen}% - ${i + chunk.length}/${operations.length} data)`);
                            await batch.commit();
                        }

                        setIsRestoring(false);
                        setRestoreProgress('');
                        showAlert('Restore Selesai!', `Berhasil memulihkan total ${operations.length} rekaman data ke server Firebase.`, 'success');
                    } catch (errRestore) {
                        console.error(errRestore);
                        setIsRestoring(false);
                        setRestoreProgress('');
                        showAlert('Error Restore', 'Terjadi gangguan koneksi saat menulis data ke Firebase.', 'error');
                    }
                });
            } catch (err) {
                showAlert('File Rusak', 'Gagal membaca file JSON. Pastikan file tidak rusak.', 'error');
            }
            e.target.value = null;
        };
        reader.readAsText(file);
    };

    return (
        <div className="space-y-8 max-w-4xl mx-auto">
            {/* BAGIAN 1: FORM ADMINISTRASI KEPALA SEKOLAH & PERPUSTAKAAN */}
            <div className="bg-white rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border-0 overflow-hidden">
                <div className="p-8 md:p-12 border-b border-slate-100 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-indigo-50 via-white to-white">
                    <h2 className="text-3xl font-black text-indigo-950 mb-3 tracking-tight flex items-center gap-4">
                        <i className="fas fa-user-tie text-indigo-500"></i> Kelola Data Administrasi
                    </h2>
                    <p className="text-slate-500 font-semibold text-sm">Silakan kelola data identitas pejabat pengesahan untuk cetak laporan otomatis.</p>
                </div>
                <form onSubmit={e => { e.preventDefault(); onSave({ ...sekolah, ...f }); }} className="p-8 md:p-12 space-y-8">
                    <Input label="Kota / Kabupaten (Tempat Cetak Laporan)" value={f.kota} onChange={e => setF({ ...f, kota: e.target.value })} placeholder="Contoh: Jember" />
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div className="space-y-5 bg-slate-50 p-6 rounded-2xl border border-slate-100">
                            <h3 className="font-black text-slate-800 border-b border-slate-200 pb-3">
                                <i className="fas fa-building-user text-indigo-500 mr-2"></i>Kepala Sekolah
                            </h3>
                            <Input 
                                label="Nama Kepala Sekolah" 
                                value={f.kepalaSekolah} 
                                onChange={e => setF({ ...f, kepalaSekolah: e.target.value })} 
                                onBlur={e => setF({ ...f, kepalaSekolah: formatNamaGelarPintar(e.target.value) })}
                                placeholder="Nama Lengkap & Gelar" 
                            />
                            <Input label="NIP Kepala Sekolah" value={f.nipKepalaSekolah} onChange={e => setF({ ...f, nipKepalaSekolah: e.target.value })} placeholder="Kosongkan jika tidak ada" />
                        </div>
                        <div className="space-y-5 bg-slate-50 p-6 rounded-2xl border border-slate-100">
                            <h3 className="font-black text-slate-800 border-b border-slate-200 pb-3">
                                <i className="fas fa-book-open-reader text-indigo-500 mr-2"></i>Kepala Perpustakaan
                            </h3>
                            <Input 
                                label="Nama Kepala Perpustakaan" 
                                value={f.kepalaPerpus} 
                                onChange={e => setF({ ...f, kepalaPerpus: e.target.value })} 
                                onBlur={e => setF({ ...f, kepalaPerpus: formatNamaGelarPintar(e.target.value) })}
                                placeholder="Nama Lengkap & Gelar" 
                            />
                            <Input label="NIP Kepala Perpustakaan" value={f.nipKepala} onChange={e => setF({ ...f, nipKepala: e.target.value })} placeholder="Kosongkan jika tidak ada" />
                        </div>
                    </div>
                    <div className="pt-8 border-t border-slate-100 flex justify-end">
                        <button type="submit" className="btn-primary px-8 py-4 text-lg w-full md:w-auto">
                            <i className="fas fa-save mr-2"></i> Simpan Data Administrasi
                        </button>
                    </div>
                </form>
            </div>

            {/* BAGIAN 2: PANEL BACKUP & RESTORE DATABASE 1-KLIK */}
            <div className="bg-white rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border-0 overflow-hidden p-8 md:p-12">
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-8 pb-6 border-b border-slate-100">
                    <div>
                        <h3 className="text-2xl font-black text-slate-800 flex items-center gap-3">
                            <i className="fas fa-database text-emerald-500"></i> Backup & Restore Database (Full Snapshot)
                        </h3>
                        <p className="text-sm font-semibold text-slate-500 mt-1">
                            Cadangkan seluruh koleksi buku, anggota, riwayat sirkulasi, daftar hadir, dan pengaturan dalam 1 file JSON.
                        </p>
                    </div>
                    <span className="px-4 py-1.5 bg-emerald-50 text-emerald-600 border border-emerald-200 rounded-xl text-xs font-black uppercase tracking-wider shrink-0">
                        Aman & Terintegrasi
                    </span>
                </div>

                {isRestoring ? (
                    <div className="p-8 bg-indigo-50 border border-indigo-200 rounded-2xl text-center space-y-3 animate-pulse">
                        <i className="fas fa-sync-alt fa-spin text-4xl text-indigo-600"></i>
                        <h4 className="font-black text-indigo-950 text-lg">{restoreProgress}</h4>
                        <p className="text-xs font-bold text-indigo-500">Mohon jangan tutup halaman ini sampai proses selesai...</p>
                    </div>
                ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {/* Kotak Backup */}
                        <div className="p-6 rounded-2xl bg-slate-50 border border-slate-200/80 flex flex-col justify-between">
                            <div>
                                <div className="w-12 h-12 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-xl mb-4">
                                    <i className="fas fa-cloud-arrow-down"></i>
                                </div>
                                <h4 className="font-black text-slate-800 text-lg mb-1">Unduh Full Backup (.JSON)</h4>
                                <p className="text-xs font-medium text-slate-500 leading-relaxed mb-6">
                                    Simpan salinan utuh seluruh database Lokabaca ke komputer/HP Anda. Disarankan dilakukan rutin setiap akhir bulan atau sebelum kenaikan kelas.
                                </p>
                            </div>
                            <button type="button" onClick={handleBackupJSON} className="w-full py-3.5 px-6 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-xl shadow-lg shadow-emerald-500/20 transition-all flex items-center justify-center gap-2">
                                <i className="fas fa-download"></i> Download File Backup Sekarang
                            </button>
                        </div>

                        {/* Kotak Restore */}
                        <div className="p-6 rounded-2xl bg-slate-50 border border-slate-200/80 flex flex-col justify-between">
                            <div>
                                <div className="w-12 h-12 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center text-xl mb-4">
                                    <i className="fas fa-cloud-arrow-up"></i>
                                </div>
                                <h4 className="font-black text-slate-800 text-lg mb-1">Pulihkan Database (Restore)</h4>
                                <p className="text-xs font-medium text-slate-500 leading-relaxed mb-6">
                                    Unggah file <code className="bg-slate-200 px-1.5 py-0.5 rounded font-bold">.json</code> hasil backup Lokabaca untuk mengembalikan seluruh data ke dalam Firebase secara otomatis.
                                </p>
                            </div>
                            <label className="w-full py-3.5 px-6 bg-white hover:bg-amber-50 text-amber-700 border-2 border-amber-300 font-black rounded-xl transition-all flex items-center justify-center gap-2 cursor-pointer shadow-sm">
                                <i className="fas fa-upload"></i> Pilih File Backup (.JSON)
                                <input type="file" accept=".json" onChange={handleRestoreJSON} className="hidden" />
                            </label>
                        </div>
                    </div>
                )}
            </div>
        </div>
    );
};
     const AnggotaView = ({ data, onAdd, onUpdate, onDelete, onDeleteMany, showAlert, showConfirm, filter, setFilter, onPrint, sekolah, onUpdatePengaturan }) => {
    const iF = { nisn: '', nama: '', tempatLahir: '', tanggalLahir: '', jenisKelamin: 'L', alamat: '', telepon: '', kategori: 'Siswa', jurusan: '', kelasJurusan: '', kelas: 'X', noKelas: '', tahunPelajaran: '', status: 'Aktif', foto: '' };
    const [io, setIo] = useState(false), [eId, setEId] = useState(null), [f, setF] = useState(iF), [sDM, setSDM] = useState(false), [dT, setDT] = useState('all'), [dV, setDV] = useState('');
    const dJ = sekolah?.daftarJurusan || DEFAULT_JURUSAN;
    
    const [fKat, setFKat] = useState('Semua'), [fKls, setFKls] = useState('Semua'), [fJur, setFJur] = useState('Semua'), [fThn, setFThn] = useState('Semua');
    const [isProsesNK, setIsProsesNK] = useState(false);

    // STATE BARU UNTUK PAGINATION (PAGINASI)
    const [currentPage, setCurrentPage] = useState(1);
    const itemsPerPage = 25; // Jumlah anggota yang tampil per halaman

    const rkp = useMemo(() => { 
        const a = data.filter(d => d.status === 'Aktif'); 
        return { 
            t: a.length, 
            s: a.filter(d => d.kategori === 'Siswa').length, 
            g: a.filter(d => d.kategori === 'Guru').length, 
            k: a.filter(d => d.kategori === 'Karyawan').length,
            ks: a.filter(d => d.kategori === 'Kepala Sekolah').length 
        } 
    }, [data]);
    
    const uKlsLengkap = useMemo(() => [...new Set(data.filter(d => d.kategori === 'Siswa').map(d => formatKelasSiswa(d, dJ)).filter(Boolean))].sort(), [data, dJ]);
    const uJurusan = useMemo(() => [...new Set(data.filter(d => d.kategori === 'Siswa' && d.jurusan).map(d => d.jurusan))].sort(), [data]);
    const uThn = useMemo(() => [...new Set(data.filter(d => d.kategori === 'Siswa' && d.tahunPelajaran).map(d => d.tahunPelajaran))].sort(), [data]);
    
    useEffect(() => { const kD = e => { if (e.ctrlKey && e.key.toLowerCase() === 'q') { e.preventDefault(); setSDM(p => !p); } }; window.addEventListener('keydown', kD); return () => window.removeEventListener('keydown', kD); }, []);

    // Filter Seluruh Data
    const fD = data.filter(i => {
        const mT = i.nama.toLowerCase().includes((filter || '').toLowerCase()) || (i.nisn && i.nisn.toLowerCase().includes((filter || '').toLowerCase())) || (i.kelas && i.kelas.toLowerCase().includes((filter || '').toLowerCase())) || i.kategori.toLowerCase().includes((filter || '').toLowerCase()) || i.id.toLowerCase().includes((filter || '').toLowerCase());
        const mK = fKat === 'Semua' || i.kategori === fKat;
        const mKl = fKls === 'Semua' || formatKelasSiswa(i, dJ) === fKls;
        const mJur = fJur === 'Semua' || i.jurusan === fJur;
        const mTh = fThn === 'Semua' || i.tahunPelajaran === fThn;
        return mT && mK && mKl && mJur && mTh;
    }).sort((a, b) => (a.nama || '').localeCompare(b.nama || ''));

    // LOGIKA PAGINATION
    const totalPages = Math.ceil(fD.length / itemsPerPage) || 1;
    const currentData = fD.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

    const hS = e => { e.preventDefault(); const d = { ...f, tglDaftar: new Date().toISOString() }; if (eId) onUpdate(eId, d); else onAdd(d); setIo(false); setEId(null); setF(iF); showAlert('Berhasil', `Data ${eId ? 'diperbarui' : 'ditambahkan'}.`, 'success'); };
    const hC = e => { const l = e.target.files[0]; if (l) { if (l.size > 500000) return showAlert("File Kebesaran", "Maksimal ukuran foto 500KB", "warning"); const r = new FileReader(); r.onloadend = () => setF({ ...f, foto: r.result }); r.readAsDataURL(l); } };

    const hNK = () => showConfirm('Kenaikan Kelas', 'Yakin memproses kenaikan kelas masal? Jangan tutup halaman selama proses berlangsung.', async () => { 
        setIsProsesNK(true);
        let c = 0; 
        const toUpdate = [];
        data.forEach(i => { 
            if (i.kategori === 'Siswa' && i.status === 'Aktif') { 
                if (i.kelas === 'X' || i.kelas === '10') { toUpdate.push({ id: i.id, changes: { kelas: 'XI' } }); } 
                else if (i.kelas === 'XI' || i.kelas === '11') { toUpdate.push({ id: i.id, changes: { kelas: 'XII' } }); } 
                else if (i.kelas === 'XII' || i.kelas === '12') { toUpdate.push({ id: i.id, changes: { status: 'Arsip' } }); } 
            } 
        });

        const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
        const chunkSize = 50; 
        for (let i = 0; i < toUpdate.length; i += chunkSize) {
            const chunk = toUpdate.slice(i, i + chunkSize);
            await Promise.all(chunk.map(item => onUpdate(item.id, item.changes)));
            c += chunk.length;
            if (i + chunkSize < toUpdate.length) {
                await delay(500); 
            }
        }

        setIsProsesNK(false);
        showAlert('Selesai', `Sukses! ${c} data anggota berhasil diperbarui.`, 'success'); 
    });

    const hMD = () => {
        let t = [];
        if (dT === 'all') t = data.filter(a => a.kategori === 'Siswa');

        else if (dT === 'tahun') { if (!dV) return showAlert('Error', 'Isi tahun!', 'warning'); t = data.filter(a => a.kategori === 'Siswa' && a.tahunPelajaran === dV); }

    };
    
    const hExp = () => { 
        const ws = XLSX.utils.json_to_sheet(fD.map(r => ({
            "NISN/NIP": r.nisn || '', "Nama Lengkap": r.nama || '', "L/P": r.jenisKelamin || '', "Tempat Lahir": r.tempatLahir || '',
            "Tanggal Lahir": r.tanggalLahir || '', "Alamat": r.alamat || '', "No Telepon WA": r.telepon || '', "Kategori": r.kategori || '',
            "Jurusan": r.jurusan || '', "Kelas": r.kelas || '', "No Kelas": r.noKelas || '', "Tahun Pelajaran": r.tahunPelajaran || '', "Status": r.status || 'Aktif'
        })));
        const wb = XLSX.utils.book_new();

        XLSX.writeFile(wb, "Export_Data_Anggota.xlsx");
    };

    const hDownloadTemplate = () => {
        const ws = XLSX.utils.json_to_sheet([{
            "NISN/NIP": "0051234567", "Nama Lengkap": "NAMA SISWA CONTOH", "L/P": "L", "Tempat Lahir": "Jember", "Tanggal Lahir": "2005-01-01",

        }]);

    };
    
    const hImp = e => {
        const l = e.target.files[0]; if (!l) return;
        const r = new FileReader();
        r.onload = ev => {
            try {
                const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' }); 
                const sheetData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" }); 
                let c = 0;
                
                sheetData.forEach(rawRow => {
                    const rw = {};
                    for(let key in rawRow) { rw[key.toString().trim().toLowerCase()] = rawRow[key]; }
                    const nama = rw["nama lengkap"] || rw["nama"] || rw["nama siswa"] || '';
                    
                    if (nama) {
                        onAdd({ 
                            nisn: (rw["nisn/nip"] || rw["nisn"] || rw["nip"] || '').toString().replace(/\s/g, ''),
                            nama: formatNamaGelarPintar(nama), 
                            tempatLahir: (rw["tempat lahir"] || rw["tempat"] || '').toString(), 
                            tanggalLahir: (rw["tanggal lahir"] || rw["tgl lahir"] || rw["ttl"] || '').toString(), 
                            jenisKelamin: (rw["l/p"] || rw["jenis kelamin"] || rw["jk"] || 'L').toString().toUpperCase().charAt(0), 
                            alamat: (rw["alamat"] || '').toString(), 
                            telepon: (rw["no telepon wa"] || rw["telepon"] || rw["wa"] || rw["no wa"] || '').toString(), 
                            kategori: rw["kategori"] || 'Siswa', 
                            jurusan: rw["jurusan"] || '', 
                            kelasJurusan: getSingkatanJurusan(rw["jurusan"] || '', dJ), 
                            kelas: (rw["kelas"] || '').toString(), 
                            noKelas: (rw["no kelas"] || rw["no"] || '').toString(), 
                            tahunPelajaran: (rw["tahun pelajaran"] || rw["tahun"] || '').toString(), 
                            status: rw["status"] || 'Aktif', 
                            tglDaftar: new Date().toISOString() 
                        });
                        c++;
                    }
                });
                
                if(c > 0) { showAlert('Sukses', `Berhasil memproses import ${c} anggota!`, 'success'); } 
                else { showAlert('Peringatan', 'Gagal import! Pastikan file Excel memiliki kolom bernama "Nama Lengkap" atau "Nama".', 'warning'); }
            } catch (err) { 
                showAlert('Gagal', 'Format file Excel tidak sesuai atau rusak.', 'error'); 
                console.error(err); 
            }
            e.target.value = null;
        };
        r.readAsArrayBuffer(l);
    };

    return (
        <div className="bg-white rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border-0 overflow-hidden flex flex-col min-h-[80vh]">

                <h2 className="text-2xl font-black text-slate-800">Data Anggota</h2>
                <div className="relative w-full md:w-80">
                    <i className="fas fa-search absolute left-5 top-3 text-indigo-400 text-lg"></i>
                    <input 
                        type="text"

                        placeholder="Cari Nama/NISN..." 
                        className="input-field pl-12 py-2.5 text-sm" 
                        value={filter || ''} 
                        onChange={e => { 
                            setFilter(e.target.value); 
                            setCurrentPage(1); // Reset halaman saat mencari
                        }} 
                    />
                </div>
            </div>
            
            <div className="bg-slate-50/50 p-6 md:px-8 border-b border-slate-100 flex flex-col gap-5 shrink-0">

                    <div className="bg-blue-50 border border-blue-100 px-5 py-3 rounded-2xl shadow-sm"><p className="text-[10px] font-bold text-blue-500 uppercase">Siswa</p><h4 className="text-2xl font-black text-blue-700 leading-none">{rkp.s}</h4></div>

                    </select>
                    {fKat === 'Siswa' && (

                            <select className="input-field py-2 text-sm w-auto cursor-pointer max-w-[140px]" value={fJur} onChange={e => { setFJur(e.target.value); setCurrentPage(1); }}><option value="Semua">Semua Jurusan</option>{uJurusan.map(j => <option key={j} value={j}>{j}</option>)}</select>
                            <select className="input-field py-2 text-sm w-auto cursor-pointer max-w-[140px]" value={fThn} onChange={e => { setFThn(e.target.value); setCurrentPage(1); }}><option value="Semua">Semua Thn</option>{uThn.map(t => <option key={t} value={t}>{t}</option>)}</select>
                        </>
                    )}
                </div>
            </div>

            {sDM && (

                <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[999] flex items-center justify-center p-4 sm:p-6">

                        <div className="flex justify-between items-center p-6 border-b border-slate-100 shrink-0">
                            <h3 className="text-2xl font-black">{eId ? 'Edit' : 'Tambah'} Anggota</h3>
                            <button onClick={() => setIo(false)} className="w-10 h-10 bg-slate-50 rounded-full flex justify-center items-center hover:bg-rose-100 hover:text-rose-600 transition-colors"><i className="fas fa-times text-slate-500 hover:text-rose-600"></i></button>
                        </div>
                        <form onSubmit={hS} className="p-6 md:p-8 overflow-y-auto flex-1 custom-scrollbar">
                            <div className="flex flex-col lg:flex-row gap-8">
                                {/* --- AREA KIRI: UI FOTO --- */}
                                <div className="w-full lg:w-1/4 shrink-0 flex flex-col gap-2">
                                    <div className="w-full aspect-[3/4] bg-slate-50 rounded-2xl border-2 border-dashed relative overflow-hidden flex flex-col items-center justify-center group hover:bg-slate-100 transition-colors">
                                        {f.foto ? (
                                            <>
                                                <img src={f.foto} className="w-full h-full object-cover" alt="Foto" />
                                                <div className="absolute inset-0 bg-slate-900/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-3">
                                                    <label className="w-10 h-10 bg-white text-indigo-600 rounded-full flex items-center justify-center cursor-pointer hover:scale-110 shadow-lg" title="Ganti Foto">
                                                        <i className="fas fa-camera"></i>
                                                        <input type="file" accept="image/*" capture="environment" onChange={hC} className="hidden" />
                                                    </label>
                                                    <button type="button" onClick={() => setF({...f, foto: ''})} className="w-10 h-10 bg-white text-rose-600 rounded-full flex items-center justify-center hover:scale-110 shadow-lg" title="Hapus Foto"><i className="fas fa-trash"></i></button>
                                                </div>
                                            </>
                                        ) : (
                                            <div className="text-center p-4">
                                                <i className="fas fa-user-circle text-5xl mb-3 text-slate-300 drop-shadow-sm"></i>
                                                <p className="text-sm font-bold text-slate-500 mb-5">Tambahkan Foto</p>
                                                <label className="w-full py-2.5 px-4 bg-indigo-50 text-indigo-700 border border-indigo-200 rounded-xl text-xs font-bold hover:bg-indigo-600 hover:text-white transition-all shadow-sm cursor-pointer block">
                                                    <i className="fas fa-camera mr-2"></i>Pilih / Jepret Foto
                                                    <input type="file" accept="image/*" capture="environment" onChange={hC} className="hidden" />
                                                </label>
                                            </div>
                                        )}
                                    </div>
                                    <p className="text-[10px] text-center text-slate-400 font-medium leading-relaxed">Buka di HP untuk memotret langsung.<br/>Format JPG/PNG (Maks 500KB).</p>
                                </div>
                                
                                {/* --- AREA KANAN: INPUT DATA --- */}
                                <div className="w-full lg:w-3/4 grid grid-cols-1 md:grid-cols-12 gap-x-5 gap-y-4 content-start">
                                    <div className="md:col-span-4"><Input label="NISN/NIP" value={f.nisn} onChange={e => setF({ ...f, nisn: e.target.value })} required={true} /></div>
                                    <div className="md:col-span-8">
                                        <Input 
                                            label="Nama Lengkap" 
                                            value={f.nama} 
                                            onChange={e => setF({ ...f, nama: e.target.value })} 
                                            onBlur={e => setF({ ...f, nama: formatNamaGelarPintar(e.target.value) })} 
                                            required={true} 
                                            />
                                            </div>
                                    
                                    <div className="md:col-span-4"><Input label="Tempat Lahir" value={f.tempatLahir} onChange={e => setF({ ...f, tempatLahir: e.target.value })} /></div>
                                    <div className="md:col-span-3"><Input label="Tanggal Lahir" type="date" value={f.tanggalLahir} onChange={e => setF({ ...f, tanggalLahir: e.target.value })} /></div>
                                    <div className="md:col-span-2">
                                        <label className="block text-xs font-bold text-slate-600 mb-1.5">L/P</label>
                                        <select className="input-field py-2.5 text-sm cursor-pointer" value={f.jenisKelamin} onChange={e => setF({ ...f, jenisKelamin: e.target.value })}><option value="L">Laki-laki</option><option value="P">Perempuan</option></select>
                                    </div>
                                    <div className="md:col-span-3"><Input label="No. WA" type="tel" value={f.telepon} onChange={e => setF({ ...f, telepon: e.target.value })} /></div>
                                    
                                    <div className="md:col-span-12"><Input label="Alamat Lengkap" value={f.alamat} onChange={e => setF({ ...f, alamat: e.target.value })} /></div>
                                    
                                    <div className="md:col-span-12 border-t border-slate-100 pt-4 grid grid-cols-1 md:grid-cols-12 gap-x-5 gap-y-4">
                                        <div className="md:col-span-3">
                                            <label className="block text-xs font-bold text-slate-600 mb-1.5">Kategori</label>
                                            <select className="input-field py-2.5 text-sm cursor-pointer" value={f.kategori} onChange={e => setF({ ...f, kategori: e.target.value })}>
                                                <option value="Siswa">Siswa</option>
                                                <option value="Guru">Guru</option>
                                                <option value="Karyawan">Karyawan</option>
                                                <option value="Kepala Sekolah">Kepala Sekolah</option>
                                            </select>
                                        </div>
                                        {f.kategori === 'Siswa' ? (
                                            <>
                                                <div className="md:col-span-6">
                                                    <label className="block text-xs font-bold text-slate-600 mb-1.5">Jurusan</label>
                                                    <select className="input-field py-2.5 text-sm cursor-pointer" value={f.jurusan} onChange={e => setF({ ...f, jurusan: e.target.value, kelasJurusan: getSingkatanJurusan(e.target.value, dJ) })}><option value="">Pilih Jurusan</option>{dJ.map((j, i) => <option key={i} value={j.nama}>{j.nama}</option>)}</select>
                                                </div>
                                                <div className="md:col-span-3"><Input label="Tahun Ajaran" value={f.tahunPelajaran} onChange={e => setF({ ...f, tahunPelajaran: e.target.value })} required={true} /></div>
                                            </>
                                        ) : <div className="md:col-span-9"></div>}
                                    </div>

                                    <div className="md:col-span-12 grid grid-cols-1 md:grid-cols-12 gap-x-5 gap-y-4 mb-2">
                                        {f.kategori === 'Siswa' ? (
                                            <>
                                                <div className="md:col-span-2"><label className="text-xs font-bold text-slate-600 block mb-1.5">Kelas</label><select className="input-field py-2.5 text-sm cursor-pointer" value={f.kelas} onChange={e => setF({ ...f, kelas: e.target.value })}><option value="X">X</option><option value="XI">XI</option><option value="XII">XII</option></select></div>
                                                <div className="md:col-span-3"><label className="text-xs font-bold text-slate-600 block mb-1.5">Singkatan</label><input type="text" className="input-field py-2.5 text-sm bg-slate-100" value={f.kelasJurusan || getSingkatanJurusan(f.jurusan, dJ)} readOnly /></div>
                                                <div className="md:col-span-2"><label className="text-xs font-bold text-slate-600 block mb-1.5">No</label><select className="input-field py-2.5 text-sm cursor-pointer" value={f.noKelas} onChange={e => setF({ ...f, noKelas: e.target.value })}><option value="">-</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></div>
                                            </>
                                        ) : <div className="md:col-span-7"></div>}
                                        
                                        <div className="md:col-span-5 md:col-start-8">
                                            <label className="block text-xs font-bold text-slate-600 mb-1.5">Status Aktif</label>
                                            <select className="input-field py-2.5 text-sm border-indigo-200 bg-indigo-50 text-indigo-700 font-bold cursor-pointer" value={f.status} onChange={e => setF({ ...f, status: e.target.value })}><option value="Aktif">Aktif</option><option value="Arsip">Arsip</option></select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className="flex justify-end gap-3 mt-4 pt-5 border-t border-slate-100 shrink-0">
                                <button type="button" onClick={() => setIo(false)} className="btn-secondary px-6">Batal</button>
                                <button type="submit" className="btn-primary px-8"><i className="fas fa-save mr-2"></i>Simpan Data</button>
                            </div>
                        </form>
                    </div>
                </div>
            )}
        </div>
    );
};
const BukuView = ({ data = [], peminjaman = [], onAdd, onUpdate, onDelete, showAlert }) => {
    const iF = { judul: '', anakJudul: '', pengarang: '', penerbit: '', kotaTerbit: '', tahun: '', deskripsiFisik: '', isbn: '', subjek: '', klasifikasiDDC: '000 - Komputer, Informasi, dan Karya Umum', kodeLabel: '', sinopsis: '', cover: '', noInduk: '', lokasiRak: '', sumberPerolehan: 'BOSP', stock: 1, stockAwal: 1, hargaSatuan: 0, tglMasuk: new Date().toISOString().split('T')[0] };
    
    const [io, setIo] = useState(false), [eId, setEId] = useState(null), [f, setF] = useState(''), [fm, setFm] = useState(iF), [aT, setAT] = useState('metadata');
    const [rM, setRM] = useState({ is: false, b: null, alasan: '', tgl: new Date().toISOString().split('T')[0] });
    const [isFetchingIsbn, setIsFetchingIsbn] = useState(false);
    const [scanTarget, setScanTarget] = useState(null);
    const [currentPage, setCurrentPage] = useState(1);
    const itemsPerPage = 25;

    // PENGAMAN TEKS ANTI-CRASH (Mencegah layar putih jika ada data corrupt/object/null di Firebase)
    const safeStr = (val) => {
        if (val === null || val === undefined) return '';
        if (typeof val === 'object') return JSON.stringify(val);
        return String(val);
    };

    const safeBuku = Array.isArray(data) ? data : [];
    const safePinjam = Array.isArray(peminjaman) ? peminjaman : [];

    // FUNGSI PENENTU KODE LABEL PUNGGUNG BUKU LOKAL
    const getSpineCode = (pengarangRaw, judulRaw) => {
        if (typeof hitungKodeSpinePintar === 'function') {
            return hitungKodeSpinePintar(safeStr(pengarangRaw), safeStr(judulRaw));
        }
        const pStr = safeStr(pengarangRaw);
        if (!pStr) return "";
        const listP = pStr.split(',').map(p => p.trim()).filter(Boolean);
        const jStr = safeStr(judulRaw).trim();
        if (listP.length === 0) return "";
        if (listP.length <= 3) {
            return `${listP[0].substring(0, 3).toUpperCase()} ${jStr ? jStr.charAt(0).toLowerCase() : ""}`.trim();
        }
        return `${jStr.substring(0, 3).toUpperCase()} ${listP[0] ? listP[0].charAt(0).toLowerCase() : ""}`.trim();
    };

    // FUNGSI AUTO-FILL KATALOG DARI ISBN
    const fetchBookByISBN = async (rawIsbn) => {
        const cleanIsbn = safeStr(rawIsbn).replace(/[^0-9Xx]/g, '');
        if (!cleanIsbn || cleanIsbn.length < 10) {
            return showAlert && showAlert('ISBN Tidak Valid', 'Masukkan minimal 10 atau 13 angka ISBN.', 'warning');
        }
        setIsFetchingIsbn(true);
        try {
            let found = null;
            const resG = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${cleanIsbn}`);
            const dataG = await resG.json();
            if (dataG.items && dataG.items.length > 0) {
                const info = dataG.items[0].volumeInfo || {};
                found = {
                    judul: safeStr(info.title),
                    anakJudul: safeStr(info.subtitle),
                    pengarang: Array.isArray(info.authors) ? info.authors.join(', ') : '',
                    penerbit: safeStr(info.publisher),
                    tahun: safeStr(info.publishedDate).substring(0, 4),
                    deskripsiFisik: info.pageCount ? `${info.pageCount} hlm.` : '',
                    subjek: Array.isArray(info.categories) ? info.categories.join(', ') : '',
                    sinopsis: safeStr(info.description),
                    cover: info.imageLinks?.thumbnail ? info.imageLinks.thumbnail.replace('http://', 'https://') : ''
                };
            } else {
                const resOL = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${cleanIsbn}&format=json&jscmd=data`);
                const dataOL = await resOL.json();
                const bookOL = dataOL[`ISBN:${cleanIsbn}`];
                if (bookOL) {
                    found = {
                        judul: safeStr(bookOL.title),
                        anakJudul: safeStr(bookOL.subtitle),
                        pengarang: Array.isArray(bookOL.authors) ? bookOL.authors.map(a => a.name).join(', ') : '',
                        penerbit: Array.isArray(bookOL.publishers) ? bookOL.publishers.map(p => p.name).join(', ') : '',
                        tahun: safeStr(bookOL.publish_date).match(/\d{4}/)?.[0] || '',
                        deskripsiFisik: bookOL.number_of_pages ? `${bookOL.number_of_pages} hlm.` : '',
                        subjek: Array.isArray(bookOL.subjects) ? bookOL.subjects.slice(0, 3).map(s => s.name).join(', ') : '',
                        sinopsis: typeof bookOL.notes === 'string' ? bookOL.notes : '',
                        cover: bookOL.cover?.medium || bookOL.cover?.small || ''
                    };
                }
            }

            if (found) {
                setFm(prev => ({
                    ...prev,
                    isbn: cleanIsbn,
                    noInduk: prev.noInduk || cleanIsbn,
                    judul: found.judul || prev.judul,
                    anakJudul: found.anakJudul || prev.anakJudul,
                    pengarang: found.pengarang || prev.pengarang,
                    penerbit: found.penerbit || prev.penerbit,
                    tahun: found.tahun || prev.tahun,
                    deskripsiFisik: found.deskripsiFisik || prev.deskripsiFisik,
                    subjek: found.subjek || prev.subjek,
                    sinopsis: found.sinopsis || prev.sinopsis,
                    cover: found.cover || prev.cover,
                    kodeLabel: getSpineCode(found.pengarang || prev.pengarang, found.judul || prev.judul)
                }));
                showAlert && showAlert('Auto-Fill Berhasil!', `Data buku "${found.judul}" berhasil ditarik otomatis dari database ISBN.`, 'success');
            } else {
                setFm(prev => ({ ...prev, isbn: cleanIsbn, noInduk: prev.noInduk || cleanIsbn }));
                showAlert && showAlert('ISBN Tercatat', `Kode ISBN ${cleanIsbn} berhasil di-scan, namun detail buku belum terdaftar di database publik. Silakan lengkapi judul secara manual.`, 'info');
            }
        } catch (err) {
            showAlert && showAlert('Gagal Menarik Data', 'Terjadi gangguan koneksi saat menghubungi server ISBN.', 'error');
        } finally {
            setIsFetchingIsbn(false);
        }
    };

    const getTrueStockAwal = (b) => {
        if (!b) return 1;
        const activeLoansCount = safePinjam.filter(p => p && p.idBuku === b.id && p.status === 'Dipinjam').length;
        const minimumFisik = (parseInt(b.stock) || 0) + activeLoansCount;
        const savedAwal = parseInt(b.stockAwal);
        if (!isNaN(savedAwal) && savedAwal >= minimumFisik) return savedAwal;
        return minimumFisik;
    };

    const handleEditClick = (bukuItem) => {
        if (!bukuItem) return;
        const calculatedAwal = getTrueStockAwal(bukuItem);
        setFm({ ...iF, ...bukuItem, stockAwal: calculatedAwal });
        setEId(bukuItem.id);
        setIo(true);
        setAT('metadata');
    };

    const hS = e => { 
        e.preventDefault(); 
        if (Number(fm.stock) > Number(fm.stockAwal || fm.stock)) {
            return showAlert && showAlert('Peringatan', 'Stok Tersedia tidak boleh melebihi Stok Awal!', 'warning');
        }
        if (eId) onUpdate(eId, fm); 
        else onAdd({ ...fm, status: 'Aktif' }); 
        
        setIo(false); setEId(null); setFm(iF); setAT('metadata'); 
        showAlert && showAlert('Berhasil', `Data disimpan.`, 'success'); 
    };
    
    const hC = e => { 
        const l = e.target.files && e.target.files[0]; 
        if (l) { 
            if (l.size > 500000) return showAlert && showAlert("Kebesaran", "Maks 500KB", "warning"); 
            const r = new FileReader(); 
            r.onloadend = () => setFm({ ...fm, cover: r.result }); 
            r.readAsDataURL(l); 
        } 
    };
    
    const hE = () => {
        try {
            const ws = XLSX.utils.json_to_sheet(safeBuku.filter(b => b && b.status !== 'Direduksi').map(b => ({
                "No Induk": safeStr(b.noInduk), "ISBN": safeStr(b.isbn), "Judul Buku": safeStr(b.judul), "Anak Judul": safeStr(b.anakJudul),
                "Pengarang": safeStr(b.pengarang), "Penerbit": safeStr(b.penerbit), "Kota Terbit": safeStr(b.kotaTerbit), "Tahun": safeStr(b.tahun),
                "Deskripsi Fisik": safeStr(b.deskripsiFisik), "Subjek": safeStr(b.subjek), "Sumber Pengadaan": safeStr(b.sumberPerolehan),
                "Klasifikasi DDC": safeStr(b.klasifikasiDDC), "Kode Label": safeStr(b.kodeLabel), "Tanggal Masuk": safeStr(b.tglMasuk),
                "Sinopsis": safeStr(b.sinopsis), "Rak": safeStr(b.lokasiRak), 
                "Harga Satuan": parseInt(b.hargaSatuan) || 0,
                "Stok Awal": getTrueStockAwal(b), 
                "Stok Tersedia": parseInt(b.stock) || 0
            })));
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Buku");
            XLSX.writeFile(wb, "Data_Buku.xlsx");
        } catch (err) {
            showAlert && showAlert('Error Export', err.message, 'error');
        }
    };

    const hI = e => {
        const l = e.target.files && e.target.files[0]; if (!l) return;
        const r = new FileReader();
        r.onload = ev => {
            try {
                const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' }); 
                const d = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                let count = 0;
                d.forEach(rw => {
                    if (rw["Judul Buku"]) {
                        onAdd({
                            noInduk: safeStr(rw["No Induk"]), isbn: safeStr(rw["ISBN"]), judul: safeStr(rw["Judul Buku"]),
                            anakJudul: safeStr(rw["Anak Judul"]), pengarang: safeStr(rw["Pengarang"]), penerbit: safeStr(rw["Penerbit"]),
                            kotaTerbit: safeStr(rw["Kota Terbit"]), tahun: safeStr(rw["Tahun"]), deskripsiFisik: safeStr(rw["Deskripsi Fisik"]),
                            subjek: safeStr(rw["Subjek"]), sumberPerolehan: safeStr(rw["Sumber Pengadaan"] || 'BOSP'),
                            klasifikasiDDC: safeStr(rw["Klasifikasi DDC"] || '000 - Komputer, Informasi, dan Karya Umum'),
                            kodeLabel: safeStr(rw["Kode Label"]), tglMasuk: safeStr(rw["Tanggal Masuk"] || new Date().toISOString().split('T')[0]),
                            sinopsis: safeStr(rw["Sinopsis"]), lokasiRak: safeStr(rw["Rak"]),
                            hargaSatuan: parseInt(rw["Harga Satuan"] || rw["Harga"]) || 0,
                            stockAwal: parseInt(rw["Stok Awal"] || rw["Stok"] || rw["Stock"]) || 1, 
                            stock: parseInt(rw["Stok Tersedia"] || rw["Stok"] || rw["Stock"]) || 1, status: 'Aktif'
                        });
                        count++;
                    }
                });
                showAlert && showAlert('Sukses', `Import ${count} buku berhasil.`, 'success');
            } catch (err) { showAlert && showAlert('Gagal', 'Gagal memproses file import.', 'error'); } 
            e.target.value = null;
        }; 
        r.readAsArrayBuffer(l);
    };

    // FILTER SELURUH DATA DENGAN PENGAMAN PENUH
    const fD = safeBuku.filter(i => {
        if (!i || i.status === 'Direduksi') return false;
        const fl = safeStr(f).toLowerCase();
        const bf = fl.replace(/-\d+$/, '');
        return safeStr(i.judul).toLowerCase().includes(fl) || 
               safeStr(i.isbn).toLowerCase().includes(bf) || 
               safeStr(i.noInduk).toLowerCase().includes(bf) || 
               safeStr(i.pengarang).toLowerCase().includes(fl);
    });

    const totalPages = Math.max(1, Math.ceil(fD.length / itemsPerPage));
    const safePage = Math.min(currentPage, totalPages);
    const currentData = fD.slice((safePage - 1) * itemsPerPage, safePage * itemsPerPage);
    const activeLoansForm = eId ? safePinjam.filter(p => p && p.idBuku === eId && p.status === 'Dipinjam').length : 0;

    return (
        <div className="bg-white rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border-0 overflow-hidden flex flex-col min-h-[80vh]">
            <div className="p-6 md:p-8 border-b flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4 shrink-0">
                <div className="flex items-center gap-3 w-full xl:w-auto">
                    <h2 className="text-2xl font-black shrink-0">Daftar Buku</h2>
                    <div className="relative flex-1 md:w-80 flex gap-2">
                        <div className="relative flex-1">
                            <i className="fas fa-barcode absolute left-4 top-3.5 text-indigo-400"></i>
                            <input 
                                type="text" 
                                placeholder="Scan/Cari Judul, ISBN..." 
                                className="input-field pl-11 py-2.5 text-sm" 
                                value={f} 
                                onChange={e => { setF(e.target.value); setCurrentPage(1); }} 
                            />
                        </div>
                        <button type="button" onClick={() => setScanTarget('search')} className="px-4 bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white rounded-2xl transition-colors shrink-0" title="Scan Cari Buku via HP">
                            <i className="fas fa-camera"></i>
                        </button>
                    </div>
                </div>
                <div className="flex flex-wrap gap-3">
                    <button onClick={hE} className="btn-secondary"><i className="fas fa-file-excel mr-2 text-green-500"></i> Export</button>
                    <label className="btn-secondary cursor-pointer mb-0"><i className="fas fa-file-upload mr-2 text-blue-500"></i> Import<input type="file" accept=".xlsx, .xls" onChange={hI} className="hidden" /></label>
                    <button onClick={() => { setFm(iF); setEId(null); setIo(true); setAT('metadata'); }} className="btn-primary"><i className="fas fa-plus mr-2"></i> Tambah</button>
                </div>
            </div>
            
            <div className="overflow-x-auto p-4 flex-1">
                <table className="w-full text-left text-sm">
                    <thead className="bg-indigo-50/50 text-indigo-600 font-bold uppercase text-[11px] rounded-xl">
                        <tr>
                            <th className="py-4 px-6 rounded-l-2xl">Identitas (No/ISBN)</th>
                            <th className="py-4 px-6">Judul Buku</th>
                            <th className="py-4 px-6">Klasifikasi & Lokasi</th>
                            <th className="py-4 px-6">Informasi Stok</th>
                            <th className="py-4 px-6 text-right rounded-r-2xl">Aksi</th>
                        </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-50">
                        {currentData.length === 0 ? (
                            <tr><td colSpan="5" className="text-center py-12 text-slate-400 font-bold">Buku tidak ditemukan.</td></tr>

                            </div>
                            
                            <div className={aT === 'inventaris' ? 'block space-y-6' : 'hidden'}>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">

            {typeof FastScannerModal !== 'undefined' && (

                    isOpen={!!scanTarget} 
                    onClose={() => setScanTarget(null)}

                    continuous={false}
                    onDetected={(code) => {
                        if (scanTarget === 'isbn') fetchBookByISBN(code);
                        else if (scanTarget === 'search') { setF(code); setCurrentPage(1); }
                    }} 
                />
            )}
        </div>
    );
};

const ReduksiView = ({ data, onUpdate, onDelete, onPrint, filter, setFilter }) => {
            const [p, setP] = useState(1); const l = 10;
            const rD = useMemo(() => data.filter(b => {
                if (b.status !== 'Direduksi') return false;
                if (!b.tglReduksi) return true;
                let m = true;
                if (filter.start) m = m && b.tglReduksi >= filter.start;
                if (filter.end) m = m && b.tglReduksi <= filter.end;
                return m;
            }).sort((a, b) => (b.tglReduksi || '').localeCompare(a.tglReduksi || '')), [data, filter]);
            
            const tP = Math.ceil(rD.length / l) || 1; const pg = rD.slice((p - 1) * l, p * l);
            
            return (
                <div className="bg-white rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border-0 overflow-hidden flex flex-col h-[80vh]">

                        <div className="flex flex-wrap items-center gap-3">
                            <Input type="date" value={filter.start} onChange={e => { setFilter({ ...filter, start: e.target.value }); setP(1); }} className="w-auto" />
                            <span className="font-bold text-slate-400">-</span>
                            <Input type="date" value={filter.end} onChange={e => { setFilter({ ...filter, end: e.target.value }); setP(1); }} className="w-auto" />
                            <button onClick={() => onPrint('reduksi')} className="btn-primary ml-2"><i className="fas fa-print mr-2"></i> Cetak Laporan</button>
                        </div>
                    </div>
                    <div className="flex-1 overflow-x-auto p-4">
                        <table className="w-full text-left text-sm">
                            <thead className="bg-rose-50/50 text-rose-600 font-bold uppercase text-[11px] rounded-xl">
                                <tr>
                                    <th className="py-4 px-6 rounded-l-2xl w-32">Tgl Reduksi</th>
                                    <th className="py-4 px-6">Identitas Buku</th>
                                    <th className="py-4 px-6">Alasan</th>
                                    <th className="py-4 px-6 text-right rounded-r-2xl">Aksi</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-50">
                                {pg.length === 0 ? <tr><td colSpan="4" className="text-center py-10 font-bold text-slate-400">Tidak ada data reduksi buku.</td></tr> : pg.map(i => (
                                    <tr key={i.id} className="hover:bg-slate-50/50 group">
                                        <td className="py-4 px-6 font-bold">{i.tglReduksi ? formatDate(i.tglReduksi) : '-'}</td>
                                        <td className="py-4 px-6"><p className="font-black text-slate-800">{i.judul}</p>{i.anakJudul && <p className="text-[10px] italic text-slate-500">{i.anakJudul}</p>}<p className="text-xs text-slate-500 font-mono mt-1">{i.noInduk} | {i.isbn}</p></td>
                                        <td className="py-4 px-6"><span className="bg-rose-100 text-rose-700 px-3 py-1.5 rounded-lg text-xs font-black">{i.alasanReduksi}</span></td>
                                        <td className="py-4 px-6 flex justify-end gap-2 opacity-100 md:opacity-0 group-hover:opacity-100">
                                            <button onClick={() => onUpdate(i.id, { status: 'Aktif', alasanReduksi: null, tglReduksi: null })} className="w-9 h-9 bg-emerald-50 text-emerald-500 rounded-xl hover:bg-emerald-500 hover:text-white" title="Kembalikan ke Katalog Aktif"><i className="fas fa-rotate-left"></i></button>
                                            <button onClick={() => onDelete(i.id)} className="w-9 h-9 bg-slate-100 text-slate-500 rounded-xl hover:bg-slate-500 hover:text-white" title="Hapus Permanen dari Database"><i className="fas fa-trash"></i></button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                    <div className="p-4 border-t flex justify-center items-center gap-4 shrink-0">
                        <button disabled={p === 1} onClick={() => setP(p - 1)} className="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center font-bold text-slate-600 disabled:opacity-50 hover:bg-indigo-100 hover:text-indigo-600 transition-colors"><i className="fas fa-chevron-left"></i></button>
                        <span className="font-black text-sm text-slate-700">Halaman {p} dari {tP}</span>
                        <button disabled={p === tP} onClick={() => setP(p + 1)} className="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center font-bold text-slate-600 disabled:opacity-50 hover:bg-indigo-100 hover:text-indigo-600 transition-colors"><i className="fas fa-chevron-right"></i></button>
                    </div>
                </div>
            );
        };

        const PencarianBukuView = ({ data }) => {
            const [s, setS] = useState(''), [sB, setSB] = useState(null);
            
            // STATE BARU UNTUK PAGINATION (PAGINASI)
            const [currentPage, setCurrentPage] = useState(1);
            const itemsPerPage = 24; // 24 pas untuk grid karena habis dibagi 2, 3, dan 4

            const f = data.filter(b => {
                if (b.status === 'Direduksi') return false;
                const sl = s.toLowerCase(), bs = sl.replace(/-\d+$/, '');
                return String(b.judul || '').toLowerCase().includes(sl) || String(b.pengarang || '').toLowerCase().includes(sl) || String(b.isbn || '').toLowerCase().includes(bs) || String(b.noInduk || '').toLowerCase().includes(bs);
            });

            // LOGIKA PAGINATION
            const totalPages = Math.ceil(f.length / itemsPerPage) || 1;
            const currentData = f.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

            return (

                                autoFocus={true} 
                                placeholder="Scan Barcode / Cari ISBN, Judul..." 
                                className="w-full pl-16 pr-6 py-5 rounded-2xl border-2 border-indigo-50 shadow-lg text-lg focus:outline-none focus:ring-4 focus:ring-indigo-100" 
                                value={s} 
                                onChange={e => { 
                                    setS(e.target.value); 
                                    setCurrentPage(1); // Reset ke halaman 1 saat mengetik pencarian

                            />

                    <div className="p-6 md:p-10 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8 bg-slate-50/50 flex-1 overflow-y-auto content-start">
                        {currentData.length === 0 ? (
                            <div className="col-span-full text-center py-12 text-slate-400">

                                <p className="font-bold text-lg">Buku tidak ditemukan.</p>
                            </div>

// --- MESIN PEMBUAT KODE UNIK PENDEK (ANTI-BLUR BARCODE) ---
const getShortBarcode = (text) => {
    if (!text) return "";
    const str = String(text).replace(/\s+/g, '').toUpperCase();
    
    // Jika kode aslinya sudah pendek (maks 8 karakter), jangan diubah
    if (str.length <= 8) return str; 
    
    // Jika panjang, ubah menjadi Hash Base36 + 3 Digit Terakhir (Dijamin Unik & Pendek)
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash |= 0; 
    }
    const shortHash = Math.abs(hash).toString(36).toUpperCase();
    const tail = str.slice(-3); // Ambil 3 angka terakhir ID sebagai pelindung bentrok
    
    return `${shortHash}${tail}`; // Contoh hasil cetak: 7XK2M023 (Sangat tebal & jelas)
    };
    // --- GENERATOR SEGEL DIGITAL OFFLINE (ANTI-PEMALSUAN SURAT BEBAS PUSTAKA) ---
const getValidasiToken = (siswa) => {
    if (!siswa) return "LKB-000000";
    // Menggabungkan ID, NISN, Nama, dan Salt Rahasia Sekolah
    const rawStr = `${siswa.id || ''}|${siswa.nisn || ''}|${(siswa.nama || '').toUpperCase()}|SMKN1JBR_SECRET_2026`;
    let h1 = 0xdeadbeef ^ rawStr.length;
    let h2 = 0x41c6ce57 ^ rawStr.length;
    for (let i = 0, ch; i < rawStr.length; i++) {
        ch = rawStr.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    const code = (h1 >>> 0).toString(16).toUpperCase().padStart(6, '0').slice(0, 6);
    return `LKB-${code}`;
};
// --- GENERATOR GAMBAR QR CODE LOKAL (INSTAN & 100% MUNCUL SAAT PRINT) ---
const generateLocalQR = (text) => {
    try {
        if (typeof qrcode === 'function') {
            const qr = qrcode(0, 'M');
            qr.addData(text);
            qr.make();
            return qr.createDataURL(4, 1); // Langsung jadi gambar Base64 di memori!
        }
    } catch (e) { console.error(e); }
    return `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(text)}`;
};
