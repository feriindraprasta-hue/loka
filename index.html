        };
const AnalitikAkreditasiView = ({ buku, anggota, peminjaman, kehadiran, sekolah }) => {
            const [tahunFilter, setTahunFilter] = useState(new Date().getFullYear().toString());
            const chartTrenRef = useRef(null);
            const chartDDCRef = useRef(null);
            const chartJurusanRef = useRef(null);
            const chartInstances = useRef({});

            // Statistik Koleksi & Indikator Akreditasi Perpusnas
            const stats = useMemo(() => {
                const koleksiAktif = buku.filter(b => b.status !== 'Direduksi');
                const totalJudul = koleksiAktif.length;
                const totalEksemplar = koleksiAktif.reduce((acc, b) => acc + (parseInt(b.stockAwal) || parseInt(b.stock) || 1), 0);
                const totalNilaiAset = koleksiAktif.reduce((acc, b) => acc + ((parseInt(b.hargaSatuan) || 0) * (parseInt(b.stockAwal) || parseInt(b.stock) || 1)), 0);

                const anggotaAktif = anggota.filter(a => a.status === 'Aktif');
                const totalSiswa = anggotaAktif.filter(a => a.kategori === 'Siswa').length || 1;

                // Standar Perpusnas: Rasio kecukupan buku minimal 1:3 (3 buku per siswa), Persentase Fiksi vs Non-Fiksi (DDC 800 vs Lainnya)
                const rasioEksemplarPerSiswa = (totalEksemplar / totalSiswa).toFixed(2);
                const judulNonFiksi = koleksiAktif.filter(b => !String(b.klasifikasiDDC || '').startsWith('800')).length;
                const persenNonFiksi = totalJudul > 0 ? Math.round((judulNonFiksi / totalJudul) * 100) : 0;

                // Tren Bulanan (12 Bulan di Tahun Terpilih)
                const bulanLabels = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
                const kunjunganBulanan = Array(12).fill(0);
                const pinjamBulanan = Array(12).fill(0);

                kehadiran.forEach(k => {
                    if (k.tanggal && k.tanggal.startsWith(tahunFilter)) {
                        const m = parseInt(k.tanggal.substring(5, 7), 10) - 1;
                        if (m >= 0 && m < 12) kunjunganBulanan[m]++;
                    }
                });

                peminjaman.forEach(p => {
                    if (p.tglPinjam && p.tglPinjam.startsWith(tahunFilter)) {
                        const m = parseInt(p.tglPinjam.substring(5, 7), 10) - 1;
                        if (m >= 0 && m < 12) pinjamBulanan[m]++;
                    }
                });

                // Distribusi Klasifikasi DDC (000 - 900)
                const ddcMap = { '000': 0, '100': 0, '200': 0, '300': 0, '400': 0, '500': 0, '600': 0, '700': 0, '800': 0, '900': 0 };
                koleksiAktif.forEach(b => {
                    const code = getDDC(b.klasifikasiDDC);
                    if (ddcMap[code] !== undefined) ddcMap[code]++;
                    else ddcMap['000']++;
                });

                // Rasio Kunjungan & Peminjaman per Jurusan
                const jurusanMap = {};
                (sekolah?.daftarJurusan || DEFAULT_JURUSAN).forEach(j => { jurusanMap[j.singkatan] = 0; });
                kehadiran.forEach(k => {
                    if (k.kategori === 'Siswa' && k.tanggal?.startsWith(tahunFilter)) {
                        const singkatan = getSingkatanJurusan(k.jurusan, sekolah?.daftarJurusan) || 'Lainnya';
                        jurusanMap[singkatan] = (jurusanMap[singkatan] || 0) + 1;
                    }
                });

                // Top 10 Duta Literasi (Gabungan Kunjungan + Peminjaman di Tahun Terpilih)
                const skorSiswa = {};
                kehadiran.forEach(k => {
                    if (k.tanggal?.startsWith(tahunFilter) && k.idAnggota) {
                        if (!skorSiswa[k.idAnggota]) skorSiswa[k.idAnggota] = { hadir: 0, pinjam: 0 };
                        skorSiswa[k.idAnggota].hadir++;
                    }
                });
                peminjaman.forEach(p => {
                    if (p.tglPinjam?.startsWith(tahunFilter) && !p.isPaket && p.idAnggota) {
                        if (!skorSiswa[p.idAnggota]) skorSiswa[p.idAnggota] = { hadir: 0, pinjam: 0 };
                        skorSiswa[p.idAnggota].pinjam++;
                    }
                });

                const dutaLiterasi = Object.entries(skorSiswa)
                    .map(([id, s]) => {
                        const u = anggota.find(a => a.id === id);
                        if (!u || u.kategori !== 'Siswa') return null;
                        return { user: u, hadir: s.hadir, pinjam: s.pinjam, totalSkor: (s.pinjam * 2) + s.hadir };
                    })
                    .filter(Boolean)
                    .sort((a, b) => b.totalSkor - a.totalSkor)
                    .slice(0, 10);

                return {
                    totalJudul, totalEksemplar, totalNilaiAset, totalSiswa,
                    rasioEksemplarPerSiswa, persenNonFiksi,
                    bulanLabels, kunjunganBulanan, pinjamBulanan,
                    ddcMap, jurusanMap, dutaLiterasi,
                    totalKunjunganTahun: kunjunganBulanan.reduce((a, b) => a + b, 0),
                    totalPinjamTahun: pinjamBulanan.reduce((a, b) => a + b, 0)
                };
            }, [buku, anggota, peminjaman, kehadiran, tahunFilter, sekolah]);

            // Render Grafik Chart.js
            useEffect(() => {
                if (!window.Chart) return;
                Object.values(chartInstances.current).forEach(c => c?.destroy());

                if (chartTrenRef.current) {
                    chartInstances.current.tren = new Chart(chartTrenRef.current, {
                        type: 'bar',
                        data: {
                            labels: stats.bulanLabels,
                            datasets: [
                                { label: 'Kunjungan', data: stats.kunjunganBulanan, backgroundColor: '#6366f1', borderRadius: 6 },
                                { label: 'Peminjaman Buku', data: stats.pinjamBulanan, backgroundColor: '#10b981', borderRadius: 6 }
                            ]
                        },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' } } }
                    });
                }

                if (chartDDCRef.current) {
                    chartInstances.current.ddc = new Chart(chartDDCRef.current, {
                        type: 'doughnut',
                        data: {
                            labels: ['000 Umum', '100 Filsafat', '200 Agama', '300 Sosial', '400 Bahasa', '500 Sains', '600 Teknologi', '700 Seni', '800 Sastra', '900 Sejarah'],
                            datasets: [{
                                data: Object.values(stats.ddcMap),
                                backgroundColor: ['#6366f1', '#8b5cf6', '#10b981', '#f59e0b', '#ec4899', '#06b6d4', '#3b82f6', '#f97316', '#14b8a6', '#64748b']
                            }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { boxWidth: 12, font: { size: 10 } } } } }
                    });
                }

                if (chartJurusanRef.current) {
                    chartInstances.current.jurusan = new Chart(chartJurusanRef.current, {
                        type: 'bar',
                        data: {
                            labels: Object.keys(stats.jurusanMap),
                            datasets: [{ label: 'Kunjungan per Jurusan', data: Object.values(stats.jurusanMap), backgroundColor: '#8b5cf6', borderRadius: 6 }]
                        },
                        options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
                    });
                }

                return () => Object.values(chartInstances.current).forEach(c => c?.destroy());
            }, [stats]);

            const exportExcelAkreditasi = () => {
                const wb = XLSX.utils.book_new();
                const ringkasan = [
                    { "Indikator Akreditasi Perpusnas": "Total Judul Koleksi Aktif", "Nilai": stats.totalJudul, "Standar Minimal": "Min. 1.000 Judul" },
                    { "Indikator Akreditasi Perpusnas": "Total Eksemplar Fisik", "Nilai": stats.totalEksemplar, "Standar Minimal": "Min. 1.500 Eksemplar" },
                    { "Indikator Akreditasi Perpusnas": "Rasio Eksemplar per Siswa", "Nilai": `${stats.rasioEksemplarPerSiswa} Buku/Siswa`, "Standar Minimal": "Ideal >= 3 Buku/Siswa" },
                    { "Indikator Akreditasi Perpusnas": "Persentase Koleksi Non-Fiksi (Pengayaan/Referensi)", "Nilai": `${stats.persenNonFiksi}%`, "Standar Minimal": "Ideal 60% - 70%" },
                    { "Indikator Akreditasi Perpusnas": "Estimasi Nilai Aset Koleksi", "Nilai": `Rp ${stats.totalNilaiAset.toLocaleString('id-ID')}`, "Standar Minimal": "-" },
                    { "Indikator Akreditasi Perpusnas": `Total Kunjungan Tahun ${tahunFilter}`, "Nilai": stats.totalKunjunganTahun, "Standar Minimal": "-" },
                    { "Indikator Akreditasi Perpusnas": `Total Sirkulasi Peminjaman Tahun ${tahunFilter}`, "Nilai": stats.totalPinjamTahun, "Standar Minimal": "-" }
                ];
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ringkasan), "Indikator Akreditasi");
                XLSX.writeFile(wb, `Laporan_Akreditasi_Lokabaca_${tahunFilter}.xlsx`);
            };

            return (
                <div className="space-y-6">
                    {/* Header Analitik */}
                    <div className="bg-white p-6 md:p-8 rounded-[2rem] shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4 print:hidden">
                        <div>
                            <h2 className="text-2xl font-black text-slate-800 flex items-center gap-3">
                                <i className="fas fa-chart-pie text-indigo-600"></i> Analitik & Borang Akreditasi Perpustakaan
                            </h2>
                            <p className="text-sm font-bold text-slate-500 mt-1">Data statistik otomatis sesuai instrumen akreditasi Perpusnas RI</p>
                        </div>
                        <div className="flex flex-wrap gap-3 items-center">
                            <select className="input-field w-36 py-2.5 font-black text-indigo-700 bg-indigo-50" value={tahunFilter} onChange={e => setTahunFilter(e.target.value)}>
                                {[0, 1, 2, 3].map(offset => {
                                    const yr = (new Date().getFullYear() - offset).toString();
                                    return <option key={yr} value={yr}>Tahun {yr}</option>;
                                })}
                            </select>
                            <button onClick={exportExcelAkreditasi} className="btn-secondary text-emerald-600 border-emerald-200"><i className="fas fa-file-excel mr-2"></i> Unduh Excel</button>
                            <button onClick={() => window.print()} className="btn-primary"><i className="fas fa-print mr-2"></i> Cetak Borang PDF</button>
                        </div>
                    </div>

                    {/* Kartu Indikator Standar Akreditasi */}
                    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-5 print:hidden">
                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                            <p className="text-[10px] font-black uppercase tracking-widest text-slate-400">Koleksi (Judul / Eksemplar)</p>
                            <h3 className="text-2xl font-black text-slate-800 mt-1">{stats.totalJudul} <span className="text-sm font-bold text-indigo-500">/ {stats.totalEksemplar} Eks</span></h3>
                            <p className="text-[11px] font-bold text-emerald-600 mt-2"><i className="fas fa-check-circle mr-1"></i>Non-Fiksi: {stats.persenNonFiksi}% (Ideal 60-70%)</p>
                        </div>
                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                            <p className="text-[10px] font-black uppercase tracking-widest text-slate-400">Rasio Kecukupan Koleksi</p>
                            <h3 className="text-2xl font-black text-indigo-600 mt-1">1 : {stats.rasioEksemplarPerSiswa}</h3>
                            <p className="text-[11px] font-bold text-slate-500 mt-2">({stats.totalEksemplar} Buku untuk {stats.totalSiswa} Siswa Aktif)</p>
                        </div>
                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                            <p className="text-[10px] font-black uppercase tracking-widest text-slate-400">Sirkulasi & Kunjungan ({tahunFilter})</p>
                            <h3 className="text-2xl font-black text-emerald-600 mt-1">{stats.totalKunjunganTahun} <span className="text-sm font-bold text-slate-500">Hadir</span></h3>
                            <p className="text-[11px] font-bold text-indigo-600 mt-2"><i className="fas fa-book-reader mr-1"></i>Total Dipinjam: {stats.totalPinjamTahun} Trx</p>
                        </div>
                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                            <p className="text-[10px] font-black uppercase tracking-widest text-slate-400">Valuasi Aset Koleksi</p>
                            <h3 className="text-xl font-black text-amber-600 mt-1">Rp {stats.totalNilaiAset.toLocaleString('id-ID')}</h3>
                            <p className="text-[11px] font-bold text-slate-400 mt-2">Berdasarkan harga satuan buku</p>
                        </div>
                    </div>

                    {/* Visualisasi Grafik Chart.js */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 print:hidden">
                        <div className="lg:col-span-2 bg-white p-6 rounded-[2rem] shadow-sm">
                            <h3 className="font-black text-slate-800 mb-4 text-sm uppercase tracking-wider">Tren Kunjungan & Peminjaman Bulanan ({tahunFilter})</h3>
                            <div className="h-72"><canvas ref={chartTrenRef}></canvas></div>
                        </div>
                        <div className="bg-white p-6 rounded-[2rem] shadow-sm">
                            <h3 className="font-black text-slate-800 mb-4 text-sm uppercase tracking-wider">Proporsi Klasifikasi DDC</h3>
                            <div className="h-72"><canvas ref={chartDDCRef}></canvas></div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 print:hidden">
                        <div className="bg-white p-6 rounded-[2rem] shadow-sm">
                            <h3 className="font-black text-slate-800 mb-4 text-sm uppercase tracking-wider">Tingkat Kunjungan per Kompetensi Keahlian (Jurusan)</h3>
                            <div className="h-72"><canvas ref={chartJurusanRef}></canvas></div>
                        </div>
                        <div className="bg-white p-6 rounded-[2rem] shadow-sm flex flex-col">
                            <h3 className="font-black text-slate-800 mb-4 text-sm uppercase tracking-wider"><i className="fas fa-medal text-amber-500 mr-2"></i>Top 10 Duta Literasi Sekolah ({tahunFilter})</h3>
                            <div className="overflow-y-auto max-h-72 custom-scrollbar pr-2 space-y-2">
                                {stats.dutaLiterasi.map((d, i) => (
                                    <div key={d.user.id} className="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-100">
                                        <div className="flex items-center gap-3">
                                            <span className="w-7 h-7 rounded-lg bg-indigo-600 text-white font-black text-xs flex items-center justify-center">#{i + 1}</span>
                                            <div>
                                                <p className="font-black text-slate-800 text-sm">{d.user.nama}</p>
                                                <p className="text-[10px] font-bold text-indigo-500 uppercase">{formatKelasSiswa(d.user, sekolah?.daftarJurusan)}</p>
                                            </div>
                                        </div>
                                        <div className="text-right text-xs font-bold text-slate-600">
                                            <span className="text-emerald-600 font-black">{d.pinjam} Pinjam</span> • <span>{d.hadir} Hadir</span>
                                        </div>
                                    </div>
                                ))}
                                {stats.dutaLiterasi.length === 0 && <p className="text-center text-slate-400 font-bold py-12">Belum ada aktivitas siswa di tahun {tahunFilter}.</p>}
                            </div>
                        </div>
                    </div>

                    {/* Area Cetak Resmi Borang Akreditasi (Muncul Saat Ctrl+P / Cetak PDF) */}
                    <div id="print-area" className="hidden print:block bg-white text-black p-8">
                        <KopSurat sekolah={sekolah} />
                        <h2 style={{ textAlign: 'center', fontSize: '14pt', fontWeight: 'bold', textTransform: 'uppercase', margin: '15px 0 5px' }}>
                            LAPORAN EKSEKUTIF & BORANG AKREDITASI PERPUSTAKAAN
                        </h2>
                        <p style={{ textAlign: 'center', fontSize: '10pt', marginBottom: '20px' }}>Tahun Pelaporan: <b>{tahunFilter}</b></p>

                        <h4 style={{ fontSize: '11pt', fontWeight: 'bold', marginBottom: '8px' }}>A. Statistik Koleksi & Indikator Standar Nasional (SNP)</h4>
                        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '10pt', marginBottom: '20px' }} border="1">
                            <thead>
                                <tr style={{ backgroundColor: '#f0f0f0' }}>
                                    <th style={{ border: '1px solid #000', padding: '6px' }}>Komponen Instrumen</th>
                                    <th style={{ border: '1px solid #000', padding: '6px', textAlign: 'center' }}>Capaian Riil</th>
                                    <th style={{ border: '1px solid #000', padding: '6px' }}>Keterangan / Acuan Standar</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr><td style={{ border: '1px solid #000', padding: '6px' }}>Total Koleksi Buku (Judul / Eksemplar)</td><td style={{ border: '1px solid #000', padding: '6px', textAlign: 'center', fontWeight: 'bold' }}>{stats.totalJudul} Judul / {stats.totalEksemplar} Eks</td><td style={{ border: '1px solid #000', padding: '6px' }}>Non-Fiksi: {stats.persenNonFiksi}%</td></tr>
                                <tr><td style={{ border: '1px solid #000', padding: '6px' }}>Rasio Buku per Siswa Aktif</td><td style={{ border: '1px solid #000', padding: '6px', textAlign: 'center', fontWeight: 'bold' }}>1 : {stats.rasioEksemplarPerSiswa}</td><td style={{ border: '1px solid #000', padding: '6px' }}>Total Siswa Aktif: {stats.totalSiswa} Siswa</td></tr>
                                <tr><td style={{ border: '1px solid #000', padding: '6px' }}>Total Kunjungan Pemustaka ({tahunFilter})</td><td style={{ border: '1px solid #000', padding: '6px', textAlign: 'center', fontWeight: 'bold' }}>{stats.totalKunjunganTahun} Kunjungan</td><td style={{ border: '1px solid #000', padding: '6px' }}>Rerata: {Math.round(stats.totalKunjunganTahun / 12)} / bulan</td></tr>
                                <tr><td style={{ border: '1px solid #000', padding: '6px' }}>Total Sirkulasi Peminjaman ({tahunFilter})</td><td style={{ border: '1px solid #000', padding: '6px', textAlign: 'center', fontWeight: 'bold' }}>{stats.totalPinjamTahun} Transaksi</td><td style={{ border: '1px solid #000', padding: '6px' }}>Nilai Aset: Rp {stats.totalNilaiAset.toLocaleString('id-ID')}</td></tr>
                            </tbody>
                        </table>

                        <h4 style={{ fontSize: '11pt', fontWeight: 'bold', marginBottom: '8px' }}>B. Distribusi Koleksi Berdasarkan Kelas DDC (000 - 900)</h4>
                        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '9pt', marginBottom: '20px' }} border="1">
                            <thead>
                                <tr style={{ backgroundColor: '#f0f0f0' }}>
                                    {Object.keys(stats.ddcMap).map(k => <th key={k} style={{ border: '1px solid #000', padding: '5px', textAlign: 'center' }}>Kelas {k}</th>)}
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    {Object.values(stats.ddcMap).map((v, idx) => <td key={idx} style={{ border: '1px solid #000', padding: '5px', textAlign: 'center', fontWeight: 'bold' }}>{v} Judul</td>)}
                                </tr>
                            </tbody>
                        </table>

                        <TandaTangan sekolah={sekolah} />
                    </div>
                </div>
            );
        };

        const App = () => {
            const [pSisaItems, setPSisaItems] = useState([]);
            const [fbU, setFbU] = useState(null);
            const [cU, setCU] = useState(() => { try { const s = sessionStorage.getItem('perpus_current_user'); return s ? JSON.parse(atob(s)) : null } catch (e) { return null } });
            const [aT, setAT] = useState(() => localStorage.getItem('perpus_active_tab') || 'dashboard');
            
            useEffect(() => { if (aT) localStorage.setItem('perpus_active_tab', aT) }, [aT]);
            const [isSyncing, setIsSyncing] = useState(true)
            //const [anggota, setAnggota] = useState([]);
            //const [buku, setBuku] = useState([]);
            //const [peminjaman, setPeminjaman] = useState([]);
            // Ubah state buku
            const [buku, setBuku] = useState(() => {
                try {
                    const cache = localStorage.getItem('lokabaca_cache_buku');
                    return cache ? JSON.parse(cache) : [];
                } catch(e) { return []; }
            });

            // Ubah state anggota
            const [anggota, setAnggota] = useState(() => {
                try {
                    const cache = localStorage.getItem('lokabaca_cache_anggota');
                    return cache ? JSON.parse(cache) : [];
                } catch(e) { return []; }
            });

            // Ubah state peminjaman
            const [peminjaman, setPeminjaman] = useState(() => {
                try {
                    const cache = localStorage.getItem('lokabaca_cache_peminjaman');
                    return cache ? JSON.parse(cache) : [];
                } catch(e) { return []; }
            });

            const [kehadiran, setKehadiran] = useState([]);
            const [quotes, setQuotes] = useState([]);
            
            const [fA, setFA] = useState('');
            const [fR, setFR] = useState({ start: '', end: '', kelas: 'Semua', jurusan: 'Semua', tahun: 'Semua', nama: '' });
            const [fP, setFP] = useState({ kelas: 'Semua', jurusan: 'Semua', rombel: 'Semua', tahun: 'Semua', search: '' });
            const [fL, setFL] = useState('');
            const [fRed, setFRed] = useState({ start: '', end: '' });
            const [fKartu, setFKartu] = useState({ kategori: 'Semua', kelas: 'Semua', jurusan: 'Semua', tahun: 'Semua', search: '' });

            const [fBuku, setFBuku] = useState({ search: '', sumber: 'Semua', tahun: 'Semua' });
            
            const [sBiodata, setSBiodata] = useState(null);
            const [pHilangItems, setPHilangItems] = useState([]);
            
            const [sekolah, setSekolah] = useState(() => { 
                try { 
                    const c = localStorage.getItem('perpus_profil_sekolah');
                    const p = c ? JSON.parse(c) : {}; 
                    return { nama: '', alamat: '', email: '', logo: '', kota: '', kepalaSekolah: '', nipKepalaSekolah: '', kepalaPerpus: '', nipKepala: '', npp: '', daftarJurusan: DEFAULT_JURUSAN, ...p } 
                } catch (e) { 
                    return { nama: '', alamat: '', email: '', logo: '', kota: '', kepalaSekolah: '', nipKepalaSekolah: '', kepalaPerpus: '', nipKepala: '', npp: '', daftarJurusan: DEFAULT_JURUSAN } 
                } 
            });
            
            const [iSO, setISO] = useState(window.innerWidth >= 1024);
            const [iPO, setIPO] = useState(false);
            const [pM, setPM] = useState(false);
            const [iFS, setIFS] = useState(false);
            const [iKL, setIKL] = useState(false);
            
            useEffect(() => { const hR = () => setISO(window.innerWidth >= 1024); window.addEventListener('resize', hR); return () => window.removeEventListener('resize', hR) }, []);
            
            useEffect(() => { 
                const hK = e => { 
                    if (e.ctrlKey && e.key.toLowerCase() === 'z') { 
                        e.preventDefault(); 
                        setIKL(p => { 
                            const n = !p; 
                            if (n) document.documentElement.requestFullscreen().catch(err => console.error(err)); 
                            else if (document.fullscreenElement) document.exitFullscreen().catch(err => console.error(err)); 
                            return n 
                        }); 
                        return 
                    } 
                    if (iKL) { 
                        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'i') || (e.ctrlKey && e.key.toLowerCase() === 'u')) e.preventDefault(); 
                        if (e.ctrlKey && (e.key.toLowerCase() === 't' || e.key.toLowerCase() === 'n' || e.key.toLowerCase() === 'p')) e.preventDefault() 
                    } 
                }; 
                const hFC = () => setIFS(!!document.fullscreenElement); 
                window.addEventListener('keydown', hK); 
                document.addEventListener('fullscreenchange', hFC); 
                return () => { window.removeEventListener('keydown', hK); document.removeEventListener('fullscreenchange', hFC) }; 
            }, [iKL]);

            useEffect(() => { 
                const hC = e => { if (iKL) e.preventDefault() }; 
                const hB = e => { if (iKL) { e.preventDefault(); e.returnValue = '' } }; 
                window.addEventListener('contextmenu', hC); 
                window.addEventListener('beforeunload', hB); 
                return () => { window.removeEventListener('contextmenu', hC); window.removeEventListener('beforeunload', hB) }; 
            }, [iKL]);
            
            const [mC, setMC] = useState({ isOpen: false, title: '', message: '', type: 'info', showCancel: false, onConfirm: null, onCancel: null });
            
            const sA = (t, m, ty = 'info', cb = null) => setMC({ isOpen: true, title: t, message: m, type: ty, showCancel: false, onConfirm: () => { setMC({ isOpen: false }); if (cb) cb(); } });
            const sC = (t, m, oC, onCnl = null) => setMC({ isOpen: true, title: t, message: m, type: 'warning', showCancel: true, onConfirm: () => { oC(); setMC({ isOpen: false }) }, onCancel: () => { setMC({ isOpen: false }); if(onCnl) onCnl(); } });
            
           const hP = t => { 
                if (t === 'label_hilang') {
                    sA("Tips Cetak", "Untuk mencetak/menyimpan PDF: Tekan Ctrl+P, ubah 'Tujuan' menjadi 'Simpan sebagai PDF', atur margin jika perlu, dan hilangkan centang 'Header/Footer'.", "info"); 
                    setPM('label_hilang'); 
                } else if (t === 'pdf' || t === 'rekap_paket' || t === 'reduksi' || t === 'print' || t === 'rekap' || t === 'label' || t === 'kartu' || t === 'buku_pdf') { 
                    sA("Tips Cetak", "Untuk mencetak/menyimpan PDF: Tekan Ctrl+P, ubah 'Tujuan' menjadi 'Simpan sebagai PDF', atur margin jika perlu, dan hilangkan centang 'Header/Footer'.", "info"); 
                    setPM(t); 
                } 
            };
            
            useEffect(() => { 
                const hK = e => { 
                    if (e.ctrlKey && e.key.toLowerCase() === 'q') { 
                        if (cU && cU.role === 'petugas' && aT !== 'kembali' && aT !== 'anggota' && aT !== 'hadir' && aT !== 'peringatan') { 
                            e.preventDefault(); 
                            setIPO(true) 
                        } 
                    } 
                }; 
                window.addEventListener('keydown', hK); 
                return () => window.removeEventListener('keydown', hK) 
            }, [cU, aT]);

            useEffect(() => { 
                auth.signInAnonymously().catch(console.error); 
                const u = auth.onAuthStateChanged(setFbU); 
                return () => u() 
            }, []);

             useEffect(() => { 
                if (!fbU) return; 
                
                const sL = (cN, s) => db.collection(`artifacts/${activeAppId}/public/data/${cN}`).onSnapshot(sp => { 
                    const d = []; 
                    sp.forEach(dc => d.push({ id: dc.id, ...dc.data() })); 
                    s(d); // Update tampilan layar
                    
                    // --- BARIS TAMBAHAN UNTUK CACHE LOKAL ---
                    try {
                            localStorage.setItem(`lokabaca_cache_${cN}`, JSON.stringify(d));
                        } catch (e) { 
                            // Ganti console.error jadi console.warn (warna kuning, bukan merah)
                            console.warn(`Memori penuh saat menyimpan cache ${cN}. Mengosongkan cache lama...`);
                            // Hapus cache yang lama agar ada ruang untuk data baru di kemudian hari
                            localStorage.removeItem(`lokabaca_cache_${cN}`); 
                        }
                    
                    // --- MATIKAN STATUS LOADING ---
                    setIsSyncing(false);
                }, console.error); 
                
                const uA = sL('anggota', setAnggota);
                const uB = sL('buku', setBuku);
                const uP = sL('peminjaman', setPeminjaman);
                const uK = sL('kehadiran', setKehadiran);
                const uQ = sL('quotes', setQuotes); 
                
                const uS = db.doc(`artifacts/${activeAppId}/public/data/pengaturan/profil`).onSnapshot(sp => { 
                    if (sp.exists) { 
                        const d = sp.data(); 
                        setSekolah(d); 
                        try { localStorage.setItem('perpus_profil_sekolah', JSON.stringify(d)) } catch (e) { } 
                    } 
                }, console.error); 
                
                return () => { uA(); uB(); uP(); uK(); uS(); uQ() } 
            }, [fbU]);

            useEffect(() => { 
                let t1, t2; 
                if (pM) { 
                    // Tambahkan pengecualian untuk 'label_sisa' agar tidak otomatis print
                    if (pM === 'label' || pM === 'label_hilang' || pM === 'label_sisa') {
                        // Tidak otomatis diprint/ditutup, menunggu aksi user
                    } else {
                        t1 = setTimeout(() => { window.print(); t2 = setTimeout(() => setPM(false), 500) }, 400) 
                    }
                } 
                return () => { clearTimeout(t1); clearTimeout(t2) } 
            }, [pM]);
            
            const hL = async (u, p) => { 
                try {
                    // 1. Pengecekan fitur web server. Hash tidak bekerja di file:// lokal biasa.
                    if (!crypto || !crypto.subtle) {
                        return sA('Keamanan Diblokir', 'Sistem hash diblokir browser. Pastikan aplikasi berjalan di HTTPS (misal: Google Apps Script), bukan klik langsung di komputer.', 'error');
                    }

                    // 2. Mengubah ketikan user menjadi kode Hash
                    const hashedInput = await hashSHA256(p);
                    
                    // TRIK DEVELOPER: Tampilkan hash asli di Console Browser (Tekan F12)
                    // Copy hash yang muncul di sana lalu masukkan ke variabel di bawah.
                    console.log(`Hash dari password "${p}":`, hashedInput);
                    
                    // GANTI string di bawah ini dengan hash asli yang muncul di Console F12!
                    const hashPetugas = "82f70209bb0b43126633b20b9fc9946c68df36d6a07b75a42729aecd20e5b92a";
                    
                    // Ini adalah HASH asli dari password "123" (Silakan tes login pengunjung)
                    const hashPengunjung = "a665a45920422f9d417e4867efdc4fb8a04a1f3fff1fa07e998e86f7f7a27ae3";

                    if (u === 'petugas' && hashedInput === hashPetugas) { 
                        const ur = { role: 'petugas', username: u }; 
                        setCU(ur); setAT('dashboard'); 
                        // Simpan dengan penyamaran Base64 (btoa)
                        sessionStorage.setItem('perpus_current_user', btoa(JSON.stringify(ur))); 
                    } else if (u === 'pengunjung' && hashedInput === hashPengunjung) { 
                        const ur = { role: 'pengunjung', username: u }; 
                        setCU(ur); setAT('hadir'); 
                        sessionStorage.setItem('perpus_current_user', btoa(JSON.stringify(ur))); 
                    } else {
                        sA('Gagal', 'Username/Password salah!', 'error');
                    }
                } catch (error) {
                    console.error(error);
                    sA('Error', 'Sistem keamanan gagal memproses.', 'error');
                }
            };

            
             const hLo = () => sC('Keluar', 'Yakin?', () => { 
                setCU(null); 
                sessionStorage.removeItem('perpus_current_user'); 
                localStorage.removeItem('perpus_active_tab'); 
                
                // --- BARIS TAMBAHAN HAPUS CACHE ---
                localStorage.removeItem('lokabaca_cache_buku');
                localStorage.removeItem('lokabaca_cache_anggota');
                localStorage.removeItem('lokabaca_cache_peminjaman');
                localStorage.removeItem('lokabaca_cache_kehadiran');
                
                setIKL(false); 
                if (document.fullscreenElement) document.exitFullscreen().catch(err => console.error(err)) 
            });
            
            const aD = async (c, d) => { try { await db.collection(`artifacts/${activeAppId}/public/data/${c}`).add({ ...d, createdAt: Date.now() }) } catch (e) { } };
            const uD = async (c, i, d) => { try { await db.doc(`artifacts/${activeAppId}/public/data/${c}/${i}`).update(d) } catch (e) { } };
            const dD = async (c, i) => { try { await db.doc(`artifacts/${activeAppId}/public/data/${c}/${i}`).delete() } catch (e) { } };
            const uS = async d => { try { await db.doc(`artifacts/${activeAppId}/public/data/pengaturan/profil`).set(d, { merge: true }); setIPO(false); sA('Berhasil', 'Disimpan!', 'success') } catch (e) { sA('Error', 'Gagal.', 'error') } };

            if (!cU) return <><LoginView onLogin={hL} sekolah={sekolah} /><CustomModal {...mC} /></>;
            
            if (pM) return (
                <div className="bg-white text-black w-full min-h-screen m-0 p-0 absolute top-0 left-0 z-50">
                    {pM === 'label_sisa' && <PrintLabelSisaView items={pSisaItems} sekolah={sekolah} onClose={() => setPM(false)} />}
                    {pM === 'label_hilang' && <PrintLabelHilangView items={pHilangItems} sekolah={sekolah} buku={buku} onClose={() => setPM(false)} />}
                    {pM === 'buku_pdf' && <PrintDataBukuView buku={buku} sekolah={sekolah} filter={fBuku} />}
                    {/* KUNCI 2: Filter diperketat agar mengabaikan koma di akhir & filterText dimasukkan */}
                    {pM === 'label' && <PrintLabelView buku={!fL ? buku : buku.filter(b => fL.split(';').filter(x => x.trim() !== '').some(t => (b.isbn || '').toLowerCase().includes(t.trim().toLowerCase()) || (b.judul || '').toLowerCase().includes(t.trim().toLowerCase()) || (b.noInduk || '').toLowerCase().includes(t.trim().toLowerCase())))} sekolah={sekolah} filterText={fL} onClose={() => setPM(false)} />}
                    {pM === 'kartu' && <PrintKartuAnggotaView anggota={anggota} sekolah={sekolah} filter={fKartu} />}
                    {pM === 'rekap' && <PrintRekapView kehadiran={kehadiran} peminjaman={peminjaman} anggota={anggota} sekolah={sekolah} filter={fR} />}
                    {pM === 'rekap_paket' && <PrintRekapPaketView peminjaman={peminjaman} anggota={anggota} sekolah={sekolah} filter={fP} />}
                    {pM === 'hadir' && <PrintHadirView kehadiran={kehadiran} sekolah={sekolah} />}
                    {pM === 'anggota' && <PrintDataAnggotaView anggota={anggota} sekolah={sekolah} search={fA} />}
                    {pM === 'reduksi' && <PrintReduksiView buku={buku} sekolah={sekolah} filter={fRed} />}
                </div>
            );

            const NI = ({ icon, label, id }) => (
                <button onClick={() => { setAT(id); if (window.innerWidth < 1024) setISO(false) }} className={`w-full flex items-center px-4 py-3.5 mx-2 rounded-2xl transition-all group overflow-hidden relative ${aT === id ? 'bg-white/20 text-white shadow-lg ring-1 ring-white/20 backdrop-blur-md font-bold' : 'text-indigo-100/80 hover:bg-white/10 hover:text-white font-medium'}`} style={{ width: 'calc(100% - 16px)' }}>
                    {aT === id && <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-cyan-400 rounded-r-full shadow-[0_0_10px_#22d3ee]"></div>}
                    <div className={`text-xl w-7 text-center ${aT === id ? 'scale-110 text-cyan-300' : 'group-hover:-rotate-12 group-hover:scale-110'} transition-transform`}>{icon}</div>
                    {iSO && <span className="ml-3 tracking-wide whitespace-nowrap">{label}</span>}
                </button>
            );

            return (
                <div className="flex h-screen bg-[#f4f7fe] overflow-hidden text-slate-800">
                    {iKL && !iFS && (
                        <div className="fixed inset-0 z-[999999] bg-slate-900/95 backdrop-blur-xl flex flex-col items-center justify-center text-white cursor-pointer" onClick={() => document.documentElement.requestFullscreen().catch(console.error)}>
                            <i className="fas fa-lock text-7xl text-indigo-500 mb-6 animate-pulse"></i>
                            <h2 className="text-4xl font-black mb-4">Layar Terkunci</h2>
                            <p className="text-slate-300 text-lg mb-10 text-center max-w-lg">Mode Kiosk. ESC tidak diizinkan.</p>
                            <button className="bg-indigo-600 px-8 py-4 rounded-2xl text-xl flex items-center"><i className="fas fa-expand mr-3"></i> Layar Penuh</button>
                            <div className="absolute bottom-8 text-slate-500 text-xs">PETUGAS: TEKAN CTRL + Z UNTUK KELUAR</div>
                        </div>
                    )}
                    {iSO && !iFS && <div className="fixed inset-0 bg-slate-900/50 z-40 lg:hidden" onClick={() => setISO(false)}></div>}
                    
                    <aside className={`fixed lg:relative z-50 transform transition-all duration-500 ${iSO ? 'translate-x-0 w-[280px]' : '-translate-x-full lg:translate-x-0 lg:w-24'} bg-gradient-to-b from-indigo-600 via-violet-700 to-purple-900 text-white flex flex-col shrink-0 ${iFS ? 'h-full' : 'lg:rounded-r-[2rem] lg:my-2 lg:ml-2 h-full lg:h-[calc(100vh-16px)]'}`}>
                        <div className="h-20 flex items-center justify-center border-b border-white/10 px-4 cursor-pointer" onClick={() => setISO(!iSO)}>
                            {sekolah.logo ? <div className="p-1 bg-white/20 rounded-xl"><img src={sekolah.logo} className="w-10 h-10 object-contain rounded-lg bg-white" alt="Logo" /></div> : <div className="p-2 bg-gradient-to-br from-cyan-400 to-blue-500 rounded-xl"><i className="fas fa-book-reader text-xl"></i></div>}
                            {iSO && <span className="font-black truncate text-xl pl-3">{sekolah.nama || '\u00A0'}</span>}
                        </div>
                        <nav className="flex-1 overflow-y-auto py-6 space-y-2 px-1 custom-scrollbar">
                            {cU.role === 'petugas' && (
                                <>
                                    <NI icon={<i className="fas fa-layer-group text-blue-400"></i>} label="Dashboard" id="dashboard" />
                                    <NI icon={<i className="fas fa-user-tie text-purple-400"></i>} label="Administrasi" id="administrasi" />
                                    <NI icon={<i className="fas fa-users text-pink-400"></i>} label="Data Anggota" id="anggota" />
                                    <NI icon={<i className="fas fa-book text-sky-400"></i>} label="Daftar Buku" id="buku" />
                                    <NI icon={<i className="fas fa-clipboard-check text-teal-400"></i>} label="Audit Eksemplar" id="audit" />
                                    <NI icon={<i className="fas fa-box-archive text-orange-400"></i>} label="Reduksi Buku" id="reduksi" />
                                    <NI icon={<i className="fas fa-book-open text-amber-400"></i>} label="Pinjam Buku" id="pinjam" />
                                    <NI icon={<i className="fab fa-whatsapp text-emerald-400"></i>} label="Peringatan WA" id="peringatan" />
                                    <NI icon={<i className="fas fa-rotate-left text-cyan-400"></i>} label="Pengembalian" id="kembali" />
                                    <NI icon={<i className="fas fa-box-open text-lime-400"></i>} label="Kembali Paket" id="kembali_paket" />
                                    <NI icon={<i className="fas fa-book-dead text-rose-400"></i>} label="Buku Hilang" id="buku_hilang" />
                                    <NI icon={<i className="fas fa-file-invoice text-indigo-400"></i>} label="Rekap Laporan" id="rekap" />
                                    <NI icon={<i className="fas fa-boxes text-fuchsia-400"></i>} label="Rekap Paket" id="rekap_paket" />
                                    <NI icon={<i className="fas fa-barcode text-yellow-300"></i>} label="Label Barcode" id="label" />
                                    <NI icon={<i className="fas fa-id-badge text-violet-400"></i>} label="Kartu Anggota" id="kartu" />
                                    <NI icon={<i className="fas fa-file-contract text-emerald-300"></i>} label="Surat Bebas Pustaka" id="surat_bebas" />
                                    <NI icon={<i className="fas fa-chart-pie text-emerald-400"></i>} label="Analitik & Akreditasi" id="analitik" />    
                                </>
                            )}
                            {cU.role !== 'petugas' && <NI icon={<i className="fas fa-calendar-check text-emerald-400"></i>} label="Daftar Hadir" id="hadir" />}
                            <NI icon={<i className="fas fa-search text-blue-300"></i>} label="Cari Buku" id="cari" />
                        </nav>
                        <div className="p-4 border-t border-white/10 flex flex-col gap-2">
                            {!iKL && (
                                <button onClick={hLo} className="flex items-center justify-center w-full px-4 py-3.5 text-white/80 hover:text-white rounded-2xl hover:bg-white/10 transition-all group">
                                    <div className="text-xl w-6 text-center group-hover:-translate-x-1"><i className="fas fa-sign-out-alt text-rose-400"></i></div>
                                    {iSO && <span className="ml-3 font-bold text-rose-100 group-hover:text-rose-400 transition-colors">Keluar</span>}
                                </button>
                            )}
                        </div>
                    </aside>
                    
                    <main className="flex-1 flex flex-col h-screen overflow-hidden w-full relative">
                        {!iFS && (
                            <header className="h-20 bg-white/70 backdrop-blur-xl border-b flex items-center justify-between px-8 z-10 shrink-0">
                                <div className="flex items-center gap-5">
                                    <button onClick={() => setISO(!iSO)} className="p-2.5 rounded-xl bg-white border hover:bg-slate-50 lg:hidden"><i className="fas fa-bars"></i></button>
                                    <h1 className="text-2xl font-black capitalize flex items-center gap-3"><span className="w-2 h-8 bg-gradient-to-b from-violet-500 to-indigo-500 rounded-full"></span>{aT.replace('_', ' ')}</h1>
                                    <div className="hidden md:block ml-4">
                                        {isSyncing ? (
                                            <span className="text-[10px] bg-amber-100 text-amber-600 px-3 py-1.5 rounded-full animate-pulse flex items-center gap-1.5 font-bold border border-amber-200">
                                                <i className="fas fa-sync-alt fa-spin"></i> Menyelaraskan Data...
                                            </span>
                                        ) : (
                                            <span className="text-[10px] bg-emerald-100 text-emerald-600 px-3 py-1.5 rounded-full flex items-center gap-1.5 font-bold border border-emerald-200">
                                                <i className="fas fa-check-circle"></i> Sinkronisasi Selesai
                                            </span>
                                        )}
                                    </div> 
                                
                                    </div>
                                <div className="flex items-center gap-4">
                                    <div className="hidden sm:block text-right">
                                        <p className="text-sm font-bold truncate">{cU.username}</p>
                                        <p className="text-[10px] text-indigo-500 uppercase">{cU.role}</p>
                                    </div>
                                    <div className="w-12 h-12 rounded-2xl bg-indigo-100 flex items-center justify-center text-indigo-600 font-black text-lg">{cU.username.charAt(0).toUpperCase()}</div>
                                </div>
                            </header>
                        )}
                        <div className={`flex-1 overflow-auto custom-scrollbar ${iFS ? 'p-4' : 'p-8'}`}>
                            <div className={`mx-auto ${iFS ? 'max-w-full h-full' : 'max-w-[90rem] space-y-8 pb-10'}`}>
                                {aT === 'dashboard' && <DashboardView anggota={anggota} buku={buku} peminjaman={peminjaman} kehadiran={kehadiran} sekolah={sekolah} onUserClick={setSBiodata} />}
                                {aT === 'analitik' && <AnalitikAkreditasiView buku={buku} anggota={anggota} peminjaman={peminjaman} kehadiran={kehadiran} sekolah={sekolah} />}
                                {aT === 'anggota' && <AnggotaView data={anggota} onAdd={d => aD('anggota', d)} onUpdate={(i, d) => uD('anggota', i, d)} onDelete={i => sC('Hapus', 'Yakin?', () => dD('anggota', i))} onDeleteMany={is => is.forEach(i => dD('anggota', i))} showAlert={sA} showConfirm={sC} filter={fA} setFilter={setFA} onPrint={hP} sekolah={sekolah} onUpdatePengaturan={uS} />}
                                {aT === 'buku' && <BukuView data={buku} peminjaman={peminjaman} onAdd={d => aD('buku', d)} onUpdate={(i, d) => uD('buku', i, d)} onDelete={i => sC('Hapus', 'Yakin?', () => dD('buku', i))} showAlert={sA} onPrint={hP} filter={fBuku} setFilter={setFBuku} />}
                                {aT === 'audit' && <AuditEksemplarView buku={buku} peminjaman={peminjaman} anggota={anggota} sekolah={sekolah} onPrintSisa={items => { setPSisaItems(items); setPM('label_sisa'); }} />}
                                {aT === 'reduksi' && <ReduksiView data={buku} onUpdate={(i, d) => uD('buku', i, d)} onDelete={i => sC('Hapus Permanen', 'Yakin?', () => dD('buku', i))} onPrint={hP} filter={fRed} setFilter={setFRed} />}
                                {aT === 'hadir' && <HadirView data={kehadiran} anggota={anggota} buku={buku} peminjaman={peminjaman} quotes={quotes} onAdd={d => aD('kehadiran', d)} onAddQuote={d => aD('quotes', d)} onDeleteQuote={i => sC('Hapus Quote', 'Yakin?', () => dD('quotes', i))} showAlert={sA} sekolah={sekolah} onUserClick={setSBiodata} />}
                                {aT === 'pinjam' && <PinjamView data={peminjaman} anggota={anggota} buku={buku} sekolah={sekolah} onAdd={d => aD('peminjaman', d)} onUpdate={(i, d) => uD('peminjaman', i, d)} onDelete={i => dD('peminjaman', i)} onUpdateBuku={uD} showAlert={sA} showConfirm={sC} />}
                                {aT === 'peringatan' && <PeringatanView peminjaman={peminjaman} anggota={anggota} sekolah={sekolah} onUpdatePengaturan={uS} showConfirm={sC} showAlert={sA} />}
                                {aT === 'kembali' && <KembaliView data={peminjaman} anggota={anggota} onUpdate={(i, d) => uD('peminjaman', i, d)} onUpdateBuku={uD} buku={buku} showAlert={sA} showConfirm={sC} sekolah={sekolah} onUpdatePengaturan={uS} />}
                                {aT === 'kembali_paket' && <KembaliPaketView data={peminjaman} anggota={anggota} buku={buku} onUpdate={(i, d) => uD('peminjaman', i, d)} onUpdateBuku={uD} showAlert={sA} showConfirm={sC} sekolah={sekolah} />}
                                {aT === 'buku_hilang' && <BukuHilangView data={peminjaman} anggota={anggota} buku={buku} onUpdate={(i, d) => uD('peminjaman', i, d)} onUpdateBuku={uD} onPrintHilang={items => { setPHilangItems(items); hP('label_hilang'); }} showAlert={sA} showConfirm={sC} />}
                                {aT === 'rekap' && <RekapView kehadiran={kehadiran} peminjaman={peminjaman} anggota={anggota} onPrint={hP} filter={fR} setFilter={setFR} sekolah={sekolah} />}
                                {aT === 'rekap_paket' && <RekapPaketView anggota={anggota} peminjaman={peminjaman} onPrint={hP} filter={fP} setFilter={setFP} sekolah={sekolah} />}
                                {aT === 'administrasi' && <AdministrasiView sekolah={sekolah} onSave={uS} showAlert={sA} showConfirm={sC} allData={{ buku, anggota, peminjaman, kehadiran, quotes }} />}
                                {aT === 'cari' && <PencarianBukuView data={buku} />}
                                {aT === 'label' && <LabelView data={buku} onPrint={hP} sekolah={sekolah} filter={fL} setFilter={setFL} />}
                                {aT === 'kartu' && <KartuAnggotaView data={anggota} onPrint={hP} sekolah={sekolah} filter={fKartu} setFilter={setFKartu} />}
                                {aT === 'surat_bebas' && <SuratBebasView anggota={anggota} peminjaman={peminjaman} sekolah={sekolah} />}
                            </div>
                        </div>
                        <BiodataModal user={sBiodata} isOpen={!!sBiodata} onClose={() => setSBiodata(null)} sekolah={sekolah} />
                    </main>
                    <PengaturanSekolahModal isOpen={iPO} onClose={() => setIPO(false)} sekolah={sekolah} onSave={uS} showAlert={sA} />
                    <CustomModal {...mC} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root')); 
        root.render(<App />);
    </script>
</body>
</html>
