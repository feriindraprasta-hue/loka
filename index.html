        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f4f7fe; color: #1e293b; }

<body class="bg-[#f4f7fe]">

    <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

        const firebaseConfig = { 
            apiKey: "AIzaSyBU1GwP-BqhkEsuvqABvogT1tLOZ9argm4", 
            authDomain: "perpustakaan-106c3.firebaseapp.com",

        };
        const activeAppId = 'perpustakaan-smkn1';
        const APP_VERSION = 'v1.18.0';

        const DEFAULT_JURUSAN = [
            { nama: 'Akuntansi', singkatan: 'AK' }, { nama: 'Bisnis Daring', singkatan: 'BD' }, 
            { nama: 'Design Komunikasi Visual', singkatan: 'DKV' }, { nama: 'Kriya Kreatif Batik dan Tekstil', singkatan: 'KKBT' }, 
            { nama: 'Managemen Perkantoran', singkatan: 'MP' }, { nama: 'Produksi dan Siaran Program Televisi', singkatan: 'PSPT' }, 
            { nama: 'Teknik Logistik', singkatan: 'TL' }, { nama: 'Usaha Layanan Wisata', singkatan: 'ULW' }
        ];

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        /* --- FUNGSI HELPER --- */
        const formatDate = d => new Date(d).toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });
        const getAuthorCode = n => { if (!n) return 'XXX'; const p = n.trim().split(' '); return p[p.length - 1].substring(0, 3).toUpperCase(); };
        const getTitleCode = t => t ? t.trim().substring(0, 1).toLowerCase() : 'x';
        const getDDC = k => k ? k.split(' ')[0] : '000';
        const getSingkatanJurusan = (j, d = DEFAULT_JURUSAN) => { if (!j) return ''; const f = d.find(x => x.nama === j); return f ? f.singkatan : j; };
        const formatKelasSiswa = (i, d = DEFAULT_JURUSAN) => { if (!i || i.kategori !== 'Siswa') return i?.kategori || '-'; return `${i.kelas || ''} ${i.kelasJurusan || getSingkatanJurusan(i.jurusan, d)} ${i.noKelas || ''}`.trim().replace(/\s+/g, ' '); };
        const formatWA = n => { if (!n) return ''; let f = n.toString().replace(/\D/g, ''); if (f.startsWith('0')) f = '62' + f.substring(1); return f; };

        // Fungsi auto-format nama dan gelar (Lokabaca Edition - Diperbarui)
const formatNamaGelarPintar = (input) => {
    if (!input) return "";

    const masterGelarDepan = ["Drs.", "Dra.", "Dr.", "Prof.", "Ir.", "H.", "Hj."];
    const masterGelarBelakang = [
        "S.ST.Par.", "S.Kom.", "S.Pd.", "Gr.", "S.T.", "S.E.", "S.H.", "S.Tr.Par.", 
        "S.Sos.", "M.Pd.", "M.Kom.", "M.Si.", "M.T.", "Ph.D.", "S.Ag.", "M.Ag.", "S.Pd.I." , "S.Psi."
    ];

    let [bagianUtama, ...gelarBelakang] = input.split(",").map(item => item.trim());
    let kataUtama = bagianUtama.split(" ");
    
    let hasilUtama = kataUtama.map(kata => {
        let kataCek = kata.endsWith(".") ? kata : kata + ".";
        let gelarDitemukan = masterGelarDepan.find(g => 
            g.toLowerCase() === kata.toLowerCase() || 
            g.toLowerCase() === kataCek.toLowerCase()
        );
        if (gelarDitemukan) return gelarDitemukan;
        return kata.toUpperCase();
    });

    let hasilGelarBelakang = gelarBelakang.map(g => {
        let gCek = g.endsWith(".") ? g : g + ".";
        let gelarDitemukan = masterGelarBelakang.find(s => 
            s.toLowerCase() === g.toLowerCase() || 
            s.toLowerCase() === gCek.toLowerCase()
        );
        if (gelarDitemukan) return gelarDitemukan;
        return g.charAt(0).toUpperCase() + g.slice(1).toLowerCase();
    });

    let namaFinal = hasilUtama.join(" ");
    return hasilGelarBelakang.length > 0 ? `${namaFinal}, ${hasilGelarBelakang.join(", ")}` : namaFinal;
};

        // Fungsi keamanan Hashing SHA-256 (Standar Industri)
        const hashSHA256 = async (text) => {
            const msgBuffer = new TextEncoder().encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        };



        /* ========================================================= */
        /* --- KOMPONEN UI & MODAL --- */
        /* ========================================================= */
// Helper penentu Kode Label Punggung Buku (Dipindahkan ke Global agar tidak error di BukuView)
        const hitungKodeSpinePintar = (pengarangRaw, judulRaw) => {
            if (!pengarangRaw) return "";
            const listPengarang = pengarangRaw.split(',').map(p => p.trim()).filter(p => p.length > 0);
            const judul = (judulRaw || "").trim();
            if (listPengarang.length === 0) return "";
            let tigaHurufDepan = "";
            let satuHurufKecil = "";
            if (listPengarang.length <= 3) {
                tigaHurufDepan = listPengarang[0].substring(0, 3).toUpperCase();
                satuHurufKecil = judul ? judul.charAt(0).toLowerCase() : "";
            } else {
                tigaHurufDepan = judul.substring(0, 3).toUpperCase();
                satuHurufKecil = listPengarang[0] ? listPengarang[0].charAt(0).toLowerCase() : "";
            }
            return `${tigaHurufDepan} ${satuHurufKecil}`.trim();
        };

// KOMPONEN SCANNER KAMERA HP & LAPTOP (HYBRID NATIVE GPU + WASM + ZXING FALLBACK)
        const FastScannerModal = ({ isOpen, onClose, onDetected, title = "Scan Barcode via HP", continuous = false }) => {
            const videoRef = useRef(null);
            const [torch, setTorch] = useState(false);
            const [hasTorch, setHasTorch] = useState(false);
            const [zoom, setZoom] = useState(1);
            const [zoomCap, setZoomCap] = useState(null);
            const [lastScanned, setLastScanned] = useState('');
            const [errorMsg, setErrorMsg] = useState('');
            const [engineName, setEngineName] = useState('Memuat Kamera...');
            const streamRef = useRef(null);
            const isScanningRef = useRef(false);
            const audioCtxRef = useRef(null);
            const lastCodeRef = useRef({ code: '', time: 0 });
            const zxingReaderRef = useRef(null);

            const playBeep = () => {
                try {
                    if (navigator.vibrate) navigator.vibrate(70);
                    if (!audioCtxRef.current) {
                        audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    const ctx = audioCtxRef.current;
                    if (ctx.state === 'suspended') ctx.resume();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(2650, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } catch (e) {}
            };

            useEffect(() => {
                if (!isOpen) return;
                setErrorMsg('');
                setLastScanned('');
                setHasTorch(false);
                setZoomCap(null);
                let animId;

                const stopCamera = () => {
                    isScanningRef.current = false;
                    if (animId) cancelAnimationFrame(animId);
                    if (zxingReaderRef.current) {
                        try { zxingReaderRef.current.reset(); } catch (e) {}
                        zxingReaderRef.current = null;
                    }
                    if (streamRef.current) {
                        streamRef.current.getTracks().forEach(t => t.stop());
                        streamRef.current = null;
                    }
                };

                const handleBarcodeSuccess = (raw) => {
                    const cleanRaw = (raw || '').trim();
                    const now = Date.now();
                    if (cleanRaw && (cleanRaw !== lastCodeRef.current.code || now - lastCodeRef.current.time > 1800)) {
                        lastCodeRef.current = { code: cleanRaw, time: now };
                        playBeep();
                        setLastScanned(cleanRaw);
                        
                        if (!continuous) {
                            // Hentikan scan & tampilkan tulisan "Berhasil" dulu selama 700ms baru tutup otomatis
                            isScanningRef.current = false;
                            setTimeout(() => {
                                stopCamera();
                                onClose();
                                onDetected(cleanRaw);
                            }, 700);
                        } else {
                            onDetected(cleanRaw);
                        }
                    }
                };

                const startCamera = async () => {
                    try {
                        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                            throw new Error("Akses kamera diblokir oleh browser. Pastikan izin kamera diberikan.");
                        }

                        // 1. BUKA STREAM KAMERA
                        let stream;
                        try {
                            stream = await navigator.mediaDevices.getUserMedia({
                                audio: false,
                                video: {
                                    facingMode: { ideal: 'environment' },
                                    width: { ideal: 1280 },
                                    height: { ideal: 720 }
                                }
                            });
                        } catch (camErr) {
                            stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: true });
                        }

                        streamRef.current = stream;
                        if (videoRef.current) {
                            videoRef.current.srcObject = stream;
                            videoRef.current.setAttribute('playsinline', true);
                            await videoRef.current.play();
                        }

                        // 2. AKTIFKAN AUTOFOCUS, TORCH & ZOOM
                        const track = stream.getVideoTracks()[0];
                        const caps = (track && typeof track.getCapabilities === 'function') ? track.getCapabilities() : {};
                        
                        if (caps.focusMode && caps.focusMode.includes('continuous')) {
                            track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
                        }
                        if (caps.torch) setHasTorch(true);
                        if (caps.zoom) {
                            setZoomCap({ min: caps.zoom.min, max: caps.zoom.max, step: caps.zoom.step || 0.1 });
                            const initZoom = Math.min(Math.max(1.5, caps.zoom.min), caps.zoom.max);
                            setZoom(initZoom);
                            track.applyConstraints({ advanced: [{ zoom: initZoom }] }).catch(() => {});
                        }

                        isScanningRef.current = true;

                        // 3. PILIH ENGINE DETEKSI (Prioritas 1: Native/Wasm BarcodeDetector, Prioritas 2: ZXing)
                        const DetectorClass = window.BarcodeDetector 
                            || window.barcodeDetectorPolyfill?.BarcodeDetector 
                            || window.BarcodeDetectorPolyfill;

                        if (DetectorClass) {
                            setEngineName('Engine: Native GPU / WebAssembly');
                            let detector;
                            try {
                                detector = new DetectorClass({ formats: ['ean_13', 'code_128', 'code_39', 'qr_code', 'ean_8'] });
                            } catch (e) {
                                detector = new DetectorClass();
                            }

                            const scanLoop = async () => {
                                if (!isScanningRef.current) return;
                                if (videoRef.current && videoRef.current.readyState >= 2) {
                                    try {
                                        const barcodes = await detector.detect(videoRef.current);
                                        if (barcodes && barcodes.length > 0) {
                                            handleBarcodeSuccess(barcodes[0].rawValue);
                                            if (!isScanningRef.current) return;
                                        }
                                    } catch (e) {}
                                }
                                if (isScanningRef.current) {
                                    animId = requestAnimationFrame(scanLoop);
                                }
                            };
                            animId = requestAnimationFrame(scanLoop);
                        } else if (window.ZXing) {
                            // FALLBACK OTOMATIS KE ZXING JIKA POLYFILL WASM BELUM SIAP
                            setEngineName('Engine: ZXing Multi-Format');
                            const codeReader = new window.ZXing.BrowserMultiFormatReader();
                            zxingReaderRef.current = codeReader;
                            
                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d', { willReadFrequently: true });

                            const zxingLoop = () => {
                                if (!isScanningRef.current) return;
                                if (videoRef.current && videoRef.current.readyState >= 2) {
                                    try {
                                        canvas.width = videoRef.current.videoWidth || 640;
                                        canvas.height = videoRef.current.videoHeight || 480;
                                        ctx.drawImage(videoRef.current, 0, 0, canvas.width, canvas.height);
                                        const luminanceSource = new window.ZXing.HTMLCanvasElementLuminanceSource(canvas);
                                        const binaryBitmap = new window.ZXing.BinaryBitmap(new window.ZXing.HybridBinarizer(luminanceSource));
                                        const result = codeReader.decodeBitmap(binaryBitmap);
                                        if (result && result.text) {
                                            handleBarcodeSuccess(result.text);
                                            if (!isScanningRef.current) return;
                                        }
                                    } catch (e) {}
                                }
                                if (isScanningRef.current) {
                                    setTimeout(() => { animId = requestAnimationFrame(zxingLoop); }, 80);
                                }
                            };
                            animId = requestAnimationFrame(zxingLoop);
                        } else {
                            setEngineName('Kamera Aktif (Menunggu Modul...)');
                        }
                    } catch (err) {
                        console.error("Scanner Error:", err);
                        setErrorMsg(`Kamera gagal diakses (${err.name || 'Error'}): ${err.message}`);
                    }
                };

                startCamera();
                return () => stopCamera();
            }, [isOpen]);

            const toggleTorch = async () => {
                const track = streamRef.current?.getVideoTracks()[0];
                if (track && hasTorch) {
                    const next = !torch;
                    await track.applyConstraints({ advanced: [{ torch: next }] }).catch(() => {});
                    setTorch(next);
                }
            };

            const handleZoomChange = async (e) => {
                const val = parseFloat(e.target.value);
                setZoom(val);
                const track = streamRef.current?.getVideoTracks()[0];
                if (track) {
                    await track.applyConstraints({ advanced: [{ zoom: val }] }).catch(() => {});
                }
            };

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 w-screen h-[100dvh] bg-slate-900/85 backdrop-blur-md z-[999999] flex items-center justify-center p-4 overflow-hidden" onClick={onClose}>
                    <div className="bg-slate-900 border border-slate-700 rounded-[2rem] w-full max-w-sm overflow-hidden shadow-2xl text-white my-auto mx-auto" onClick={e => e.stopPropagation()}>
                        <div className="p-5 flex justify-between items-center border-b border-slate-800">
                            <div className="flex items-center gap-3">
                                <div className="w-9 h-9 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center"><i className="fas fa-camera"></i></div>
                                <div>
                                    <h3 className="font-black text-base leading-tight">{title}</h3>
                                    <p className="text-[10px] text-emerald-400 font-bold uppercase tracking-wider">{engineName}</p>
                                </div>
                            </div>
                            <button onClick={onClose} className="w-9 h-9 bg-slate-800 hover:bg-rose-600 rounded-full flex items-center justify-center transition-colors"><i className="fas fa-times"></i></button>
                        </div>

                        <div className="relative bg-black aspect-square sm:aspect-[4/3] w-full overflow-hidden flex items-center justify-center">
                            {errorMsg ? (
                                <div className="p-6 text-center text-rose-400 text-xs font-bold leading-relaxed">
                                    <i className="fas fa-exclamation-triangle text-3xl mb-3 block"></i>
                                    {errorMsg}
                                </div>
                            ) : (
                                <>
                                    <video ref={videoRef} className="w-full h-full object-cover" muted playsInline></video>
                                    
                                    {/* Kotak Bidik selalu di tengah */}
                                    <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                        <div className="w-4/5 h-36 border-2 border-indigo-400/80 rounded-2xl relative shadow-[0_0_0_9999px_rgba(0,0,0,0.5)]">
                                            <div className="absolute left-2 right-2 top-1/2 -translate-y-1/2 h-0.5 bg-rose-500 shadow-[0_0_12px_#f43f5e] animate-pulse"></div>
                                        </div>
                                    </div>

                                    {/* OVERLAY TULISAN BERHASIL SEBELUM MENUTUP SENDIRI */}
                                    {lastScanned && (
                                        <div className="absolute inset-0 bg-emerald-600/90 backdrop-blur-sm flex flex-col items-center justify-center z-20 animate-[fadeIn_0.15s_ease-out]">
                                            <div className="w-16 h-16 bg-white text-emerald-600 rounded-full flex items-center justify-center text-3xl mb-3 shadow-xl">
                                                <i className="fas fa-check"></i>
                                            </div>
                                            <h4 className="text-2xl font-black text-white tracking-wide">BERHASIL!</h4>
                                            <p className="text-xs font-mono font-bold text-emerald-100 mt-1 bg-black/20 px-3 py-1 rounded-lg">{lastScanned}</p>
                                        </div>
                                    )}

                                    {hasTorch && (
                                        <button type="button" onClick={toggleTorch} className={`absolute bottom-3 right-3 w-11 h-11 rounded-full flex items-center justify-center shadow-lg transition-all z-10 ${torch ? 'bg-amber-400 text-slate-900' : 'bg-slate-800/80 text-white'}`}>
                                            <i className="fas fa-bolt"></i>
                                        </button>
                                    )}
                                </>
                            )}
                        </div>

                        <div className="p-5 space-y-4 bg-slate-900">
                            {zoomCap && (
                                <div className="flex items-center gap-3">
                                    <i className="fas fa-search-minus text-xs text-slate-400"></i>
                                    <input type="range" min={zoomCap.min} max={Math.min(zoomCap.max, 4)} step={zoomCap.step} value={zoom} onChange={handleZoomChange} className="flex-1 accent-indigo-500" />
                                    <span className="text-xs font-black text-indigo-400 w-10 text-right">{zoom.toFixed(1)}x</span>
                                </div>
                            )}
                            <p className="text-[11px] text-slate-400 text-center font-medium">Arahkan barcode tepat ke garis merah di tengah layar.</p>
                        </div>
                    </div>
                </div>
            );
        };
		
        const CustomModal = ({ isOpen, title, message, onConfirm, onCancel, type = 'info', showCancel = false }) => {
            if (!isOpen) return null;
            const th = {
                success: { bg: 'bg-emerald-50', icon: 'fa-check-circle text-emerald-500', btn: 'bg-gradient-to-r from-emerald-400 to-teal-500 shadow-emerald-500/30' },
                error: { bg: 'bg-rose-50', icon: 'fa-times-circle text-rose-500', btn: 'bg-gradient-to-r from-rose-400 to-red-500 shadow-rose-500/30' },
                warning: { bg: 'bg-amber-50', icon: 'fa-exclamation-triangle text-amber-500', btn: 'bg-gradient-to-r from-amber-400 to-orange-500 shadow-amber-500/30' },
                info: { bg: 'bg-indigo-50', icon: 'fa-info-circle text-indigo-500', btn: 'bg-gradient-to-r from-indigo-400 to-blue-500 shadow-indigo-500/30' }
            };
            const t = th[type] || th.info;
            return (
                <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[9999] flex items-center justify-center p-4">
                    <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-sm overflow-hidden flex flex-col transform scale-100 transition-transform">
                        <div className={`p-8 flex flex-col items-center text-center ${t.bg}`}>
                            <i className={`fas ${t.icon} text-6xl mb-5 drop-shadow-md`}></i>
                            <h3 className="text-2xl font-black text-slate-800 mb-2 leading-tight tracking-tight">{title}</h3>
                            <p className="text-slate-600 text-sm whitespace-pre-line leading-relaxed font-medium">{message}</p>
                        </div>

                            margin: 0, 
                            background: "transparent", 
                            lineColor: "#0f172a"

      const TopPeminjam = ({ peminjaman, anggota, onUserClick, sekolah }) => {
    const t = useMemo(() => {
        const cM = new Date().toISOString().substring(0, 7);
        const c = {};
        peminjaman.forEach(p => { if (p.tglPinjam.startsWith(cM)) c[p.idAnggota] = (c[p.idAnggota] || 0) + 1; });
        return Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([id, cnt], i) => { const u = anggota.find(a => a.id === id); return u ? { u, cnt, rank: i + 1 } : null }).filter(Boolean);
    }, [peminjaman, anggota]);
    
    const m = ['text-yellow-400', 'text-slate-300', 'text-amber-600', 'text-indigo-200', 'text-indigo-200'];
    
    return (
        <div className="bg-white p-6 md:p-8 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border-0 flex flex-col h-full">

                            <span className="font-black text-indigo-600 text-lg leading-none">{x.cnt}</span>

                    </div>

                {t.length === 0 && <div className="h-full flex flex-col items-center justify-center text-slate-400 py-6"><i className="fas fa-crown text-3xl mb-2 opacity-50"></i><p className="text-sm font-bold">Belum ada peminjam</p></div>}

};

        const PengaturanSekolahModal = ({ isOpen, onClose, sekolah, onSave, showAlert }) => {

            return (

                        <div className="flex justify-between items-center mb-8"><h3 className="text-2xl font-black text-slate-800 tracking-tight">Profil Instansi</h3><button onClick={onClose} className="bg-slate-100 hover:bg-slate-200 w-10 h-10 rounded-full flex items-center justify-center transition-colors"><i className="fas fa-times text-slate-500"></i></button></div>
                        <form onSubmit={e => { e.preventDefault(); onSave(f); }} className="space-y-5">

                                {f.logo ? <img src={f.logo} className="w-20 h-20 object-contain rounded-xl border border-slate-200 bg-white shadow-sm" alt="Logo" /> : <div className="w-20 h-20 bg-indigo-50 rounded-xl flex items-center justify-center border border-indigo-100"><i className="fas fa-image text-indigo-300 text-3xl"></i></div>}
                                <div className="flex-1">

        /* ========================================================= */
        /* --- KOMPONEN CETAK / PRINT --- */

          const PrintDataBukuView = ({ buku, sekolah, filter }) => {
            const fD = useMemo(() => {
                return buku.filter(i => {
                    if (i.status === 'Direduksi') return false;
                    if (filter.sumber !== 'Semua' && i.sumberPerolehan !== filter.sumber) return false;
                    if (filter.tahun !== 'Semua' && i.tahun !== filter.tahun) return false;
                    const fl = (filter.search || '').toLowerCase(), bf = fl.replace(/-\d+$/, '');
                    return String(i.judul || '').toLowerCase().includes(fl) || String(i.isbn || '').toLowerCase().includes(bf) || String(i.noInduk || '').toLowerCase().includes(bf) || String(i.pengarang || '').toLowerCase().includes(fl);
                }).sort((a, b) => (a.noInduk || '').localeCompare(b.noInduk || ''));
            }, [buku, filter]);

            return (
                <div id="print-area">
                    <style>{`@media print{@page{size:A4 portrait;margin:1cm}body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}#print-area{padding:0!important}}#print-area{font-family:sans-serif;background:#fff;width:100%;min-height:100vh;box-sizing:border-box;padding:1cm}table{width:100%;border-collapse:collapse;margin-top:15px;font-size:8pt}th,td{border:1px solid #000;padding:5px;text-align:left;vertical-align:top}th{background-color:#f0f0f0}`}</style>
                    <KopSurat sekolah={sekolah} />
                    <h2 style={{ textAlign: 'center', fontSize: '14pt', margin: '20px 0 5px', textTransform: 'uppercase', fontWeight: 'bold' }}>Laporan Inventaris Buku</h2>
                    {(filter.sumber !== 'Semua' || filter.tahun !== 'Semua' || filter.search) && <p style={{ fontSize: '9pt', marginBottom: '10px' }}>*Filter yang aktif: <b>{filter.sumber !== 'Semua' ? `[Sumber: ${filter.sumber}] ` : ''} {filter.tahun !== 'Semua' ? `[Tahun: ${filter.tahun}] ` : ''} {filter.search ? `[Pencarian: ${filter.search}]` : ''}</b></p>}
                    <table>
                        <thead>
                            <tr>
                                <th style={{ textAlign: 'center', width: '4%' }}>No</th>
                                <th style={{ textAlign: 'center', width: '8%' }}>Cover</th>
                                <th style={{ width: '13%' }}>No Induk<br/><span style={{fontSize:'7pt',fontWeight:'normal'}}>ISBN</span></th>
                                <th style={{ width: '22%' }}>Judul Buku</th>
                                <th style={{ width: '15%' }}>Pengarang</th>
                                <th style={{ width: '13%' }}>Penerbit / Kota</th>
                                <th style={{ textAlign: 'center', width: '10%' }}>Tahun<br/><span style={{fontSize:'7pt',fontWeight:'normal'}}>Sumber</span></th>
                                <th style={{ textAlign: 'center', width: '8%' }}>Lokasi</th>
                                <th style={{ textAlign: 'center', width: '7%' }}>Stok</th>
                            </tr>
                        </thead>
                        <tbody>
                            {fD.length === 0 ? <tr><td colSpan="9" style={{ textAlign: 'center' }}>Nihil</td></tr> : fD.map((b, i) => (
                                <tr key={b.id}>
                                    <td style={{ textAlign: 'center' }}>{i + 1}</td>
                                    <td style={{ textAlign: 'center', verticalAlign: 'middle' }}>
                                        {b.cover ? <img src={b.cover} style={{ width: '35px', height: '50px', objectFit: 'cover', border: '1px solid #ccc' }} alt="Cover" /> : <div style={{ fontSize: '7pt', color: '#888', marginTop: '15px' }}>No Image</div>}
                                    </td>
                                    <td><b>{b.noInduk || '-'}</b><br/><span style={{fontSize: '7pt'}}>{b.isbn || '-'}</span></td>
                                    <td><b>{b.judul}</b>{b.anakJudul && <><br/><i>{b.anakJudul}</i></>}</td>
                                    <td>{b.pengarang}</td>
                                    <td>{b.penerbit}<br/><span style={{fontSize: '7pt'}}>{b.kotaTerbit}</span></td>
                                    <td style={{ textAlign: 'center' }}><b>{b.tahun || '-'}</b><br/><span style={{fontSize: '7pt'}}>{b.sumberPerolehan || '-'}</span></td>
                                    <td style={{ textAlign: 'center' }}>{b.lokasiRak || '-'}</td>
                                    <td style={{ textAlign: 'center', fontWeight: 'bold' }}>{b.stock}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                    <TandaTangan sekolah={sekolah} />
                </div>
            );
        };


    const PrintLabelHilangView = ({ items, sekolah, buku, onClose }) => {
    const [page, setPage] = useState(1);
    const limit = 140;

    const eD = useMemo(() => {
        return items.map(p => {
            const b = buku.find(x => String(x.id) === String(p.idBuku)) || {};
            const cleanIsbn = (p.isbn || b.isbn || b.ISBN || String(b.id || '0000')).toString().replace(/\D/g, '');
            
            // PERBAIKAN: Gunakan kodeEksemplar asli dari data transaksi (misal: 9786022447887-74)
            let uBarcode = p.kodeEksemplar || `${cleanIsbn}-1`;
            let currentCopy = '1';
            
            // Ekstrak angka eksemplar dari string barcode (angka setelah tanda strip '-')
            if (p.kodeEksemplar && p.kodeEksemplar.includes('-')) {
                const parts = p.kodeEksemplar.split('-');
                currentCopy = parts[parts.length - 1]; // Menghasilkan "74", "80", dll
            } else if (p.copyNum) {
                currentCopy = p.copyNum;
            }

            // Total buku ambil dari master (b.stock). Jika tidak ada, pakai nomor eksemplar saat ini.
            const totalCopies = b.stock ? b.stock : Math.max(1, parseInt(currentCopy));

           const sL = [ 
    b.kodeLabel ? b.kodeLabel : getDDC(b.klasifikasiDDC), 
    getAuthorCode(b.pengarang), 
    getTitleCode(b.judul || p.judulBuku), 
    b.lokasiRak ? b.lokasiRak : `c.${currentCopy}` // <-- Diubah menjadi 'c' kecil
].filter(Boolean);

            return { 
                uniqueBarcode: uBarcode, 
                rawIsbn: cleanIsbn, 
                spineCallNumber: sL.join('\n'), 
                callNumberLine: sL.join(' '), 
                copyNum: currentCopy, 
                totalCopies: totalCopies 
            };
        });
    }, [items, buku]);

    const totalPages = Math.ceil(eD.length / limit) || 1;
    const currentBatch = eD.slice((page - 1) * limit, page * limit);

    return (
        <div id="print-area" className="relative min-h-screen bg-white pb-10">

            return (

     const PrintLabelSisaView = ({ items, sekolah, onClose }) => {

        const RekapView = ({ kehadiran, peminjaman, anggota, onPrint, filter, setFilter, sekolah }) => {

            const uJurusan = useMemo(() => [...new Set(anggota.filter(d => d.kategori === 'Siswa' && d.jurusan).map(d => d.jurusan))].sort(), [anggota]);
            const uThn = useMemo(() => [...new Set(anggota.filter(d => d.kategori === 'Siswa' && d.tahunPelajaran).map(d => d.tahunPelajaran))].sort(), [anggota]);

            const iWD = dS => {
                if (!filter.start && !filter.end) return true;
                const d = new Date(dS); d.setHours(0, 0, 0, 0);
                let s = new Date('2000-01-01'); if (filter.start) { s = new Date(filter.start); s.setHours(0, 0, 0, 0); }
                let e = new Date('2100-01-01'); if (filter.end) { e = new Date(filter.end); e.setHours(23, 59, 59, 999); }
                return d >= s && d <= e;
            };

            const matchText = (text, q) => !q || (text && text.toLowerCase().includes(q.toLowerCase()));

            const fK = kehadiran.filter(k => {

                const kKelasLengkap = formatKelasSiswa(k, sekolah?.daftarJurusan);

                                <h3 className="text-lg font-black text-slate-800 mb-6 flex items-center justify-between"><div className="flex items-center gap-3"><div className="p-2 bg-blue-50 rounded-lg text-blue-500"><i className="fas fa-book-medical"></i></div> Buku Terbaru Ditambahkan</div></h3>
                                <div className="flex gap-4 overflow-x-auto pb-4 custom-scrollbar snap-x snap-mandatory flex-1 items-center">

                            </div>
                            <div className="bg-white p-6 md:p-8 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border-0 flex flex-col">
                                <h3 className="text-lg font-black text-slate-800 mb-6 flex items-center justify-between"><div className="flex items-center gap-3"><div className="p-2 bg-amber-50 rounded-lg text-amber-500"><i className="fas fa-fire"></i></div> Paling Diminati (Terlaris)</div></h3>
                                <div className="flex gap-4 overflow-x-auto pb-4 custom-scrollbar snap-x snap-mandatory flex-1 items-center">
                                    {bTl.map((b, i) => <BookCard key={b.id} book={b} onClick={setSB} badge={`#${i + 1}`} />)}
                                    {bTl.length === 0 ? <p className="text-sm w-full font-medium text-slate-400 text-center py-6">Belum ada data peminjaman.</p> : null}
                                </div>
                            </div>
                        </div>
                        <TopPeminjam peminjaman={peminjaman} anggota={anggota} onUserClick={onUserClick} sekolah={sekolah} />
                    </div>
                    {qM && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[9999] flex items-center justify-center p-4">
                            <div className="bg-white rounded-[2rem] w-full max-w-2xl max-h-[90vh] flex flex-col shadow-2xl animate-[bounceIn_0.3s_ease-out]">
                                <div className="p-6 border-b flex justify-between items-center bg-slate-50 rounded-t-[2rem]">
                                    <h3 className="text-xl font-black"><i className="fas fa-quote-right text-indigo-500 mr-2"></i> Kelola Quotes</h3>
                                    <button onClick={() => setQM(false)} className="w-8 h-8 bg-white rounded-full shadow-sm flex justify-center items-center"><i className="fas fa-times"></i></button>
                                </div>
                                <div className="p-6 flex-1 overflow-y-auto custom-scrollbar">
                                    <div className="mb-6 bg-indigo-50 p-5 rounded-2xl border border-indigo-100">
                                        <h4 className="font-black text-indigo-900 mb-3">Tambah Quote Baru</h4>
                                        <div className="space-y-3">
                                            <textarea placeholder="Tulis quote disini..." className="w-full p-3 rounded-xl border focus:outline-none focus:ring-2 focus:ring-indigo-300 text-sm font-medium" rows="3" value={qF.text} onChange={e => setQF({ ...qF, text: e.target.value })}></textarea>
                                            <div className="flex gap-3">
                                                <input type="text" placeholder="Penulis/Sumber" className="flex-1 p-3 rounded-xl border focus:outline-none focus:ring-2 focus:ring-indigo-300 text-sm font-bold" value={qF.author} onChange={e => setQF({ ...qF, author: e.target.value })} />
                                                <button onClick={() => { if (!qF.text) return showAlert('Gagal', 'Teks wajib diisi!', 'warning'); onAddQuote({ text: qF.text, author: qF.author || 'Anonim', createdAt: Date.now() }); setQF({ text: '', author: '' }); showAlert('Berhasil', 'Quote ditambahkan!', 'success'); }} className="bg-indigo-600 text-white font-bold px-6 py-2 rounded-xl hover:bg-indigo-700 shadow-md">Tambah</button>
                                            </div>
                                        </div>
                                    </div>
                                    <h4 className="font-black text-slate-800 mb-3">Daftar Quotes Tersimpan</h4>
                                    <div className="space-y-3">
                                        {quotes.map(qu => (
                                            <div key={qu.id} className="p-4 bg-white border border-slate-200 rounded-xl shadow-sm flex justify-between gap-4 group">
                                                <div><p className="text-sm font-bold text-slate-700 mb-1 leading-snug">&quot;{qu.text}&quot;</p><p className="text-[10px] font-black text-indigo-500 uppercase">- {qu.author}</p></div>
                                                <button onClick={() => onDeleteQuote(qu.id)} className="w-8 h-8 shrink-0 bg-rose-50 text-rose-500 rounded-lg flex items-center justify-center hover:bg-rose-500 hover:text-white transition-colors"><i className="fas fa-trash"></i></button>
                                            </div>
                                        ))}
                                        {quotes.length === 0 && <p className="text-center text-sm font-bold text-slate-400 py-6">Belum ada quotes tersimpan.</p>}

                    )}

                    {/* POPUP OTOMATIS (1,2 DETIK UNTUK SUKSES / 2,5 DETIK UNTUK PERINGATAN) & BISA DITUTUP MANUAL */}
                    {splashInfo && (
                        <div 
                            className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[99999] flex items-center justify-center p-4"
                            onClick={closeSplash}

                            <div 
                                className="bg-white rounded-[2rem] shadow-2xl w-full max-w-sm overflow-hidden flex flex-col transform scale-100 transition-transform animate-[zoomIn_0.2s_ease-out]"
                                onClick={e => e.stopPropagation()}
                            >
                                <div className={`p-8 flex flex-col items-center text-center ${splashInfo.type === 'success' ? 'bg-emerald-50' : 'bg-amber-50'}`}>
                                    <div className={`w-20 h-20 rounded-full flex items-center justify-center text-4xl mb-4 shadow-inner overflow-hidden border-2 ${splashInfo.type === 'success' ? 'bg-emerald-100 text-emerald-500 border-emerald-200' : 'bg-amber-100 text-amber-500 border-amber-200'}`}>
                                        {splashInfo.user?.foto ? (
                                            <img src={splashInfo.user.foto} alt="Foto" className="w-full h-full object-cover" />
                                        ) : (
                                            <i className={`fas ${splashInfo.type === 'success' ? 'fa-check-circle' : 'fa-clock'}`}></i>
                                        )}
                                    </div>
                                    <span className={`text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-widest mb-2 border ${splashInfo.type === 'success' ? 'bg-white text-emerald-600 border-emerald-200' : 'bg-white text-amber-600 border-amber-200'}`}>
                                        {splashInfo.title}
                                    </span>
                                    <h3 className="text-xl font-black text-slate-800 leading-tight mb-1">{splashInfo.user?.nama}</h3>
                                    <p className="text-xs font-bold text-indigo-500 uppercase mb-3">
                                        {splashInfo.user?.kategori === 'Siswa' ? formatKelasSiswa(splashInfo.user, sekolah?.daftarJurusan) : splashInfo.user?.kategori}
                                    </p>
                                    <p className="text-slate-600 text-xs font-semibold leading-relaxed">{splashInfo.message}</p>
                                </div>
                                <div className="p-4 bg-white flex justify-center border-t border-slate-100">
                                    <button 
                                        type="button"
                                        onClick={closeSplash} 
                                        className={`px-5 py-2.5 text-xs font-bold text-white rounded-xl transition-all w-full shadow-md ${splashInfo.type === 'success' ? 'bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-500 hover:to-teal-600' : 'bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600'}`}
                                    >
                                        Tutup
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <BookDetailModal isOpen={!!sB} onClose={() => setSB(null)} book={sB} />
                </div>
            );
        };
        
const AuditEksemplarView = ({ buku, peminjaman, anggota, sekolah, onPrintSisa }) => {
    const [search, setSearch] = useState('');
    const [selectedBook, setSelectedBook] = useState(null);

    // --- FUNGSI BANTUAN UNTUK MENGHITUNG STOK REAL (DITAMBAH HITUNGAN PINJAM) ---
    const getRealStock = (bukuItem) => {
        const activeLoansCount = peminjaman.filter(p => p.idBuku === bukuItem.id && p.status === 'Dipinjam').length;
        let awal = parseInt(bukuItem.stockAwal);
        if (isNaN(awal) || awal <= 0) {
            awal = (parseInt(bukuItem.stock) || 0) + activeLoansCount;
        }
        awal = Math.min(awal, 5000); // Batas aman anti-crash (Maksimal 5000 eksemplar/buku)
        const sisa = Math.max(0, awal - activeLoansCount);
        return { awal, sisa, pinjam: activeLoansCount }; // Menyimpan jumlah yang dipinjam
    };

    // Filter buku untuk pencarian (DENGAN PENGAMAN ANTI-CRASH JUDUL KOSONG)
    const filteredBuku = useMemo(() => {
        if (!search) return buku.slice(0, 10); 
        const searchLower = search.toLowerCase();
        return buku.filter(b => 
            b.status !== 'Direduksi' && 
            ((b.judul || '').toLowerCase().includes(searchLower) || 
            (b.isbn || '').toLowerCase().includes(searchLower) || 
            (b.noInduk || '').toLowerCase().includes(searchLower))
        ).slice(0, 20);
    }, [buku, search]);

    // LOGIKA PINTAR AUDIT EKSEMPLAR
    const detailEksemplar = useMemo(() => {
        if (!selectedBook) return null;
        
        const activeLoans = peminjaman.filter(p => p.idBuku === selectedBook.id && p.status === 'Dipinjam');
        
        const borrowedCopies = activeLoans.map(loan => {
            const parts = (loan.kodeEksemplar || '').split('-');
            return parseInt(parts[parts.length - 1]) || 1;
        });

        const stockData = getRealStock(selectedBook);
        
        const availableCopies = [];
        for (let i = 1; i <= stockData.awal; i++) {
            if (!borrowedCopies.includes(i)) {
                availableCopies.push(i);
            }
        }

        return { 
            borrowed: borrowedCopies, 
            available: availableCopies, 
            loans: activeLoans,
            tersedia: availableCopies.length, 
            totalFisik: stockData.awal
        };
    }, [selectedBook, peminjaman]);

    const handlePrintAvailable = () => {
        if (!selectedBook || !detailEksemplar) return;
        
        const sL = [selectedBook.kodeLabel ? selectedBook.kodeLabel : getDDC(selectedBook.klasifikasiDDC), getAuthorCode(selectedBook.pengarang), getTitleCode(selectedBook.judul)].filter(Boolean);
        
        const itemsToPrint = detailEksemplar.available.map(copyNum => ({
            ...selectedBook,
            copyNum: copyNum,
            totalCopies: detailEksemplar.totalFisik,
            spineCallNumber: [...sL, selectedBook.lokasiRak ? selectedBook.lokasiRak : `c.${copyNum}`].join('\n')
        }));

        onPrintSisa(itemsToPrint);
    };

    return (
        <div className="bg-white rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border-0 overflow-hidden min-h-[75vh] flex flex-col">
            <div className="p-8 md:p-10 border-b bg-gradient-to-r from-teal-50 to-emerald-50">
                <h2 className="text-3xl font-black text-teal-900 mb-3"><i className="fas fa-clipboard-check text-teal-500 mr-3"></i> Audit & Cek Sisa Eksemplar</h2>
                <p className="text-slate-600 font-medium">Lacak urutan buku paket/koleksi yang belum terpinjam dan cetak barcodenya kembali jika hilang/rusak.</p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-0 flex-1">
                {/* Kiri: Pencarian Buku */}
                <div className="p-8 border-r border-slate-100 flex flex-col h-[500px]">
                    <div className="relative mb-6 shrink-0">
                        <i className="fas fa-search absolute left-4 top-3.5 text-teal-400"></i>
                        <input type="text" placeholder="Cari Judul, ISBN, atau No Induk..." className="w-full bg-slate-50 border border-slate-200 pl-11 pr-4 py-3 rounded-xl font-bold focus:ring-2 focus:ring-teal-200" value={search} onChange={e => setSearch(e.target.value)} autoFocus />
                    </div>
                    
                    <div className="flex-1 overflow-y-auto pr-2 custom-scrollbar space-y-3">
                        {filteredBuku.map(b => {
                            // --- SINKRONISASI STOK KIRI DAN KANAN ---
                            const stockData = getRealStock(b);
                            return (
                                <div key={b.id} onClick={() => setSelectedBook(b)} className={`p-4 rounded-xl border cursor-pointer transition-all flex gap-4 items-center ${selectedBook?.id === b.id ? 'bg-teal-50 border-teal-400 shadow-sm' : 'bg-white border-slate-100 hover:border-teal-200 hover:bg-slate-50'}`}>
                                    <div className="w-12 h-16 bg-slate-200 rounded shrink-0 overflow-hidden border border-slate-200">
                                        {b.cover ? <img src={b.cover} className="w-full h-full object-cover" alt="Cover"/> : <div className="w-full h-full flex items-center justify-center text-slate-400"><i className="fas fa-book"></i></div>}
                                    </div>
                                    <div className="flex-1">
                                        <h4 className="font-bold text-slate-800 line-clamp-2 leading-tight">{b.judul}</h4>
                                        <p className="text-xs font-mono text-slate-500 mt-1">{b.isbn || b.noInduk}</p>
                                    </div>
                                    <div className="text-center shrink-0 ml-1">
                                        <span className="block text-[9px] text-slate-400 font-bold uppercase mb-1 tracking-wider">Awal / Pjm / Sisa</span>
                                        <div className="bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 flex items-center justify-center gap-1.5 text-[11px] font-black shadow-sm">
                                            <span className="text-slate-600" title="Stok Awal">{stockData.awal}</span>
                                            <span className="text-slate-300">/</span>
                                            <span className="text-rose-500" title="Sedang Dipinjam">{stockData.pinjam}</span>
                                            <span className="text-slate-300">/</span>
                                            <span className="text-emerald-600" title="Sisa di Rak">{stockData.sisa}</span>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>

                {/* Kanan: Detail Eksemplar */}
                <div className="p-8 bg-slate-50/50 flex flex-col h-[500px]">
                    {selectedBook ? (
                        <div className="flex flex-col h-full">
                            <h3 className="text-xl font-black text-slate-800 mb-1 leading-tight">{selectedBook.judul}</h3>
                            
                            <div className="flex flex-wrap gap-4 text-sm text-slate-600 font-bold mb-6 border-b border-slate-200 pb-4 mt-2">
                                <span><i className="fas fa-barcode mr-1.5"></i> {selectedBook.isbn || selectedBook.noInduk}</span>
                                <span className="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-md"><i className="fas fa-layer-group mr-1.5"></i> Total Fisik: {detailEksemplar.totalFisik}</span>
                            </div>

                            <div className="flex-1 overflow-y-auto custom-scrollbar">
                                <div className="mb-6">
                                    <div className="flex justify-between items-center mb-3">
                                        <h4 className="font-bold text-emerald-600 flex items-center"><i className="fas fa-check-circle mr-2"></i>Tersedia di Rak ({detailEksemplar.tersedia})</h4>
                                        {detailEksemplar.available.length > 0 && (
                                            <button onClick={handlePrintAvailable} className="bg-emerald-50 text-emerald-600 border border-emerald-200 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-emerald-500 hover:text-white transition-colors">
                                                <i className="fas fa-print mr-1"></i> Cetak Label
                                            </button>
                                        )}
                                    </div>
                                    {detailEksemplar.available.length === 0 ? (
                                        <p className="text-xs font-bold text-slate-400 bg-slate-100 p-3 rounded-xl">Semua buku sedang dipinjam.</p>
                                    ) : (
                                        <div className="flex flex-wrap gap-2">
                                            {detailEksemplar.available.map(num => (
                                                <span key={num} className="bg-emerald-100 border border-emerald-300 text-emerald-800 px-3 py-1.5 rounded-lg text-sm font-black shadow-sm">
                                                    Eks. {num}
                                                </span>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                <div>
                                    <h4 className="font-bold text-rose-600 flex items-center mb-3"><i className="fas fa-hand-holding-box mr-2"></i>Sedang Dipinjam ({detailEksemplar.loans.length})</h4>
                                    {detailEksemplar.loans.length === 0 ? (
                                        <p className="text-xs font-bold text-slate-400 bg-slate-100 p-3 rounded-xl">Belum ada yang meminjam buku ini.</p>
                                    ) : (
                                        <div className="space-y-2">
                                            {detailEksemplar.loans.map(loan => {
                                                const parts = (loan.kodeEksemplar || '').split('-');
                                                const num = parseInt(parts[parts.length - 1]) || '?';
                                                
                                                // --- MENGAMBIL INFORMASI KELAS/STATUS ---
                                                const borrower = anggota?.find(a => a.id === loan.idAnggota);
                                                let borrowerInfo = '-';
                                                
                                                if (borrower) {
                                                    if (borrower.kategori === 'Siswa') {
                                                        borrowerInfo = typeof formatKelasSiswa === 'function' ? formatKelasSiswa(borrower, sekolah?.daftarJurusan) : `${borrower.kelas || ''} ${borrower.jurusan || ''}`.trim();
                                                    } else {
                                                        borrowerInfo = borrower.kategori;
                                                    }
                                                }

                                                return (
                                                    <div key={loan.id} className="flex justify-between items-center bg-white border border-rose-100 p-3 rounded-xl shadow-sm">
                                                        <div className="flex flex-col">
                                                            <div className="flex items-center">
                                                                <span className="bg-rose-100 text-rose-700 font-black px-2 py-0.5 rounded text-xs mr-2">Eks. {num}</span>
                                                                <span className="font-bold text-slate-700 text-sm">{loan.namaPeminjam}</span>
                                                            </div>
                                                            <span className="text-[10px] font-bold text-rose-500 uppercase tracking-widest mt-1">
                                                                {borrowerInfo}
                                                            </span>
                                                        </div>
                                                        <span className="text-[10px] font-bold text-slate-400">{loan.tglPinjam}</span>
                                                    </div>
                                                )
                                            })}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="flex-1 flex flex-col items-center justify-center text-slate-400">
                            <i className="fas fa-hand-pointer text-5xl mb-4 opacity-50"></i>
                            <p className="font-bold text-sm">Pilih buku di sebelah kiri untuk melihat detail eksemplar.</p>
                        </div>
                    )}
                </div>
            </div>
        </div>
    );
};

        const DashboardView = ({ anggota, buku, peminjaman, kehadiran, sekolah, onUserClick }) => {
            const [sB, setSB] = useState(null);
            const aL = peminjaman.filter(p => p.status === 'Dipinjam').length;
            const tS = new Date().toISOString().split('T')[0];
            const tD = new Date(tS);
            const tM = tS.substring(0, 7);
            let kH = 0, kM = 0, kB = 0;
            const sD = new Date(tD); sD.setDate(tD.getDate() - 7);
            
            kehadiran.forEach(k => { if (k.tanggal === tS) kH++; if (k.tanggal.startsWith(tM)) kB++; const kDt = new Date(k.tanggal); if (kDt >= sD && kDt <= tD) kM++; });
            const pC = {}; peminjaman.forEach(p => { pC[p.idBuku] = (pC[p.idBuku] || 0) + 1; });
            const bTl = [...buku].map(b => ({ ...b, totalPinjam: pC[b.id] || 0 })).filter(b => b.totalPinjam > 0 && b.status !== 'Direduksi').sort((a, b) => b.totalPinjam - a.totalPinjam).slice(0, 5);
            const bTb = [...buku].filter(b => b.status !== 'Direduksi').sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 5);
            
            const Stat = ({ icon, title, value, color }) => (
                <div className="bg-white rounded-3xl p-6 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border-0 flex items-center gap-5 hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)] hover:-translate-y-1 transition-all duration-300 group">
                    <div className={`w-16 h-16 rounded-2xl flex items-center justify-center text-white shadow-lg group-hover:scale-110 transition-transform duration-300 shrink-0 ${color}`}>{icon}</div>
                    <div><p className="text-xs font-black text-slate-400 mb-0.5 uppercase tracking-wider">{title}</p><h4 className="text-3xl font-black text-slate-800 tracking-tight">{value}</h4></div>
                </div>
            );
            
            return (
                <div className="space-y-8">
                    <div className="bg-white p-6 md:p-8 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border-0 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 relative overflow-hidden">
                        <div className="absolute right-0 top-0 w-64 h-64 bg-gradient-to-bl from-indigo-50 to-transparent rounded-full -mr-20 -mt-20 z-0"></div>
                        <div className="flex items-center gap-6 relative z-10">
                            {sekolah.logo ? <img src={sekolah.logo} className="w-24 h-24 object-contain rounded-2xl bg-white border border-slate-100 p-2 shadow-sm" alt="Logo" /> : null}
                            <div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">

                        <div className="bg-white p-6 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border-0 flex items-center justify-between group cursor-default">
                            <div><p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Kunjungan 7 Hari</p><h4 className="text-3xl font-black text-violet-600">{kM}</h4></div>

                            <div className="w-14 h-14 rounded-2xl bg-purple-50 text-purple-500 flex items-center justify-center text-2xl group-hover:scale-110 transition-transform"><i className="fas fa-calendar-days"></i></div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-2 space-y-6">
                            <div className="bg-white p-6 md:p-8 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border-0 flex flex-col">
                                <h3 className="text-lg font-black text-slate-800 mb-6 flex items-center justify-between"><div className="flex items-center gap-3"><div className="p-2 bg-blue-50 rounded-lg text-blue-500"><i className="fas fa-book-medical"></i></div> Buku Terbaru Ditambahkan</div><span className="text-[10px] font-bold text-slate-400 bg-slate-50 px-2 py-1 rounded-md uppercase tracking-widest">5 Terbaru</span></h3>
                                <div className="flex gap-4 overflow-x-auto pb-4 custom-scrollbar snap-x snap-mandatory flex-1 items-center">

                                <h3 className="text-lg font-black text-slate-800 mb-6 flex items-center justify-between"><div className="flex items-center gap-3"><div className="p-2 bg-amber-50 rounded-lg text-amber-500"><i className="fas fa-fire"></i></div> Paling Diminati (Terlaris)</div><span className="text-[10px] font-bold text-slate-400 bg-slate-50 px-2 py-1 rounded-md uppercase tracking-widest">Top 5</span></h3>
                                <div className="flex gap-4 overflow-x-auto pb-4 custom-scrollbar snap-x snap-mandatory flex-1 items-center">
                                    {bTl.map((b, i) => <BookCard key={b.id} book={b} onClick={setSB} badge={`#${i + 1}`} />)}
