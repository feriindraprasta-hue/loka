        .btn-primary { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); color: #fff; padding: 0.8rem 1.5rem; border-radius: 1rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; transition: all 0.3s ease; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(168, 85, 247, 0.4); }
        .btn-primary:active { transform: translateY(0); }
        .btn-secondary { background: #fff; color: #475569; padding: 0.8rem 1.5rem; border-radius: 1rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; transition: all 0.3s ease; border: 1px solid #e2e8f0; cursor: pointer; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02); }
        .btn-secondary:hover { background: #f8fafc; border-color: #cbd5e1; transform: translateY(-1px); }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }

            body * { visibility: hidden; }

    <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

        const firebaseConfig = {

        const DEFAULT_JURUSAN = [
            { nama: 'Akuntansi', singkatan: 'AK' }, { nama: 'Bisnis Daring', singkatan: 'BD' }, 
            { nama: 'Design Komunikasi Visual', singkatan: 'DKV' }, { nama: 'Kriya Kreatif Batik dan Tekstil', singkatan: 'KKBT' }, 
            { nama: 'Managemen Perkantoran', singkatan: 'MP' }, { nama: 'Produksi dan Siaran Program Televisi', singkatan: 'PSPT' }, 
            { nama: 'Teknik Logistik', singkatan: 'TL' }, { nama: 'Usaha Layanan Wisata', singkatan: 'ULW' }
        ];

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        /* --- FUNGSI HELPER --- */
        const formatDate = d => new Date(d).toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });
        const getAuthorCode = n => { if (!n) return 'XXX'; const p = n.trim().split(' '); return p[p.length - 1].substring(0, 3).toUpperCase(); };
        const getTitleCode = t => t ? t.trim().substring(0, 1).toLowerCase() : 'x';
        const getDDC = k => k ? k.split(' ')[0] : '000';
        const getSingkatanJurusan = (j, d = DEFAULT_JURUSAN) => { if (!j) return ''; const f = d.find(x => x.nama === j); return f ? f.singkatan : j; };
        const formatKelasSiswa = (i, d = DEFAULT_JURUSAN) => { if (!i || i.kategori !== 'Siswa') return i?.kategori || '-'; return `${i.kelas || ''} ${i.kelasJurusan || getSingkatanJurusan(i.jurusan, d)} ${i.noKelas || ''}`.trim().replace(/\s+/g, ' '); };
        const formatWA = n => { if (!n) return ''; let f = n.toString().replace(/\D/g, ''); if (f.startsWith('0')) f = '62' + f.substring(1); return f; };

        // Fungsi auto-format nama dan gelar (Lokabaca Edition - Diperbarui)
const formatNamaGelarPintar = (input) => {
    if (!input) return "";

    const masterGelarDepan = ["Drs.", "Dra.", "Dr.", "Prof.", "Ir.", "H.", "Hj."];
    const masterGelarBelakang = [
        "S.ST.Par.", "S.Kom.", "S.Pd.", "Gr.", "S.T.", "S.E.", "S.H.", "S.Tr.Par.", 
        "S.Sos.", "M.Pd.", "M.Kom.", "M.Si.", "M.T.", "Ph.D.", "S.Ag.", "M.Ag.", "S.Pd.I." , "S.Psi."
    ];

    let [bagianUtama, ...gelarBelakang] = input.split(",").map(item => item.trim());
    let kataUtama = bagianUtama.split(" ");
    
    let hasilUtama = kataUtama.map(kata => {
        let kataCek = kata.endsWith(".") ? kata : kata + ".";
        let gelarDitemukan = masterGelarDepan.find(g => 
            g.toLowerCase() === kata.toLowerCase() || 
            g.toLowerCase() === kataCek.toLowerCase()
        );
        if (gelarDitemukan) return gelarDitemukan;
        return kata.toUpperCase();
    });

    let hasilGelarBelakang = gelarBelakang.map(g => {
        let gCek = g.endsWith(".") ? g : g + ".";
        let gelarDitemukan = masterGelarBelakang.find(s => 
            s.toLowerCase() === g.toLowerCase() || 
            s.toLowerCase() === gCek.toLowerCase()
        );
        if (gelarDitemukan) return gelarDitemukan;
        return g.charAt(0).toUpperCase() + g.slice(1).toLowerCase();
    });

    let namaFinal = hasilUtama.join(" ");
    return hasilGelarBelakang.length > 0 ? `${namaFinal}, ${hasilGelarBelakang.join(", ")}` : namaFinal;
};

        // Fungsi keamanan Hashing SHA-256 (Standar Industri)
        const hashSHA256 = async (text) => {
            const msgBuffer = new TextEncoder().encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        };



        /* ========================================================= */
        /* --- KOMPONEN UI & MODAL --- */
        /* ========================================================= */

        const CustomModal = ({ isOpen, title, message, onConfirm, onCancel, type = 'info', showCancel = false }) => {
            if (!isOpen) return null;
            const th = {
                success: { bg: 'bg-emerald-50', icon: 'fa-check-circle text-emerald-500', btn: 'bg-gradient-to-r from-emerald-400 to-teal-500 shadow-emerald-500/30' },
                error: { bg: 'bg-rose-50', icon: 'fa-times-circle text-rose-500', btn: 'bg-gradient-to-r from-rose-400 to-red-500 shadow-rose-500/30' },
                warning: { bg: 'bg-amber-50', icon: 'fa-exclamation-triangle text-amber-500', btn: 'bg-gradient-to-r from-amber-400 to-orange-500 shadow-amber-500/30' },
                info: { bg: 'bg-indigo-50', icon: 'fa-info-circle text-indigo-500', btn: 'bg-gradient-to-r from-indigo-400 to-blue-500 shadow-indigo-500/30' }
            };
            const t = th[type] || th.info;
            return (
                <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[9999] flex items-center justify-center p-4">
                    <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-sm overflow-hidden flex flex-col transform scale-100 transition-transform">
                        <div className={`p-8 flex flex-col items-center text-center ${t.bg}`}>
                            <i className={`fas ${t.icon} text-6xl mb-5 drop-shadow-md`}></i>
                            <h3 className="text-2xl font-black text-slate-800 mb-2 leading-tight tracking-tight">{title}</h3>
                            <p className="text-slate-600 text-sm whitespace-pre-line leading-relaxed font-medium">{message}</p>
                        </div>
                        <div className="p-5 flex justify-center gap-3 bg-white">
                            {showCancel && (<button onClick={onCancel} className="px-5 py-3 text-sm font-bold text-slate-500 bg-slate-100 rounded-xl hover:bg-slate-200 transition-colors w-full">Batal</button>)}
                            <button onClick={onConfirm} className={`px-5 py-3 text-sm font-bold text-white rounded-xl transition-all w-full shadow-lg ${t.btn}`}>{showCancel ? 'Ya, Lanjutkan' : 'Tutup'}</button>
                        </div>
                    </div>
                </div>
            );
        };

        const SimpleBarcode = ({ value, height = 35 }) => {
            const r = useRef(null);
            useEffect(() => {
                if (r.current && value) {
                    try { 
                        JsBarcode(r.current, value, { 
                            format: "CODE128", 
                            width: 1.2,
                            height: height, 
                            displayValue: false, 
                            margin: 0, 
                            background: "transparent", 
                            lineColor: "#0f172a" 
                        }); 
                    } catch (e) { console.error("Barcode generation error", e); }
                }
            }, [value, height]);
            if (!value) return null;
            return (
                <div className="flex flex-col items-center justify-center w-full mt-1.5 px-1">
                    <canvas ref={r} style={{ height: `${height}px`, width: '100%', maxWidth: '100%' }}></canvas>
                    <span className="text-[10px] mt-1.5 tracking-[0.2em] font-mono text-center w-full overflow-hidden break-all leading-none font-bold text-slate-800">{value}</span>
                </div>
            );
        };

        const Input = ({ label, type = 'text', value, onChange, onBlur, required, placeholder, className = '', autoFocus, disabled }) => (
            <div className={className}>
                <label className="block text-sm font-bold text-slate-600 mb-1.5 ml-1">{label}</label>
                <input type={type} value={value} onChange={onChange} onBlur={onBlur} required={!!required} placeholder={placeholder} autoFocus={!!autoFocus} disabled={!!disabled} className={`input-field ${disabled ? 'opacity-50 cursor-not-allowed' : ''}`} />
            </div>
        );

        const BookCard = ({ book, onClick, badge }) => (
            <div onClick={() => onClick(book)} className="flex-none w-[130px] md:w-[150px] cursor-pointer group snap-start relative">
                <div className="relative w-full aspect-[2/3] rounded-2xl bg-slate-100 mb-3 shadow-sm overflow-hidden transition-all duration-300 group-hover:-translate-y-1 group-hover:shadow-lg border border-slate-200/50">
                    {book.cover ? (
                        <img src={book.cover} className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" alt={book.judul} />
                    ) : (
                        <div className="w-full h-full flex flex-col items-center justify-center bg-gradient-to-br from-slate-100 to-slate-200 text-slate-300">
                            <i className="fas fa-book text-4xl mb-2"></i>
                            <span className="text-[9px] font-bold px-2 text-center leading-tight">{book.judul}</span>
                        </div>
                    )}
                    {badge && <div className="absolute top-2 left-2 bg-gradient-to-r from-amber-500 to-orange-500 text-white text-[10px] font-black px-2.5 py-1 rounded-lg shadow-lg uppercase tracking-wider">{badge}</div>}
                    {book.stock <= 0 && <div className="absolute inset-0 bg-white/50 backdrop-blur-[2px] flex items-center justify-center"><span className="bg-rose-500 text-white text-[10px] font-black px-3 py-1.5 rounded-xl shadow-xl uppercase tracking-widest transform -rotate-12 border-2 border-white">Dipinjam</span></div>}
                </div>
                <h4 className="font-bold text-sm text-slate-800 leading-tight line-clamp-2 group-hover:text-indigo-600 transition-colors">{book.judul}</h4>
                <p className="text-[11px] font-semibold text-slate-500 mt-1 truncate">{book.pengarang}</p>
            </div>
        );

        const BookDetailModal = ({ isOpen, onClose, book }) => {
            if (!isOpen || !book) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[9999] flex items-center justify-center p-4 sm:p-6" onClick={onClose}>
                    <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-3xl overflow-hidden flex flex-col md:flex-row transform scale-100 transition-transform" onClick={e => e.stopPropagation()}>
                        <div className="md:w-5/12 bg-slate-100 flex flex-col items-center justify-center p-8 relative shrink-0">
                            <div className="w-48 md:w-full max-w-[200px] aspect-[2/3] rounded-2xl overflow-hidden shadow-xl bg-white border border-slate-200">
                                {book.cover ? <img src={book.cover} alt={book.judul} className="w-full h-full object-cover" /> : <div className="w-full h-full flex flex-col items-center justify-center text-slate-300 bg-slate-50"><i className="fas fa-book text-6xl mb-4"></i></div>}
                            </div>
                            <div className="mt-6 flex flex-wrap justify-center gap-2">
                                <span className={`px-4 py-1.5 rounded-xl text-xs font-black tracking-widest uppercase shadow-sm border ${book.stock > 0 ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-rose-50 text-rose-600 border-rose-100'}`}>
                                    {book.stock > 0 ? <><i className="fas fa-check-circle mr-1"></i> Tersedia ({book.stock})</> : <><i className="fas fa-times-circle mr-1"></i> Dipinjam</>}
                                </span>
                                <span className="px-4 py-1.5 rounded-xl text-xs font-black tracking-widest uppercase shadow-sm bg-indigo-50 text-indigo-600 border border-indigo-100">{book.sumberPerolehan || 'BOSP'}</span>
                            </div>
                        </div>
                        <div className="md:w-7/12 p-8 md:p-10 flex flex-col relative max-h-[85vh]">
                            <button onClick={onClose} className="absolute top-6 right-6 w-10 h-10 bg-slate-50 hover:bg-slate-200 rounded-full flex items-center justify-center transition-colors text-slate-500 z-10 shrink-0"><i className="fas fa-times"></i></button>
                            <div className="pr-12 shrink-0">
                                <h3 className="text-2xl md:text-3xl font-black text-slate-800 mb-1 leading-tight">{book.judul}</h3>
                                {book.anakJudul && <p className="text-sm font-bold text-slate-500 mb-2 italic">{book.anakJudul}</p>}
                                <p className="text-indigo-600 font-bold mb-4 flex items-center gap-2"><i className="fas fa-pen-nib text-indigo-400"></i> {book.pengarang}</p>
                                <div className="flex flex-wrap gap-4 text-xs font-semibold text-slate-500 mb-6">
                                    <span className="flex items-center gap-1.5"><i className="fas fa-building text-slate-400"></i> {book.penerbit || '-'} ({book.tahun || '-'})</span>
                                    <span className="flex items-center gap-1.5"><i className="fas fa-barcode text-slate-400"></i> {book.isbn || '-'}</span>
                                </div>
                            </div>
                            <div className="flex-1 overflow-y-auto pr-2 custom-scrollbar mb-6 relative">
                                <h4 className="text-xs font-black text-slate-400 uppercase tracking-widest mb-2 sticky top-0 bg-white/90 backdrop-blur-sm py-1">Sinopsis</h4>
                                <p className="text-sm text-slate-600 leading-relaxed font-medium">{book.sinopsis || "Tidak ada informasi sinopsis yang tersedia untuk buku ini."}</p>
                                <div className="mt-4 pt-4 border-t border-slate-100">
                                    <p className="text-xs text-slate-500"><span className="font-bold text-slate-700">Deskripsi Fisik:</span> {book.deskripsiFisik || '-'}</p>
                                    <p className="text-xs text-slate-500 mt-1"><span className="font-bold text-slate-700">Subjek Utama:</span> {book.subjek || '-'}</p>
                                </div>
                            </div>
                            <div className="bg-slate-50 rounded-[1.5rem] p-5 grid grid-cols-2 gap-4 shrink-0 border border-slate-100">
                                <div>
                                    <p className="text-[10px] uppercase font-black text-slate-400 tracking-wider mb-1.5">Lokasi Rak Fisik</p>
                                    <p className="text-sm font-bold text-slate-700 flex items-center gap-2"><i className="fas fa-map-marker-alt text-rose-400"></i> {book.lokasiRak || 'Tidak Ada Data'}</p>
                                </div>
                                <div>
                                    <p className="text-[10px] uppercase font-bold text-slate-400 tracking-wider mb-1.5">Kategori (DDC)</p>
                                    <p className="text-[11px] leading-tight font-bold text-slate-700 line-clamp-2" title={book.klasifikasiDDC}><i className="fas fa-bookmark text-amber-400 mr-1"></i> {book.klasifikasiDDC || '-'}</p>
                                </div>
                            </div>

            );
        };

        const BiodataModal = ({ user, isOpen, onClose, sekolah }) => {
            if (!isOpen || !user) return null;
            return (
                <div className="fixed inset-0 z-[99999] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4" onClick={onClose}>
                    <div className="bg-white rounded-[2rem] w-[95vw] lg:w-[75vw] max-w-6xl max-h-[95vh] flex flex-col relative shadow-2xl animate-[bounceIn_0.3s_ease-out]">
                        <div className="flex justify-between items-start mb-4">
                            <h3 className="text-xl font-black text-slate-800">Biodata Peminjam</h3>
                            <button onClick={onClose} className="w-8 h-8 bg-slate-100 hover:bg-slate-200 transition-colors rounded-full flex justify-center items-center"><i className="fas fa-times text-slate-500"></i></button>

                        <div className="flex flex-col items-center mb-6">
                            <div className="w-20 h-20 bg-indigo-100 text-indigo-500 rounded-full flex items-center justify-center text-3xl font-black mb-3 shadow-inner"><i className="fas fa-user"></i></div>
                            <h4 className="text-xl font-black text-center text-slate-800">{user.nama}</h4>
                            <span className="text-[10px] font-black bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-lg mt-2 uppercase tracking-widest">{user.kategori === 'Siswa' ? formatKelasSiswa(user, sekolah?.daftarJurusan) : user.kategori}</span>
                        </div>
                        <div className="space-y-3 text-sm">
                            <div className="flex justify-between border-b border-slate-100 pb-2"><span className="text-slate-500 font-bold">NISN/NIP</span><span className="font-black text-slate-800">{user.nisn || '-'}</span></div>
                            <div className="flex justify-between border-b border-slate-100 pb-2"><span className="text-slate-500 font-bold">L/P</span><span className="font-black text-slate-800">{user.jenisKelamin}</span></div>
                            <div className="flex justify-between border-b border-slate-100 pb-2"><span className="text-slate-500 font-bold">TTL</span><span className="font-black text-right text-slate-800">{user.tempatLahir}, {user.tanggalLahir}</span></div>
                            <div className="flex justify-between border-b border-slate-100 pb-2"><span className="text-slate-500 font-bold">No. WA</span><span className="font-black text-slate-800">{user.telepon || '-'}</span></div>
                            <div className="flex justify-between"><span className="text-slate-500 font-bold">Alamat</span><span className="font-black text-right max-w-[60%] text-slate-800">{user.alamat || '-'}</span></div>
                        </div>
                    </div>
                </div>
            );
        };

      const TopPeminjam = ({ peminjaman, anggota, onUserClick, sekolah }) => {
    const t = useMemo(() => {
        const cM = new Date().toISOString().substring(0, 7);
        const c = {};
        peminjaman.forEach(p => { if (p.tglPinjam.startsWith(cM)) c[p.idAnggota] = (c[p.idAnggota] || 0) + 1; });
        return Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([id, cnt], i) => { const u = anggota.find(a => a.id === id); return u ? { u, cnt, rank: i + 1 } : null }).filter(Boolean);
    }, [peminjaman, anggota]);
    
    const m = ['text-yellow-400', 'text-slate-300', 'text-amber-600', 'text-indigo-200', 'text-indigo-200'];
    
    return (
        <div className="bg-white p-6 md:p-8 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border-0 flex flex-col h-full">
            <h3 className="text-lg font-black text-slate-800 mb-6 flex items-center justify-between">
                <div className="flex items-center gap-3"><div className="p-2 bg-yellow-50 rounded-lg text-yellow-500"><i className="fas fa-crown"></i></div> Top 5 Peminjam Bulan Ini</div>
            </h3>
            <div className="space-y-3 flex-1">
                {t.map(x => (
                    /* Bagian ini sudah dibersihkan dari onClick dan efek hover */
                    <div key={x.u.id} className="flex items-center justify-between p-3 bg-slate-50 rounded-2xl border border-slate-100">
                        <div className="flex items-center gap-3">
                            <div className={`w-8 text-center text-xl drop-shadow-md ${m[x.rank - 1]}`}><i className="fas fa-medal"></i></div>
                            <div>
                                <p className="font-bold text-sm text-slate-800">{x.u.nama}</p>
                                <p className="text-[10px] font-bold text-slate-500">{x.u.kategori === 'Siswa' ? formatKelasSiswa(x.u, sekolah?.daftarJurusan) : x.u.kategori}</p>

            // PERBAIKAN: Gunakan kodeEksemplar asli dari data transaksi (misal: 9786022447887-74)

        const PrintRekapView = ({ kehadiran, peminjaman, anggota, sekolah, filter }) => {

            const matchText = (text, q) => !q || (text && text.toLowerCase().includes(q.toLowerCase()));

                    if ((filter.kelas && filter.kelas !== 'Semua') || (filter.jurusan && filter.jurusan !== 'Semua') || (filter.tahun && filter.tahun !== 'Semua')) return false;
                    return true;

                return true;

            const gBS = {}; fP.forEach(p => { const a = anggota.find(x => x.id === p.idAnggota); if (a && a.kategori === 'Siswa') { if (!gBS[p.idAnggota]) { gBS[p.idAnggota] = { nama: p.namaPeminjam, kelasFormat: formatKelasSiswa(a, sekolah?.daftarJurusan), buku: [] }; } gBS[p.idAnggota].buku.push(`${p.judulBuku} (${p.status})`); } }); const sF = Object.values(gBS);

        const PrintRekapPaketView = ({ peminjaman, anggota, sekolah, filter }) => {

                if (filter.jurusan !== 'Semua' && a.jurusan !== filter.jurusan) return false;

                if (filter.search) {

       const PrintLabelView = ({ buku, sekolah, onClose, filterText }) => {

                        const baseCode = b.noInduk || b.isbn || b.id; 
                        const uBarcode = `${baseCode}-${i}`; 
                        const sL = [b.kodeLabel ? b.kodeLabel : getDDC(b.klasifikasiDDC), getAuthorCode(b.pengarang), getTitleCode(b.judul), b.lokasiRak ? b.lokasiRak : `c.${i}`].filter(Boolean);

                        {/* Navigasi Halaman */}

                            .label-wrapper { display: flex; align-items: center; gap: 2mm; padding: 2.5mm; border: 1.5px dashed #cbd5e1; border-radius: 10px; width: 88mm; break-inside: avoid; page-break-inside: avoid; background: #fff; }

                            .barcode-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px; }

                            .barcode-copy { font-size: 6pt; font-weight: 700; margin-top: 1px; color: #64748b; }
                            .spine-part { width: 18mm; height: 30mm; border: 1.5px solid #0f172a; background-color: #fdf8ea !important; display: flex; align-items: center; justify-content: center; padding: 2px; text-align: center; font-size: 7.5pt; font-weight: 900; line-height: 1.3; color: #0f172a; }
                            .fold-part { width: 18mm; height: 30mm; border: 1.5px solid #0f172a; background-color: #ffffff !important; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 2px; }
                        `}</style>
                        
                        <div className="print-container">

        const RekapView = ({ kehadiran, peminjaman, anggota, onPrint, filter, setFilter, sekolah }) => {

            const uThn = useMemo(() => [...new Set(anggota.filter(d => d.kategori === 'Siswa' && d.tahunPelajaran).map(d => d.tahunPelajaran))].sort(), [anggota]);

            const iWD = dS => {
                if (!filter.start && !filter.end) return true;
                const d = new Date(dS); d.setHours(0, 0, 0, 0);
                let s = new Date('2000-01-01'); if (filter.start) { s = new Date(filter.start); s.setHours(0, 0, 0, 0); }
                let e = new Date('2100-01-01'); if (filter.end) { e = new Date(filter.end); e.setHours(23, 59, 59, 999); }
                return d >= s && d <= e;
            };

            const matchText = (text, q) => !q || (text && text.toLowerCase().includes(q.toLowerCase()));

            const fK = kehadiran.filter(k => {
                if (!iWD(k.tanggal)) return false;

                    if (k.kategori !== 'Siswa') return false;
                    if (kKelasLengkap !== filter.kelas) return false;
                }
                if (filter.jurusan && filter.jurusan !== 'Semua') {
                    if (k.kategori !== 'Siswa') return false;
                    if (k.jurusan !== filter.jurusan) return false;
                }
                if (filter.tahun && filter.tahun !== 'Semua') {
                    if (k.kategori !== 'Siswa') return false;
                    if (!a || a.tahunPelajaran !== filter.tahun) return false;
                }
                return true;
            });

                if (p.isPaket) return false;

                if (!matchText(p.namaPeminjam, filter.nama)) return false;
                
                const a = anggota.find(x => x.id === p.idAnggota);

                    if ((filter.kelas && filter.kelas !== 'Semua') || (filter.jurusan && filter.jurusan !== 'Semua') || (filter.tahun && filter.tahun !== 'Semua')) return false;
                    return true; 
                }
                const aKelasLengkap = formatKelasSiswa(a, sekolah?.daftarJurusan);

                if (filter.kelas && filter.kelas !== 'Semua') {
                    if (a.kategori !== 'Siswa') return false;
                    if (aKelasLengkap !== filter.kelas) return false;
                }
                if (filter.jurusan && filter.jurusan !== 'Semua') {
                    if (a.kategori !== 'Siswa') return false;
                    if (a.jurusan !== filter.jurusan) return false;
                }
                if (filter.tahun && filter.tahun !== 'Semua') {
                    if (a.kategori !== 'Siswa') return false;
                    if (a.tahunPelajaran !== filter.tahun) return false;
                }
                return true;
            });

                    </div>
                    <div className="p-6 md:p-8 bg-white border-b border-slate-100 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-4 shrink-0">

                        <Input label="Tanggal Akhir" type="date" value={filter.end || ''} onChange={e => setFilter({ ...filter, end: e.target.value })} />
                        <Input label="Nama Anggota" placeholder="Semua Nama..." value={filter.nama || ''} onChange={e => setFilter({ ...filter, nama: e.target.value })} />
                        <div>
                            <label className="block text-sm font-bold text-slate-600 mb-1.5 ml-1">Kelas Lengkap</label>
                            <select className="input-field" value={filter.kelas || 'Semua'} onChange={e => setFilter({ ...filter, kelas: e.target.value })}>
                                <option value="Semua">Seluruh Kelas</option>

                        <div>
                            <label className="block text-sm font-bold text-slate-600 mb-1.5 ml-1">Jurusan</label>

                                <option value="Semua">Seluruh Jurusan</option>
                                {uJurusan.map((j, i) => <option key={i} value={j}>{j}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="block text-sm font-bold text-slate-600 mb-1.5 ml-1">Tahun Ajaran</label>
                            <select className="input-field" value={filter.tahun || 'Semua'} onChange={e => setFilter({ ...filter, tahun: e.target.value })}>
                                <option value="Semua">Semua Tahun</option>
                                {uThn.map((t, i) => <option key={t} value={t}>{t}</option>)}

                    <div className="flex-1 overflow-auto p-6 md:p-8 bg-slate-50/30">

                           <div className="bg-indigo-50 border border-indigo-100 p-4 rounded-2xl flex-1 flex justify-between items-center"><div className="w-12 h-12 bg-white text-indigo-500 rounded-xl flex items-center justify-center text-xl shadow-sm"><i className="fas fa-users"></i></div><div className="text-right"><p className="text-[10px] font-bold text-indigo-500 uppercase tracking-widest">Kunjungan Terfilter</p><h4 className="text-3xl font-black text-indigo-700 leading-none mt-1">{fK.length}</h4></div></div>
                           <div className="bg-emerald-50 border border-emerald-100 p-4 rounded-2xl flex-1 flex justify-between items-center"><div className="w-12 h-12 bg-white text-emerald-500 rounded-xl flex items-center justify-center text-xl shadow-sm"><i className="fas fa-book-reader"></i></div><div className="text-right"><p className="text-[10px] font-bold text-emerald-500 uppercase tracking-widest">Peminjaman Terfilter</p><h4 className="text-3xl font-black text-emerald-700 leading-none mt-1">{fP.length}</h4></div></div>

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">

                                        <tbody className="divide-y divide-slate-100">
                                            {fK.slice(0, 10).map((k, i) => (

                                                    <td className="py-2.5 px-4 font-mono text-xs">{formatDate(k.tanggal)}</td>
                                                    <td className="py-2.5 px-4 font-mono text-xs">{k.waktu}</td>
                                                    <td className="py-2.5 px-4 font-bold text-slate-700">{k.nama}</td>
                                                    <td className="py-2.5 px-4 text-xs font-semibold text-slate-500">{k.kategori === 'Siswa' ? `${k.kelas || ''} ${k.jurusan || ''}`.trim() : k.kategori}</td>

                                            {fK.length > 10 ? <tr><td colSpan="4" className="text-center py-3 text-xs font-bold text-indigo-500 bg-indigo-50/50">+ {fK.length - 10} data lainnya... (Cetak untuk melihat detail)</td></tr> : null}

                    <div className="flex-1 bg-slate-50/50 flex flex-col items-center justify-center p-8 text-center text-slate-400">

        const LabelView = ({ data, onPrint, sekolah, filter, setFilter }) => {
    // 1. State untuk membuka/menutup Dropdown Pencarian
    const [sD, setSD] = useState(false);

    // 2. Logika Pintar: Membaca kata setelah koma terakhir
    const currentSearch = filter || '';
    const searchTermsArray = currentSearch.split(',');
    const activeTerm = searchTermsArray[searchTermsArray.length - 1].trim().toLowerCase();

    // 3. Filter data buku khusus untuk Dropdown Suggestion
    const fB = activeTerm.length > 1 
        ? data.filter(b => 
            (b.judul && b.judul.toLowerCase().includes(activeTerm)) || 
            (b.isbn && b.isbn.toLowerCase().includes(activeTerm)) || 
            (b.noInduk && b.noInduk.toLowerCase().includes(activeTerm))
          ).slice(0, 10) // Tampilkan maksimal 10 buku agar tidak berat

    return (
        <div className="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100">
            <h2 className="text-2xl font-black mb-4 text-slate-800">
                <i className="fas fa-tags text-indigo-500 mr-3"></i> Cetak Label Barcode Buku
            </h2>
            <p className="text-slate-500 font-medium mb-6">
                Masukkan ISBN, Judul, atau No. Induk buku yang ingin dicetak. Pisahkan dengan tanda koma (,) untuk mencetak banyak label sekaligus. Kosongkan untuk mencetak semua buku.

            <div className="mb-8 bg-slate-50 p-6 rounded-2xl border border-slate-100">
                <label className="block text-sm font-bold text-slate-600 mb-1.5 ml-1">Pencarian Buku (Gunakan Koma)</label>
                
                {/* --- BAGIAN INPUT PENCARIAN DENGAN DROPDOWN --- */}
                <div className="relative">
                    <i className="fas fa-search absolute left-4 top-3.5 text-indigo-400"></i>
                    <input 
                        type="text" 
                        placeholder="Contoh: 978602, Laskar Pelangi, ..." 
                        className="input-field pl-11 w-full relative z-10 focus:ring-2 focus:ring-indigo-200"

                        onChange={e => {

                            setSD(true);
                        }} 
                        onFocus={() => setSD(true)} 
                        onBlur={() => setTimeout(() => setSD(false), 200)}
                    />
                    
                    {/* Kotak Dropdown Suggestion Buku */}
                    {sD && activeTerm.length > 1 && (
                        <div className="absolute top-full left-0 right-0 mt-2 bg-white rounded-xl shadow-[0_10px_40px_rgb(0,0,0,0.1)] max-h-60 overflow-y-auto z-50 border border-slate-100 p-2">

                                    <div

                                            e.preventDefault();
                                            // Ambil riwayat pencarian sebelum koma terakhir
                                            const previousTerms = searchTermsArray.slice(0, -1).map(t => t.trim()).filter(t => t);
                                            // Tambahkan judul buku yang dipilih
                                            const newSearchTerm = [...previousTerms, b.judul].join(', ') + ', ';
                                            
                                            setFilter(newSearchTerm);
                                            setSD(false);

                                            </p>

                                    </div>
                                ))

                        </div>
                    )}

                {/* --- AKHIR BAGIAN INPUT PENCARIAN --- */}
            </div>

            <button onClick={() => onPrint('label')} className="btn-primary px-8 py-3.5 text-lg w-full md:w-auto shadow-md">
                <i className="fas fa-barcode mr-3"></i> Generate & Cetak Label

        </div>
    );
};

        const KartuAnggotaView = ({ data, onPrint, sekolah, filter = { kategori: 'Semua', kelas: 'Semua', jurusan: 'Semua', tahun: 'Semua', search: '' }, setFilter }) => {
    // 1. Tambahkan State untuk Dropdown Pencarian
    const [sD, setSD] = useState(false); 

    const dJ = sekolah?.daftarJurusan || DEFAULT_JURUSAN;
    
    // Mengambil daftar unik untuk opsi Dropdown
    const uKlsLengkap = useMemo(() => [...new Set(data.filter(d => d.kategori === 'Siswa').map(d => formatKelasSiswa(d, dJ)).filter(Boolean))].sort(), [data, dJ]);
    const uJurusan = useMemo(() => [...new Set(data.filter(d => d.kategori === 'Siswa' && d.jurusan).map(d => d.jurusan))].sort(), [data]);
    const uThn = useMemo(() => [...new Set(data.filter(d => d.kategori === 'Siswa' && d.tahunPelajaran).map(d => d.tahunPelajaran))].sort(), [data]);

    // 2. Logika Pintar untuk Dropdown (Membaca kata setelah koma terakhir)
    const currentSearch = filter?.search || '';
    const searchTermsArray = currentSearch.split(',');
    const activeTerm = searchTermsArray[searchTermsArray.length - 1].trim().toLowerCase();
    
    // Data fA (Filtered Anggota) khusus untuk dimunculkan di Dropdown Suggestion
    const fA = activeTerm.length > 1 
        ? data.filter(a => a.status === 'Aktif' && (a.nama.toLowerCase().includes(activeTerm) || (a.nisn && a.nisn.toLowerCase().includes(activeTerm)))).slice(0, 10) 
        : [];

    // Filter data secara langsung dengan dukungan multi-nama (koma) untuk hasil akhir fD
    const fD = data.filter(a => {
        if (a.status !== 'Aktif') return false;
        
        if (filter?.search) {
            const searchTerms = filter.search.toLowerCase().split(',').map(t => t.trim()).filter(t => t);
            if (searchTerms.length > 0) {
                const isMatch = searchTerms.some(term => a.nama.toLowerCase().includes(term) || (a.nisn && a.nisn.toLowerCase().includes(term)));
                if (!isMatch) return false;
            }
        }

        if (filter?.kategori !== 'Semua' && a.kategori !== filter?.kategori) return false;
        if (filter?.kategori === 'Siswa') {
            if (filter?.kelas !== 'Semua' && formatKelasSiswa(a, dJ) !== filter?.kelas) return false;
            if (filter?.jurusan !== 'Semua' && a.jurusan !== filter?.jurusan) return false;
            if (filter?.tahun !== 'Semua' && a.tahunPelajaran !== filter?.tahun) return false;
        }
        return true;
    });

                    {/* --- BAGIAN INPUT PENCARIAN DENGAN DROPDOWN FOTO --- */}

                        <label className="block text-sm font-bold text-slate-600 mb-1.5 ml-1">Pencarian Nama/NISN (Gunakan Koma)</label>

                            <i className="fas fa-search absolute left-4 top-3.5 text-indigo-400"></i>

                                type="text" 
                                placeholder="Contoh: Ahmad, Budi, 12345..." 
                                className="input-field pl-11 w-full relative z-10" 
                                value={filter?.search || ''} 
                                onChange={e => {
                                    setFilter({...filter, search: e.target.value});
                                    setSD(true);
                                }} 
                                onFocus={() => setSD(true)} 
                                onBlur={() => setTimeout(() => setSD(false), 200)}
                            />
                            
                            {/* Kotak Dropdown Suggestion */}
                            {sD && activeTerm.length > 1 && (

           const hNK = () => showConfirm('Kenaikan Kelas', 'Yakin memproses kenaikan kelas masal? Jangan tutup halaman selama proses berlangsung.', async () => {

    // 1. Kumpulkan data

    data.forEach(i => { 
        if (i.kategori === 'Siswa' && i.status === 'Aktif') { 
            if (i.kelas === 'X' || i.kelas === '10') { toUpdate.push({ id: i.id, changes: { kelas: 'XI' } }); } 
            else if (i.kelas === 'XI' || i.kelas === '11') { toUpdate.push({ id: i.id, changes: { kelas: 'XII' } }); }

        } 
    });

    // 2. Fungsi pembuat jeda (delay)
    const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

    // 3. Eksekusi bertahap
    const chunkSize = 50; 
    for (let i = 0; i < toUpdate.length; i += chunkSize) {
        const chunk = toUpdate.slice(i, i + chunkSize);
        
        // Eksekusi 50 data
        await Promise.all(chunk.map(item => onUpdate(item.id, item.changes)));
        c += chunk.length;
        
        // Berikan jeda setengah detik sebelum lanjut ke 50 data berikutnya
        if (i + chunkSize < toUpdate.length) {
            await delay(500); 
        }
    }

    setIsProsesNK(false);
    showAlert('Selesai', `Sukses! ${c} data anggota berhasil diperbarui.`, 'success'); 
});
            const hMD = () => {

const getShortBarcode = (text) => {

    // Jika kode aslinya sudah pendek (maks 8 karakter), jangan diubah
    if (str.length <= 8) return str; 
    
    // Jika panjang, ubah menjadi Hash Base36 + 3 Digit Terakhir (Dijamin Unik & Pendek)
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash |= 0; 
    }
    const shortHash = Math.abs(hash).toString(36).toUpperCase();
    const tail = str.slice(-3); // Ambil 3 angka terakhir ID sebagai pelindung bentrok
    
    return `${shortHash}${tail}`; // Contoh hasil cetak: 7XK2M023 (Sangat tebal & jelas)
    };

    const jam = new Date().getHours();
    let sapaanWaktu = "Pagi";
    if (jam >= 11 && jam < 15) sapaanWaktu = "Siang";
    else if (jam >= 15 && jam < 18) sapaanWaktu = "Sore";
    else if (jam >= 18) sapaanWaktu = "Malam";

    // 2. Tambahkan replace [SAPAAN] pada fungsi pM
    const pM = (tp, u, l, d) => tp
        .replace(/\[NAMA\]/g, u.nama)

        .replace(/\[SEKOLAH\]/g, sekolah?.nama || 'Instansi')
        .replace(/\[JUDUL\]/g, l.judulBuku)
        .replace(/\[BATAS\]/g, formatDate(l.tglHarusKembali))

        .replace(/\[TERLAMBAT\]/g, Math.abs(d));

const SuratBebasView = ({ anggota, peminjaman, sekolah }) => {
    const [q, setQ] = useState('');
    const [kelas, setKelas] = useState('Semua'); 
    const [selected, setSelected] = useState([]);
    
    const [config, setConfig] = useState({
        tanggal: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }),
        tempat: sekolah?.kota || 'Jember',
        namaKepala: sekolah?.kepalaPerpustakaan || sekolah?.kepalaPerpus || 'Nama Kepala Perpustakaan',
        nip: sekolah?.nipKepala || 'NIP. '
    });

    const uKlsLengkap = useMemo(() => {
        return [...new Set(anggota.filter(d => d.kategori === 'Siswa').map(d => {
            return typeof formatKelasSiswa === 'function' ? formatKelasSiswa(d, sekolah?.daftarJurusan) : d.kelas;
        }).filter(Boolean))].sort();
    }, [anggota, sekolah]);

    const tanggunganMap = useMemo(() => {
        const map = {};
        peminjaman.forEach(p => {
            if (p.status !== 'Dikembalikan' && p.status !== 'Hilang') {
                map[p.idAnggota] = (map[p.idAnggota] || 0) + 1;
            }
        });
        return map;
    }, [peminjaman]);

    // FILTER DAN SORTING A-Z (Ascending)
    const filteredSiswa = anggota.filter(a => {
        if (a.kategori !== 'Siswa' || a.status !== 'Aktif') return false;
        
        if (kelas !== 'Semua') {
            const klsLengkap = typeof formatKelasSiswa === 'function' ? formatKelasSiswa(a, sekolah?.daftarJurusan) : a.kelas;
            if (klsLengkap !== kelas) return false;
        }

        if (q) {
            const search = q.toLowerCase();
            const matchSearch = a.nama.toLowerCase().includes(search) || 
                                (a.nisn && a.nisn.includes(search)) || 
                                (a.kelas && a.kelas.toLowerCase().includes(search)) || 
                                (a.jurusan && a.jurusan.toLowerCase().includes(search));
            if (!matchSearch) return false;
        }
        return true;
    }).sort((a, b) => (a.nama || '').localeCompare(b.nama || '')); 

    const toggleSelect = (siswa) => {
        if (tanggunganMap[siswa.id] > 0) return; 
        if (selected.find(s => s.id === siswa.id)) {
            setSelected(selected.filter(s => s.id !== siswa.id));
        } else {
            setSelected([...selected, siswa]);
        }
    };

    const handleSelectAll = () => {
        const availableSiswa = filteredSiswa.filter(s => !(tanggunganMap[s.id] > 0));
        if (availableSiswa.length === 0) return;
        
        const allSelected = availableSiswa.every(s => selected.find(sel => sel.id === s.id));
        
        if (allSelected) {
            const newSelected = selected.filter(s => !availableSiswa.find(avail => avail.id === s.id));
            setSelected(newSelected);
        } else {
            const toAdd = availableSiswa.filter(s => !selected.find(sel => sel.id === s.id));
            setSelected([...selected, ...toAdd]);
        }
    };

    const pages = [];
    for (let i = 0; i < selected.length; i += 4) {
        pages.push(selected.slice(i, i + 4));
    }

    return (
        <div className="space-y-6 relative">

                            </div>

                            <button onClick={handleSelectAll} className="w-full md:w-auto px-5 py-3 bg-teal-50 text-teal-600 font-bold rounded-xl border border-teal-100 hover:bg-teal-100 transition-colors whitespace-nowrap">

                                const klsFormat = typeof formatKelasSiswa === 'function' ? formatKelasSiswa(s, sekolah?.daftarJurusan) : s.kelas;
                                return (
                                    <div key={s.id} onClick={() => toggleSelect(s)} className={`p-4 rounded-2xl flex items-center justify-between border transition-all ${adaTanggungan ? 'bg-rose-50 border-rose-100 opacity-70 cursor-not-allowed' : isSelected ? 'bg-teal-50 border-teal-500 shadow-md cursor-pointer' : 'bg-slate-50 border-slate-100 hover:border-teal-300 cursor-pointer'}`}>
                                        <div className="flex items-center gap-4">
                                            <div className={`w-6 h-6 rounded-md flex items-center justify-center border ${isSelected ? 'bg-teal-500 border-teal-500 text-white' : 'bg-white border-slate-300'}`}>{isSelected && <i className="fas fa-check text-xs"></i>}</div>
                                            <div><p className="font-bold text-slate-800">{s.nama}</p><p className="text-xs font-bold text-slate-500">{s.nisn ? `${s.nisn} | ` : ''}{klsFormat}</p></div>
                                        </div>
                                        <div>{adaTanggungan ? <span className="bg-rose-100 text-rose-600 px-3 py-1 rounded-lg text-xs font-black"><i className="fas fa-exclamation-circle mr-1"></i> {tanggunganMap[s.id]} Pinjaman</span> : <span className="bg-emerald-100 text-emerald-600 px-3 py-1 rounded-lg text-xs font-black">Aman</span>}</div>
                                    </div>

                            {filteredSiswa.length === 0 && <p className="text-center text-slate-400 font-bold py-10">Siswa tidak ditemukan.</p>}

                            <div><label className="block text-xs font-bold text-slate-500 mb-1">Nama Kepala Perpustakaan</label><input type="text" className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl font-bold text-sm" value={config.namaKepala} onChange={e => setConfig({...config, namaKepala: e.target.value})} /></div>
                            <div><label className="block text-xs font-bold text-slate-500 mb-1">NIP (Opsional)</label><input type="text" className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl font-bold text-sm" value={config.nip} onChange={e => setConfig({...config, nip: e.target.value})} /></div>
                            <div className="mt-6 bg-teal-50 border border-teal-100 p-4 rounded-xl text-center"><p className="text-sm font-bold text-teal-800">Siap Dicetak</p><p className="text-3xl font-black text-teal-600 my-1">{selected.length}</p><p className="text-xs font-bold text-teal-500">Siswa ({pages.length} Lembar A4)</p></div>
                        </div>
                        
                        {/* TOMBOL EXPORT DAN CETAK */}
                        <div className="flex flex-wrap md:flex-nowrap gap-3 shrink-0 pt-4 mt-auto">
                            <button onClick={() => setSelected([])} className="px-4 py-3 bg-slate-100 text-slate-600 font-bold rounded-xl hover:bg-slate-200 transition-colors">Reset</button>

                                <i className="fas fa-file-pdf mr-2"></i> Export PDF
                            </button>
                            <button onClick={() => window.print()} disabled={selected.length === 0} className="flex-1 bg-teal-600 hover:bg-teal-700 text-white font-black py-3 rounded-xl shadow-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                                <i className="fas fa-print mr-2"></i> Cetak A4

                        </div>
                        <p className="text-[9px] text-slate-400 text-center mt-3 font-bold">*Pastikan Margin diset ke "None" atau "Default" pada jendela cetak.</p>
                    </div>
                </div>
            </div>
{/* --- AREA CETAK PRESISI A4 KOTAK PENUH --- */}

                <style>{`

                    if (iKL) { 
                        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'i') || (e.ctrlKey && e.key.toLowerCase() === 'u')) e.preventDefault(); 
                        if (e.ctrlKey && (e.key.toLowerCase() === 't' || e.key.toLowerCase() === 'n' || e.key.toLowerCase() === 'p')) e.preventDefault() 
                    } 
                }; 
                const hFC = () => setIFS(!!document.fullscreenElement); 
                window.addEventListener('keydown', hK); 
                document.addEventListener('fullscreenchange', hFC); 
                return () => { window.removeEventListener('keydown', hK); document.removeEventListener('fullscreenchange', hFC) }; 
            }, [iKL]);

            useEffect(() => { 
                const hC = e => { if (iKL) e.preventDefault() }; 
                const hB = e => { if (iKL) { e.preventDefault(); e.returnValue = '' } }; 
                window.addEventListener('contextmenu', hC); 
                window.addEventListener('beforeunload', hB); 
                return () => { window.removeEventListener('contextmenu', hC); window.removeEventListener('beforeunload', hB) }; 
            }, [iKL]);
            
            const [mC, setMC] = useState({ isOpen: false, title: '', message: '', type: 'info', showCancel: false, onConfirm: null, onCancel: null });
            
            const sA = (t, m, ty = 'info', cb = null) => setMC({ isOpen: true, title: t, message: m, type: ty, showCancel: false, onConfirm: () => { setMC({ isOpen: false }); if (cb) cb(); } });
            const sC = (t, m, oC, onCnl = null) => setMC({ isOpen: true, title: t, message: m, type: 'warning', showCancel: true, onConfirm: () => { oC(); setMC({ isOpen: false }) }, onCancel: () => { setMC({ isOpen: false }); if(onCnl) onCnl(); } });
            
           const hP = t => { 
                if (t === 'label_hilang') {
                    sA("Tips Cetak", "Untuk mencetak/menyimpan PDF: Tekan Ctrl+P, ubah 'Tujuan' menjadi 'Simpan sebagai PDF', atur margin jika perlu, dan hilangkan centang 'Header/Footer'.", "info"); 
                    setPM('label_hilang'); 
                } else if (t === 'pdf' || t === 'rekap_paket' || t === 'reduksi' || t === 'print' || t === 'rekap' || t === 'label' || t === 'kartu' || t === 'buku_pdf') { 
                    sA("Tips Cetak", "Untuk mencetak/menyimpan PDF: Tekan Ctrl+P, ubah 'Tujuan' menjadi 'Simpan sebagai PDF', atur margin jika perlu, dan hilangkan centang 'Header/Footer'.", "info"); 
                    setPM(t); 
                } 
            };
            
            useEffect(() => { 
                const hK = e => { 
                    if (e.ctrlKey && e.key.toLowerCase() === 'q') { 
                        if (cU && cU.role === 'petugas' && aT !== 'kembali' && aT !== 'anggota' && aT !== 'hadir' && aT !== 'peringatan') { 
                            e.preventDefault(); 
                            setIPO(true) 
                        } 
                    } 
                }; 
                window.addEventListener('keydown', hK); 
                return () => window.removeEventListener('keydown', hK) 
            }, [cU, aT]);

            useEffect(() => { 
                auth.signInAnonymously().catch(console.error); 
                const u = auth.onAuthStateChanged(setFbU); 
                return () => u() 
            }, []);

             useEffect(() => { 
                if (!fbU) return; 
                
                const sL = (cN, s) => db.collection(`artifacts/${activeAppId}/public/data/${cN}`).onSnapshot(sp => { 
                    const d = []; 
                    sp.forEach(dc => d.push({ id: dc.id, ...dc.data() })); 
                    s(d); // Update tampilan layar
                    
                    // --- BARIS TAMBAHAN UNTUK CACHE LOKAL ---
                    try {
                            localStorage.setItem(`lokabaca_cache_${cN}`, JSON.stringify(d));
                        } catch (e) { 
                            // Ganti console.error jadi console.warn (warna kuning, bukan merah)
                            console.warn(`Memori penuh saat menyimpan cache ${cN}. Mengosongkan cache lama...`);
                            // Hapus cache yang lama agar ada ruang untuk data baru di kemudian hari
                            localStorage.removeItem(`lokabaca_cache_${cN}`); 
                        }
                    
                    // --- MATIKAN STATUS LOADING ---
                    setIsSyncing(false);
                }, console.error); 
                
                const uA = sL('anggota', setAnggota);
                const uB = sL('buku', setBuku);
                const uP = sL('peminjaman', setPeminjaman);
                const uK = sL('kehadiran', setKehadiran);
                const uQ = sL('quotes', setQuotes); 
                
                const uS = db.doc(`artifacts/${activeAppId}/public/data/pengaturan/profil`).onSnapshot(sp => { 
                    if (sp.exists) { 
                        const d = sp.data(); 
                        setSekolah(d); 
                        try { localStorage.setItem('perpus_profil_sekolah', JSON.stringify(d)) } catch (e) { } 
                    } 
                }, console.error); 
                
                return () => { uA(); uB(); uP(); uK(); uS(); uQ() } 
            }, [fbU]);

            useEffect(() => { 
                let t1, t2; 
                if (pM) { 
                    // Matikan auto-print khusus untuk Label agar user bisa klik tombol Batch/Halaman
                    if (pM === 'label' || pM === 'label_hilang') {
                        // Tidak otomatis diprint/ditutup
                    } else {
                        t1 = setTimeout(() => { window.print(); t2 = setTimeout(() => setPM(false), 500) }, 400) 
                    }
                } 
                return () => { clearTimeout(t1); clearTimeout(t2) } 
            }, [pM]);
            
            const hL = async (u, p) => { 
                try {
                    // 1. Pengecekan fitur web server. Hash tidak bekerja di file:// lokal biasa.
                    if (!crypto || !crypto.subtle) {
                        return sA('Keamanan Diblokir', 'Sistem hash diblokir browser. Pastikan aplikasi berjalan di HTTPS (misal: Google Apps Script), bukan klik langsung di komputer.', 'error');
                    }

                    // 2. Mengubah ketikan user menjadi kode Hash
                    const hashedInput = await hashSHA256(p);
                    
                    // TRIK DEVELOPER: Tampilkan hash asli di Console Browser (Tekan F12)
                    // Copy hash yang muncul di sana lalu masukkan ke variabel di bawah.
                    console.log(`Hash dari password "${p}":`, hashedInput);
                    
                    // GANTI string di bawah ini dengan hash asli yang muncul di Console F12!
                    const hashPetugas = "82f70209bb0b43126633b20b9fc9946c68df36d6a07b75a42729aecd20e5b92a";
                    
                    // Ini adalah HASH asli dari password "123" (Silakan tes login pengunjung)
                    const hashPengunjung = "a665a45920422f9d417e4867efdc4fb8a04a1f3fff1fa07e998e86f7f7a27ae3";

                    if (u === 'petugas' && hashedInput === hashPetugas) { 
                        const ur = { role: 'petugas', username: u }; 
                        setCU(ur); setAT('dashboard'); 
                        // Simpan dengan penyamaran Base64 (btoa)
                        sessionStorage.setItem('perpus_current_user', btoa(JSON.stringify(ur))); 
                    } else if (u === 'pengunjung' && hashedInput === hashPengunjung) { 
                        const ur = { role: 'pengunjung', username: u }; 
                        setCU(ur); setAT('hadir'); 
                        sessionStorage.setItem('perpus_current_user', btoa(JSON.stringify(ur))); 
                    } else {
                        sA('Gagal', 'Username/Password salah!', 'error');
                    }
                } catch (error) {
                    console.error(error);
                    sA('Error', 'Sistem keamanan gagal memproses.', 'error');
                }
            };

            
             const hLo = () => sC('Keluar', 'Yakin?', () => { 
                setCU(null); 
                sessionStorage.removeItem('perpus_current_user'); 
                localStorage.removeItem('perpus_active_tab'); 
                
                // --- BARIS TAMBAHAN HAPUS CACHE ---
                localStorage.removeItem('lokabaca_cache_buku');
                localStorage.removeItem('lokabaca_cache_anggota');
                localStorage.removeItem('lokabaca_cache_peminjaman');
                localStorage.removeItem('lokabaca_cache_kehadiran');
                
                setIKL(false); 
                if (document.fullscreenElement) document.exitFullscreen().catch(err => console.error(err)) 
            });
            
            const aD = async (c, d) => { try { await db.collection(`artifacts/${activeAppId}/public/data/${c}`).add({ ...d, createdAt: Date.now() }) } catch (e) { } };
            const uD = async (c, i, d) => { try { await db.doc(`artifacts/${activeAppId}/public/data/${c}/${i}`).update(d) } catch (e) { } };
            const dD = async (c, i) => { try { await db.doc(`artifacts/${activeAppId}/public/data/${c}/${i}`).delete() } catch (e) { } };
            const uS = async d => { try { await db.doc(`artifacts/${activeAppId}/public/data/pengaturan/profil`).set(d, { merge: true }); setIPO(false); sA('Berhasil', 'Disimpan!', 'success') } catch (e) { sA('Error', 'Gagal.', 'error') } };

            if (!cU) return <><LoginView onLogin={hL} sekolah={sekolah} /><CustomModal {...mC} /></>;
            
            if (pM) return (
                <div className="bg-white text-black w-full min-h-screen m-0 p-0 absolute top-0 left-0 z-50">
                    {pM === 'label_hilang' && <PrintLabelHilangView items={pHilangItems} sekolah={sekolah} buku={buku} onClose={() => setPM(false)} />}
                    {pM === 'buku_pdf' && <PrintDataBukuView buku={buku} sekolah={sekolah} filter={fBuku} />}
                    {/* KUNCI 2: Filter diperketat agar mengabaikan koma di akhir & filterText dimasukkan */}
                    {pM === 'label' && <PrintLabelView buku={!fL ? buku : buku.filter(b => fL.split(',').filter(x => x.trim() !== '').some(t => (b.isbn || '').toLowerCase().includes(t.trim().toLowerCase()) || (b.judul || '').toLowerCase().includes(t.trim().toLowerCase()) || (b.noInduk || '').toLowerCase().includes(t.trim().toLowerCase())))} sekolah={sekolah} filterText={fL} onClose={() => setPM(false)} />}
                    {pM === 'kartu' && <PrintKartuAnggotaView anggota={anggota} sekolah={sekolah} filter={fKartu} />}
                    {pM === 'rekap' && <PrintRekapView kehadiran={kehadiran} peminjaman={peminjaman} anggota={anggota} sekolah={sekolah} filter={fR} />}
                    {pM === 'rekap_paket' && <PrintRekapPaketView peminjaman={peminjaman} anggota={anggota} sekolah={sekolah} filter={fP} />}
                    {pM === 'hadir' && <PrintHadirView kehadiran={kehadiran} sekolah={sekolah} />}
                    {pM === 'anggota' && <PrintDataAnggotaView anggota={anggota} sekolah={sekolah} search={fA} />}
                    {pM === 'reduksi' && <PrintReduksiView buku={buku} sekolah={sekolah} filter={fRed} />}
                </div>
            );

            const NI = ({ icon, label, id }) => (
                <button onClick={() => { setAT(id); if (window.innerWidth < 1024) setISO(false) }} className={`w-full flex items-center px-4 py-3.5 mx-2 rounded-2xl transition-all group overflow-hidden relative ${aT === id ? 'bg-white/20 text-white shadow-lg ring-1 ring-white/20 backdrop-blur-md font-bold' : 'text-indigo-100/80 hover:bg-white/10 hover:text-white font-medium'}`} style={{ width: 'calc(100% - 16px)' }}>
                    {aT === id && <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-cyan-400 rounded-r-full shadow-[0_0_10px_#22d3ee]"></div>}
                    <div className={`text-xl w-7 text-center ${aT === id ? 'scale-110 text-cyan-300' : 'group-hover:-rotate-12 group-hover:scale-110'} transition-transform`}>{icon}</div>
                    {iSO && <span className="ml-3 tracking-wide whitespace-nowrap">{label}</span>}
                </button>
            );

            return (
                <div className="flex h-screen bg-[#f4f7fe] overflow-hidden text-slate-800">
                    {iKL && !iFS && (
                        <div className="fixed inset-0 z-[999999] bg-slate-900/95 backdrop-blur-xl flex flex-col items-center justify-center text-white cursor-pointer" onClick={() => document.documentElement.requestFullscreen().catch(console.error)}>
                            <i className="fas fa-lock text-7xl text-indigo-500 mb-6 animate-pulse"></i>
                            <h2 className="text-4xl font-black mb-4">Layar Terkunci</h2>
                            <p className="text-slate-300 text-lg mb-10 text-center max-w-lg">Mode Kiosk. ESC tidak diizinkan.</p>
                            <button className="bg-indigo-600 px-8 py-4 rounded-2xl text-xl flex items-center"><i className="fas fa-expand mr-3"></i> Layar Penuh</button>
                            <div className="absolute bottom-8 text-slate-500 text-xs">PETUGAS: TEKAN CTRL + Z UNTUK KELUAR</div>
                        </div>
                    )}
                    {iSO && !iFS && <div className="fixed inset-0 bg-slate-900/50 z-40 lg:hidden" onClick={() => setISO(false)}></div>}
                    
                    <aside className={`fixed lg:relative z-50 transform transition-all duration-500 ${iSO ? 'translate-x-0 w-[280px]' : '-translate-x-full lg:translate-x-0 lg:w-24'} bg-gradient-to-b from-indigo-600 via-violet-700 to-purple-900 text-white flex flex-col shrink-0 ${iFS ? 'h-full' : 'lg:rounded-r-[2rem] lg:my-2 lg:ml-2 h-full lg:h-[calc(100vh-16px)]'}`}>
                        <div className="h-20 flex items-center justify-center border-b border-white/10 px-4 cursor-pointer" onClick={() => setISO(!iSO)}>
                            {sekolah.logo ? <div className="p-1 bg-white/20 rounded-xl"><img src={sekolah.logo} className="w-10 h-10 object-contain rounded-lg bg-white" alt="Logo" /></div> : <div className="p-2 bg-gradient-to-br from-cyan-400 to-blue-500 rounded-xl"><i className="fas fa-book-reader text-xl"></i></div>}
                            {iSO && <span className="font-black truncate text-xl pl-3">{sekolah.nama || '\u00A0'}</span>}
                        </div>
                        <nav className="flex-1 overflow-y-auto py-6 space-y-2 px-1 custom-scrollbar">
                            {cU.role === 'petugas' && (
                                <>
                                    <NI icon={<i className="fas fa-layer-group"></i>} label="Dashboard" id="dashboard" />
                                    <NI icon={<i className="fas fa-user-tie"></i>} label="Administrasi" id="administrasi" />
                                    <NI icon={<i className="fas fa-users"></i>} label="Data Anggota" id="anggota" />
                                    <NI icon={<i className="fas fa-book"></i>} label="Daftar Buku" id="buku" />
                                    <NI icon={<i className="fas fa-box-archive text-orange-400"></i>} label="Reduksi Buku" id="reduksi" />
                                    <NI icon={<i className="fas fa-book-open"></i>} label="Pinjam Buku" id="pinjam" />
                                    <NI icon={<i className="fab fa-whatsapp text-emerald-400"></i>} label="Peringatan WA" id="peringatan" />
                                    <NI icon={<i className="fas fa-rotate-left"></i>} label="Pengembalian" id="kembali" />
                                    <NI icon={<i className="fas fa-book-dead text-rose-400"></i>} label="Buku Hilang" id="buku_hilang" />
                                    <NI icon={<i className="fas fa-file-invoice"></i>} label="Rekap Laporan" id="rekap" />
                                    <NI icon={<i className="fas fa-boxes"></i>} label="Rekap Paket" id="rekap_paket" />
                                    <NI icon={<i className="fas fa-barcode"></i>} label="Label Barcode" id="label" />
                                    <NI icon={<i className="fas fa-id-badge"></i>} label="Kartu Anggota" id="kartu" />
                                    <NI icon={<i className="fas fa-file-contract text-teal-400"></i>} label="Surat Bebas Pustaka" id="surat_bebas" />
                                </>
                            )}
                            {cU.role !== 'petugas' && <NI icon={<i className="fas fa-calendar-check"></i>} label="Daftar Hadir" id="hadir" />}
                            <NI icon={<i className="fas fa-search"></i>} label="Cari Buku" id="cari" />
                        </nav>
                        <div className="p-4 border-t border-white/10 flex flex-col gap-2">
                            {!iKL && (
                                <button onClick={hLo} className="flex items-center justify-center w-full px-4 py-3.5 text-white/80 hover:text-white rounded-2xl hover:bg-white/10 transition-all group">
                                    <div className="text-xl w-6 text-center group-hover:-translate-x-1"><i className="fas fa-sign-out-alt"></i></div>
                                    {iSO && <span className="ml-3 font-bold">Keluar</span>}
                                </button>
                            )}
                        </div>
                    </aside>
                    
                    <main className="flex-1 flex flex-col h-screen overflow-hidden w-full relative">
                        {!iFS && (
                            <header className="h-20 bg-white/70 backdrop-blur-xl border-b flex items-center justify-between px-8 z-10 shrink-0">
                                <div className="flex items-center gap-5">
                                    <button onClick={() => setISO(!iSO)} className="p-2.5 rounded-xl bg-white border hover:bg-slate-50 lg:hidden"><i className="fas fa-bars"></i></button>
                                    <h1 className="text-2xl font-black capitalize flex items-center gap-3"><span className="w-2 h-8 bg-gradient-to-b from-violet-500 to-indigo-500 rounded-full"></span>{aT.replace('_', ' ')}</h1>
                                    <div className="hidden md:block ml-4">
                                        {isSyncing ? (
                                            <span className="text-[10px] bg-amber-100 text-amber-600 px-3 py-1.5 rounded-full animate-pulse flex items-center gap-1.5 font-bold border border-amber-200">
                                                <i className="fas fa-sync-alt fa-spin"></i> Menyelaraskan Data...
                                            </span>
                                        ) : (
                                            <span className="text-[10px] bg-emerald-100 text-emerald-600 px-3 py-1.5 rounded-full flex items-center gap-1.5 font-bold border border-emerald-200">
                                                <i className="fas fa-check-circle"></i> Sinkronisasi Selesai
                                            </span>
                                        )}
                                    </div> 
                                
                                    </div>
                                <div className="flex items-center gap-4">
                                    <div className="hidden sm:block text-right">
                                        <p className="text-sm font-bold truncate">{cU.username}</p>
                                        <p className="text-[10px] text-indigo-500 uppercase">{cU.role}</p>
                                    </div>
                                    <div className="w-12 h-12 rounded-2xl bg-indigo-100 flex items-center justify-center text-indigo-600 font-black text-lg">{cU.username.charAt(0).toUpperCase()}</div>
                                </div>
                            </header>
                        )}
                        <div className={`flex-1 overflow-auto custom-scrollbar ${iFS ? 'p-4' : 'p-8'}`}>
                            <div className={`mx-auto ${iFS ? 'max-w-full h-full' : 'max-w-[90rem] space-y-8 pb-10'}`}>
                                {aT === 'dashboard' && <DashboardView anggota={anggota} buku={buku} peminjaman={peminjaman} kehadiran={kehadiran} sekolah={sekolah} onUserClick={setSBiodata} />}
                                {aT === 'anggota' && <AnggotaView data={anggota} onAdd={d => aD('anggota', d)} onUpdate={(i, d) => uD('anggota', i, d)} onDelete={i => sC('Hapus', 'Yakin?', () => dD('anggota', i))} onDeleteMany={is => is.forEach(i => dD('anggota', i))} showAlert={sA} showConfirm={sC} filter={fA} setFilter={setFA} onPrint={hP} sekolah={sekolah} onUpdatePengaturan={uS} />}
                                {aT === 'buku' && <BukuView data={buku} onAdd={d => aD('buku', d)} onUpdate={(i, d) => uD('buku', i, d)} onDelete={i => sC('Hapus', 'Yakin?', () => dD('buku', i))} showAlert={sA} onPrint={hP} filter={fBuku} setFilter={setFBuku} />}
                                {aT === 'reduksi' && <ReduksiView data={buku} onUpdate={(i, d) => uD('buku', i, d)} onDelete={i => sC('Hapus Permanen', 'Yakin?', () => dD('buku', i))} onPrint={hP} filter={fRed} setFilter={setFRed} />}
                                {aT === 'hadir' && <HadirView data={kehadiran} anggota={anggota} buku={buku} peminjaman={peminjaman} quotes={quotes} onAdd={d => aD('kehadiran', d)} onAddQuote={d => aD('quotes', d)} onDeleteQuote={i => sC('Hapus Quote', 'Yakin?', () => dD('quotes', i))} showAlert={sA} sekolah={sekolah} onUserClick={setSBiodata} />}
                                {aT === 'pinjam' && <PinjamView data={peminjaman} anggota={anggota} buku={buku} sekolah={sekolah} onAdd={d => aD('peminjaman', d)} onUpdate={(i, d) => uD('peminjaman', i, d)} onDelete={i => dD('peminjaman', i)} onUpdateBuku={uD} showAlert={sA} showConfirm={sC} />}
                                {aT === 'peringatan' && <PeringatanView peminjaman={peminjaman} anggota={anggota} sekolah={sekolah} onUpdatePengaturan={uS} showConfirm={sC} showAlert={sA} />}
                                {aT === 'kembali' && <KembaliView data={peminjaman} onUpdate={(i, d) => uD('peminjaman', i, d)} onUpdateBuku={uD} buku={buku} showAlert={sA} showConfirm={sC} sekolah={sekolah} onUpdatePengaturan={uS} />}
                                {aT === 'buku_hilang' && <BukuHilangView data={peminjaman} anggota={anggota} buku={buku} onUpdate={(i, d) => uD('peminjaman', i, d)} onUpdateBuku={uD} onPrintHilang={items => { setPHilangItems(items); hP('label_hilang'); }} showAlert={sA} showConfirm={sC} />}
                                {aT === 'rekap' && <RekapView kehadiran={kehadiran} peminjaman={peminjaman} anggota={anggota} onPrint={hP} filter={fR} setFilter={setFR} sekolah={sekolah} />}
                                {aT === 'rekap_paket' && <RekapPaketView anggota={anggota} peminjaman={peminjaman} onPrint={hP} filter={fP} setFilter={setFP} sekolah={sekolah} />}
                                {aT === 'administrasi' && <AdministrasiView sekolah={sekolah} onSave={uS} showAlert={sA} />}
                                {aT === 'cari' && <PencarianBukuView data={buku} />}
                                {aT === 'label' && <LabelView data={buku} onPrint={hP} sekolah={sekolah} filter={fL} setFilter={setFL} />}
                                {aT === 'kartu' && <KartuAnggotaView data={anggota} onPrint={hP} sekolah={sekolah} filter={fKartu} setFilter={setFKartu} />}
                                {aT === 'surat_bebas' && <SuratBebasView anggota={anggota} peminjaman={peminjaman} sekolah={sekolah} />}
                            </div>
                        </div>
                        <BiodataModal user={sBiodata} isOpen={!!sBiodata} onClose={() => setSBiodata(null)} sekolah={sekolah} />
                    </main>
                    <PengaturanSekolahModal isOpen={iPO} onClose={() => setIPO(false)} sekolah={sekolah} onSave={uS} showAlert={sA} />
                    <CustomModal {...mC} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root')); 
        root.render(<App />);
    </script>
</body>
</html>
