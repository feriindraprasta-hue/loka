};


const KembaliView = ({ data, anggota = [], onUpdate, onUpdateBuku, buku, showAlert, showConfirm, sekolah, onUpdatePengaturan }) => {
    const [s, setS] = useState(''), [vC, setVC] = useState(''), [sDS, setSDS] = useState(false), [dI, setDI] = useState(sekolah?.dendaHarian || 1000);
    
    const [confirmBook, setConfirmBook] = useState(null);
    const [showSplash, setShowSplash] = useState(false);
    const [isScanOpen, setIsScanOpen] = useState(false);

    // STATE BARU UNTUK PAGINATION (PAGINASI)
    const [currentPage, setCurrentPage] = useState(1);
    const itemsPerPage = 25; 

    useEffect(() => { setDI(sekolah?.dendaHarian || 1000); }, [sekolah?.dendaHarian]);
    
    useEffect(() => { 
        const kD = e => { if (e.ctrlKey && e.key.toLowerCase() === 'q') { e.preventDefault(); setSDS(p => !p); } }; 
        window.addEventListener('keydown', kD); 
        return () => window.removeEventListener('keydown', kD); 
    }, []);

    useEffect(() => {
        const handleEnterConfirm = (e) => {
            if (confirmBook && e.key === 'Enter') {
                e.preventDefault();
                pR(confirmBook, false); 
                setConfirmBook(null);  
            }
        };
        
        if (confirmBook) {
            window.addEventListener('keydown', handleEnterConfirm);
        }
        return () => window.removeEventListener('keydown', handleEnterConfirm);
    }, [confirmBook]);

    const pR = (i, h = false) => {
        let d = 0; const t = new Date(); const bT = new Date(i.tglHarusKembali); const dhA = sekolah?.dendaHarian || 1000;
        if (t > bT && !h) d = Math.ceil(Math.abs(t - bT) / (1000 * 60 * 60 * 24)) * dhA;
        onUpdate(i.id, { status: h ? 'Hilang' : 'Dikembalikan', tglDikembalikan: t.toISOString().split('T')[0], denda: h ? 50000 : d });
        
        if (!h) { 
            const b = buku.find(x => x.id === i.idBuku); 
            if (b) onUpdateBuku('buku', i.idBuku, { stock: b.stock + 1 }); 
        }
        
        const cbFocus = () => setTimeout(() => document.getElementById('barcodeKembali')?.focus(), 100);
        
        if (d > 0 && !h) {
            showAlert('Denda!', `Denda telat: Rp ${d.toLocaleString('id-ID')}`, 'warning', cbFocus);
            setVC('');
        }
        else if (h) {
            showAlert('Hilang', `Denda ganti: Rp 50.000`, 'warning', cbFocus);
            setVC('');
        }
        else {
            setShowSplash(true);
            setVC('');
            setTimeout(() => {
                setShowSplash(false);
                cbFocus();
            }, 1000);
        }
    };

    const hVS = (e, scannedCode = null) => {
        if (e && e.preventDefault) e.preventDefault(); 
        const sC = (scannedCode !== null ? scannedCode : vC).trim();
        if (!sC) return;
        const cbFocus = () => setTimeout(() => document.getElementById('barcodeKembali')?.focus(), 100);
        
        let aL = data.find(d => d.status === 'Dipinjam' && d.kodeEksemplar && d.kodeEksemplar.toLowerCase() === sC.toLowerCase());
        if (!aL) {
             aL = data.find(d => d.status === 'Dipinjam' && ((d.isbn && d.isbn.toLowerCase() === sC.toLowerCase()) || (d.kodeEksemplar && d.kodeEksemplar.toLowerCase().startsWith(sC.toLowerCase() + '-'))));
        }

        if (aL) {
            setConfirmBook(aL);
            document.getElementById('barcodeKembali')?.blur(); 
        } else {
            showAlert('Gagal', `Barcode ${sC} tidak ditemukan di daftar peminjaman aktif.`, 'error', cbFocus);
            setVC('');
        }
    };

    // LOGIKA FILTER & PAGINASI UNTUK TABEL
    const fD = data.filter(d => {
        if (d.status !== 'Dipinjam') return false;
        if (s) {
            const q = s.toLowerCase();
            return (d.namaPeminjam || '').toLowerCase().includes(q) || 
                   (d.judulBuku || '').toLowerCase().includes(q) || 
                   (d.kodeEksemplar || '').toLowerCase().includes(q);
        }
        return true;
    }).sort((a, b) => new Date(a.tglHarusKembali) - new Date(b.tglHarusKembali)); // Diurutkan otomatis: yang paling telat/mendesak muncul di atas

    const totalPages = Math.ceil(fD.length / itemsPerPage) || 1;
    const currentData = fD.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

    return (
        <div className="bg-white rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border-0 overflow-hidden flex flex-col h-full min-h-[80vh] relative">
            <div className="bg-gradient-to-r from-emerald-500 to-teal-600 p-8 md:p-10 shrink-0">
                <div className="flex flex-col md:flex-row md:items-start justify-between gap-4 mb-6">
                    <div><h2 className="text-3xl font-black text-white mb-2"><i className="fas fa-barcode-read mr-3 opacity-80"></i> Pengembalian Cepat (Scan)</h2></div>
                    <div className="bg-white/20 backdrop-blur-md px-3 py-1.5 rounded-lg border border-white/30 text-white text-xs font-bold shadow-sm shrink-0">Tarif Denda: Rp {(sekolah?.dendaHarian || 1000).toLocaleString('id-ID')}/hari (Ctrl+Q)</div>
                </div>
                {sDS && (
                    <div className="mb-6 bg-white/20 backdrop-blur-md rounded-2xl p-5 shadow-lg flex justify-between">
                        <h4 className="text-white font-black text-lg">Ubah Denda</h4>
                        <div className="flex gap-2">
                            <input type="number" className="w-32 px-4 py-2 rounded-xl text-slate-800 font-black focus:outline-none" value={dI} onChange={e => setDI(e.target.value)} />
                            <button onClick={() => { onUpdatePengaturan({ ...sekolah, dendaHarian: parseInt(dI) || 0 }); setSDS(false); }} className="bg-emerald-800 text-white px-4 py-2 rounded-xl font-bold">Simpan</button>
                        </div>
                    </div>
                )}
                <form onSubmit={hVS} className="max-w-2xl relative flex gap-3">
                    <div className="relative flex-1">
                        <input id="barcodeKembali" type="text" placeholder="Scan Barcode..." className="w-full pl-6 pr-28 py-5 rounded-2xl text-xl font-mono font-bold text-slate-800 shadow-2xl focus:outline-none focus:ring-4 focus:ring-emerald-300/30" value={vC} onChange={e => setVC(e.target.value)} autoFocus required />
                        <button type="submit" className="absolute right-3 top-3 bottom-3 px-6 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-bold transition-colors">Cek</button>
                    </div>
                    <button type="button" onClick={() => setIsScanOpen(true)} className="px-6 bg-white text-emerald-600 hover:bg-emerald-50 rounded-2xl font-black shadow-2xl flex items-center gap-2 shrink-0 transition-transform active:scale-95" title="Scan Pengembalian via Kamera HP">
                        <i className="fas fa-camera text-2xl"></i>
                        <span className="hidden sm:inline text-sm">Scan HP</span>
                    </button>
                </form>
            </div>
            
            {/* AREA FILTER PENCARIAN TABEL BAWAH */}
            <div className="p-6 md:px-8 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 shrink-0 bg-slate-50/50">
                <h3 className="text-xl font-black text-slate-800">Daftar Pinjaman Aktif</h3>
                <div className="relative w-full sm:w-80">
                    <i className="fas fa-search absolute left-4 top-3.5 text-slate-400"></i>
                    <input 
                        type="text" 
                        placeholder="Cari Peminjam, Buku, Barcode..." 
                        className="w-full bg-white border border-slate-200 pl-11 pr-4 py-2.5 rounded-xl text-sm font-bold focus:ring-2 focus:ring-emerald-200 focus:outline-none transition-all shadow-sm" 
                        value={s} 
                        onChange={e => { setS(e.target.value); setCurrentPage(1); }} 
                    />
                </div>
            </div>

            <div className="p-0 flex-1 flex flex-col overflow-hidden">
                <div className="overflow-x-auto w-full flex-1 custom-scrollbar bg-white">
                    <table className="w-full text-left text-sm whitespace-nowrap">
                        <thead className="bg-slate-50 text-slate-500 font-bold uppercase text-[11px] sticky top-0 z-10">
                            <tr><th className="py-4 px-6">Identitas</th><th className="py-4 px-6">Buku & Barcode</th><th className="py-4 px-6">Status Waktu</th><th className="py-4 px-6 text-right">Aksi Manual</th></tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                            {currentData.length === 0 ? (
                                <tr><td colSpan="4" className="text-center py-12 text-slate-400 font-bold">Data kosong atau tidak ditemukan.</td></tr>
                            ) : currentData.map(i => {
                                const iL = new Date() > new Date(i.tglHarusKembali);
                                const pem = anggota.find(a => a.id === i.idAnggota);
                                const infoKelas = pem ? (pem.kategori === 'Siswa' ? formatKelasSiswa(pem, sekolah?.daftarJurusan) : pem.kategori) : '-';
                                return (
                                    <tr key={i.id} className="hover:bg-slate-50/50">
                                        <td className="py-4 px-6">
                                            <p className="font-black text-slate-800">{i.namaPeminjam}</p>
                                            <span className="text-[10px] font-bold text-emerald-600 uppercase">{infoKelas} {pem?.nisn ? `• ${pem.nisn}` : ''}</span>
                                        </td>
                                        <td className="py-4 px-6"><p className="font-semibold">{i.judulBuku}</p><span className="text-[10px] font-mono bg-slate-100 px-2 py-0.5 rounded">{i.kodeEksemplar || i.isbn}</span>{i.isPaket && <span className="ml-2 text-[9px] font-black bg-purple-100 text-purple-600 px-2 py-0.5 rounded uppercase">Paket</span>}</td>
                                        <td className="py-4 px-6">{iL ? <span className="text-rose-600 bg-rose-50 px-3 py-1.5 rounded-lg text-xs font-black uppercase">Terlambat</span> : <span className="text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-lg text-xs font-black uppercase">Aman</span>}<div className="text-[11px] text-slate-400 font-bold mt-2">Batas: {new Date(i.tglHarusKembali).toLocaleDateString('id-ID')}</div></td>
                                        <td className="py-4 px-6">
                                            <div className="flex justify-end gap-2">
                                                <button onClick={() => pR(i, false)} className="px-4 py-2 text-xs font-bold bg-white text-slate-600 border border-slate-200 rounded-lg hover:bg-emerald-50 hover:text-emerald-600 hover:border-emerald-200 transition-colors">Kembali</button>
                                                <button onClick={() => pR(i, true)} className="px-4 py-2 text-xs font-bold bg-white text-slate-600 border border-slate-200 rounded-lg hover:bg-rose-50 hover:text-rose-600 hover:border-rose-200 transition-colors">Hilang</button>
                                            </div>
                                        </td>
                                    </tr>
                                )
                            })}
                        </tbody>
                    </table>
                </div>
            </div>

            {/* KONTROL PAGINATION DI BAGIAN BAWAH */}
            <div className="p-5 border-t border-slate-100 bg-slate-50/50 flex flex-col sm:flex-row justify-between items-center gap-4 shrink-0 rounded-b-[2rem]">
                <div className="text-xs font-bold text-slate-500">
                    Menampilkan <span className="text-emerald-600 px-1">{fD.length > 0 ? (currentPage - 1) * itemsPerPage + 1 : 0}</span> 
                    - <span className="text-emerald-600 px-1">{Math.min(currentPage * itemsPerPage, fD.length)}</span> 
                    dari <span className="text-emerald-600 px-1">{fD.length}</span> Pinjaman Aktif
                </div>
                <div className="flex items-center gap-3">
                    <button 
                        disabled={currentPage === 1} 
                        onClick={() => setCurrentPage(currentPage - 1)} 
                        className="w-10 h-10 rounded-full bg-white border border-slate-200 shadow-sm flex items-center justify-center font-bold text-slate-600 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-emerald-50 hover:text-emerald-600 hover:border-emerald-200 transition-all"
                    >
                        <i className="fas fa-chevron-left text-sm"></i>
                    </button>
                    <span className="font-black text-sm text-slate-700 mx-2 bg-white px-4 py-2 rounded-xl shadow-sm border border-slate-100">
                        Hal {currentPage} <span className="text-slate-400 font-medium mx-1">/</span> {totalPages}
                    </span>
                    <button 
                        disabled={currentPage === totalPages} 
                        onClick={() => setCurrentPage(currentPage + 1)} 
                        className="w-10 h-10 rounded-full bg-white border border-slate-200 shadow-sm flex items-center justify-center font-bold text-slate-600 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-emerald-50 hover:text-emerald-600 hover:border-emerald-200 transition-all"
                    >
                        <i className="fas fa-chevron-right text-sm"></i>
                    </button>
                </div>
            </div>

            {/* MODAL KONFIRMASI LOKAL YANG MENDUKUNG TOMBOL ENTER */}
            {confirmBook && (
                <div className="fixed inset-0 bg-slate-900/60 z-[9999] flex items-center justify-center p-4 backdrop-blur-sm">
                    <div className="bg-white rounded-[2rem] p-8 max-w-md w-full text-center shadow-2xl animate-[bounceIn_0.3s_ease-out]">
                        <div className="w-16 h-16 bg-teal-100 text-teal-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                            <i className="fas fa-check-circle"></i>
                        </div>
                        <h3 className="text-2xl font-black text-slate-800 mb-2">Konfirmasi Pengembalian</h3>
                        {(() => {
                            const pem = anggota.find(a => a.id === confirmBook.idAnggota);
                            const identitasSiswa = pem ? (pem.kategori === 'Siswa' ? formatKelasSiswa(pem, sekolah?.daftarJurusan) : pem.kategori) : '-';
                            const nisnSiswa = pem?.nisn ? ` (${pem.nisn})` : '';
                            return (
                                <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 text-left mb-6 mt-4 space-y-3">
                                    <div className="border-b border-slate-200 pb-2.5">
                                        <p className="text-[10px] font-black uppercase tracking-wider text-slate-400">Nama & Kelas / Identitas Peminjam</p>
                                        <p className="font-black text-base text-slate-800 mt-0.5">{confirmBook.namaPeminjam}</p>
                                        <span className="inline-block mt-1 px-2.5 py-0.5 bg-indigo-50 text-indigo-600 border border-indigo-100 rounded-md text-xs font-black uppercase">
                                            {identitasSiswa}{nisnSiswa}
                                        </span>
                                    </div>
                                    <div className="border-b border-slate-200 pb-2.5">
                                        <p className="text-[10px] font-black uppercase tracking-wider text-slate-400">Judul Buku</p>
                                        <p className="font-bold text-sm text-slate-800 leading-snug mt-0.5">{confirmBook.judulBuku}</p>
                                    </div>
                                    <div>
                                        <p className="text-[10px] font-black uppercase tracking-wider text-slate-400">Nomor Barcode Buku</p>
                                        <span className="inline-block mt-1 font-mono font-black text-sm bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-lg">
                                            <i className="fas fa-barcode mr-2"></i>{confirmBook.kodeEksemplar || confirmBook.isbn || '-'}
                                        </span>
                                    </div>
                                </div>
                            );
                        })()}
                        <div className="flex gap-3 justify-center">
                            <button 
                                onClick={() => { setConfirmBook(null); setTimeout(() => document.getElementById('barcodeKembali')?.focus(), 100); }} 
                                className="px-6 py-3 bg-slate-100 text-slate-600 font-bold rounded-xl hover:bg-slate-200 transition-colors"
                            >
                                Batal
                            </button>
                            <button 
                                onClick={() => { pR(confirmBook, false); setConfirmBook(null); }} 
                                className="px-6 py-3 bg-teal-500 hover:bg-teal-600 text-white font-bold rounded-xl shadow-lg shadow-teal-200 flex items-center gap-2 transition-colors"
                            >
                                Ya, Lanjutkan <span className="bg-white/20 px-2 py-0.5 rounded text-[10px] uppercase">Enter ↵</span>
                            </button>
                        </div>
                    </div>
                </div>
            )}

            {/* SPLASH SCREEN KHUSUS BERHASIL (Auto-Dismiss) */}
            {showSplash && (
                <div className="fixed inset-0 bg-slate-900/40 z-[99999] flex items-center justify-center p-4 backdrop-blur-sm">
                    <div className="bg-white rounded-3xl p-8 max-w-[280px] w-full text-center shadow-2xl animate-[zoomIn_0.2s_ease-out]">
                        <div className="w-16 h-16 bg-emerald-500 text-white rounded-full flex items-center justify-center mx-auto mb-4 text-3xl shadow-lg shadow-emerald-200">
                            <i className="fas fa-check"></i>
                        </div>
                        <h3 className="text-xl font-black text-slate-800 mb-1">Berhasil</h3>
                        <p className="text-sm font-medium text-slate-400">Buku dikembalikan!</p>
                    </div>
                </div>
            )}
            <FastScannerModal 
                isOpen={isScanOpen} 
                onClose={() => setIsScanOpen(false)} 
                title="Scan Pengembalian Buku"
                onDetected={(code) => {
                    setVC(code);
                    hVS(null, code); // Otomatis tampilkan popup Konfirmasi Pengembalian!
                }} 
            />
        </div>
    );
};
        
        const PeringatanView = ({ peminjaman, anggota, sekolah, onUpdatePengaturan, showConfirm, showAlert }) => {
            const [iS, setIS] = useState(false), [pG, setPG] = useState(0), [sTS, setSTS] = useState(false);
            const dH1 = `Assalamu'alaikum\nSelamat Pagi *[NAMA]*\n\nKami dari *[SEKOLAH]* menyampaikan buku *"[JUDUL]"* berlaku sampai *[BATAS]*.\n\n_#sistem_`, 
                  dH0 = `Assalamu'alaikum\nSelamat Pagi *[NAMA]*\n\nKami dari *[SEKOLAH]* menyampaikan buku *"[JUDUL]"* berlaku sampai *[BATAS]* (Hari ini Batas Akhir).\n\n_#sistem_`, 
                  dHP = `Assalamu'alaikum\nSelamat Pagi *[NAMA]*\n\nBuku *"[JUDUL]"* batas *[BATAS]*, hari ini (*[HARI_INI]*) terlambat *[TERLAMBAT] Hari*.\n\n_#sistem_`;
            
            const [tH1, setTH1] = useState(sekolah?.waTemplateH1 || dH1);
            const [tH0, setTH0] = useState(sekolah?.waTemplateH0 || dH0);
            const [tHP, setTHP] = useState(sekolah?.waTemplatePlus || dHP);

            // STATE BARU UNTUK PAGINATION (PAGINASI)
            const [currentPage, setCurrentPage] = useState(1);
            const itemsPerPage = 10; // Menampilkan 10 baris per halaman sesuai permintaan

            useEffect(() => { const kD = e => { if (e.ctrlKey && e.key.toLowerCase() === 'q') { e.preventDefault(); setSTS(p => !p); } }; window.addEventListener('keydown', kD); return () => window.removeEventListener('keydown', kD); }, []);

            const gTL = useMemo(() => {
                const td = new Date(); 
                td.setHours(0, 0, 0, 0); 
                let t = [];
                
                // 1. Fungsi penentu waktu sapaan
                const jam = new Date().getHours();
                let sapaanWaktu = "Pagi";
                if (jam >= 11 && jam < 15) sapaanWaktu = "Siang";
                else if (jam >= 15 && jam < 18) sapaanWaktu = "Sore";
                else if (jam >= 18) sapaanWaktu = "Malam";

                // 2. Tambahkan replace [SAPAAN] pada fungsi pM
                const pM = (tp, u, l, d) => tp
                    .replace(/\[NAMA\]/g, u.nama)
                    .replace(/\[SAPAAN\]/g, sapaanWaktu) 
                    .replace(/\[SEKOLAH\]/g, sekolah?.nama || 'Instansi')
                    .replace(/\[JUDUL\]/g, l.judulBuku)
                    .replace(/\[BATAS\]/g, formatDate(l.tglHarusKembali))
                    .replace(/\[HARI_INI\]/g, formatDate(new Date().toISOString().split('T')[0]))
                    .replace(/\[TERLAMBAT\]/g, Math.abs(d));
                
                peminjaman.filter(p => p.status === 'Dipinjam').forEach(l => {
                    const u = anggota.find(a => a.id === l.idAnggota); 
                    if (!u || !u.telepon) return;
                    
                    const rD = new Date(l.tglHarusKembali); 
                    rD.setHours(0, 0, 0, 0);
                    const dD = Math.round((rD.getTime() - td.getTime()) / (1000 * 60 * 60 * 24));
                    let sH = '', m = '';
                    
                    if (dD === 1) { sH = 'H-1'; m = pM(tH1, u, l, dD); }
                    else if (dD === 0) { sH = 'Hari H'; m = pM(tH0, u, l, dD); }
                    else if (dD < 0) { sH = `H+${Math.abs(dD)}`; m = pM(tHP, u, l, dD); }
                    
                    if (sH) t.push({ ...l, user: u, statusH: sH, msg: m, diffDays: dD, waUrl: `https://wa.me/${formatWA(u.telepon)}?text=${encodeURIComponent(m)}` });
                });
                return t.sort((a, b) => a.diffDays - b.diffDays);
            }, [peminjaman, anggota, sekolah, tH1, tH0, tHP]);

            // LOGIKA PAGINATION
            const totalPages = Math.ceil(gTL.length / itemsPerPage) || 1;
            const currentData = gTL.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

            // Mencegah error halaman kosong jika data berkurang
            useEffect(() => {
                if (currentPage > totalPages) setCurrentPage(Math.max(1, totalPages));
            }, [totalPages, currentPage]);

            const hB = async () => {
                if (gTL.length === 0) return showAlert("Kosong", "Tidak ada daftar peminjaman yang perlu dikirim saat ini.", "info");
                
                showConfirm("Kirim Broadcast WA", "Apakah Anda yakin ingin mengirim pesan WhatsApp ke SELURUH daftar ini?\n\n(Pastikan Pop-up browser diizinkan agar tab WA terbuka otomatis)", async () => {
                    setIS(true);
                    for (let i = 0; i < gTL.length; i++) {
                        setPG(i + 1); window.open(gTL[i].waUrl, '_blank');
                        if (i < gTL.length - 1) await new Promise(r => setTimeout(r, Math.floor(Math.random() * 5000) + 10000));
                    }
                    setIS(false); setPG(0); 
                    showAlert("Selesai", "Proses Broadcast WhatsApp telah selesai diproses!", "success");
                });
            };

            return (
                <div className="bg-white rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border-0 overflow-hidden flex flex-col h-[80vh] relative">
                    <div className="p-6 md:p-8 border-b flex justify-between items-center shrink-0 bg-white">
                        <div>
                            <h2 className="text-2xl font-black flex items-center gap-3"><i className="fab fa-whatsapp text-emerald-500"></i> Peringatan WA</h2>
                            <button onClick={() => setSTS(!sTS)} className="mt-2 px-3 py-1 bg-indigo-50 text-indigo-600 rounded-lg text-xs font-bold border border-indigo-100 hover:bg-indigo-100 transition-colors">Edit Template</button>
                        </div>
                        <div className="flex gap-3 items-center">
                            {iS && <div className="text-sm font-bold text-emerald-600 bg-emerald-50 px-4 py-2.5 rounded-xl border border-emerald-200 animate-pulse">Mengirim: {pG}/{gTL.length}</div>}
                            <button onClick={hB} disabled={iS} className={`px-6 py-3 font-bold text-white rounded-xl shadow-lg transition-transform hover:-translate-y-0.5 active:scale-95 ${iS ? 'bg-slate-400' : 'bg-gradient-to-r from-emerald-500 to-teal-600'}`}>{iS ? 'Memproses...' : 'Kirim Semua'}</button>
                        </div>
                    </div>
                    {sTS && (
                        <div className="absolute inset-0 z-20 bg-white/95 backdrop-blur-md overflow-y-auto p-10 animate-[bounceIn_0.3s_ease-out]">
                            <div className="max-w-4xl mx-auto bg-white border shadow-2xl rounded-[2rem] p-8">
                                <div className="flex justify-between items-center mb-6 pb-4 border-b">
                                    <h3 className="text-2xl font-black">Editor Template</h3>
                                    <button onClick={() => setSTS(false)} className="w-10 h-10 bg-slate-100 rounded-full hover:bg-rose-100 hover:text-rose-600 transition-colors"><i className="fas fa-times"></i></button>
                                </div>
                                <div className="space-y-6">
                                    <div className="border p-5 rounded-2xl bg-slate-50"><label className="font-black block mb-2 text-slate-700">Peringatan H-1</label><textarea rows="3" className="w-full p-4 rounded-xl border focus:outline-none focus:ring-2 focus:ring-indigo-200" value={tH1} onChange={e => setTH1(e.target.value)}></textarea></div>
                                    <div className="border p-5 rounded-2xl bg-slate-50"><label className="font-black block mb-2 text-slate-700">Peringatan Hari H</label><textarea rows="3" className="w-full p-4 rounded-xl border focus:outline-none focus:ring-2 focus:ring-indigo-200" value={tH0} onChange={e => setTH0(e.target.value)}></textarea></div>
                                    <div className="border p-5 rounded-2xl bg-slate-50"><label className="font-black block mb-2 text-slate-700">Peringatan Terlambat</label><textarea rows="3" className="w-full p-4 rounded-xl border focus:outline-none focus:ring-2 focus:ring-indigo-200" value={tHP} onChange={e => setTHP(e.target.value)}></textarea></div>
                                </div>
                                <div className="mt-8 flex justify-end gap-3">

            const BukuHilangView = ({ data, anggota, buku, onUpdate, onUpdateBuku, onPrintHilang, showConfirm, showAlert }) => {
            const [sel, setSel] = useState([]);

            const tAll = e => {
                if (e.target.checked) setSel(dH.map(d => d.id));

            };

            const tOne = (id, c) => {
                if (c) setSel([...sel, id]);
                else setSel(sel.filter(x => x !== id));

                showConfirm('Buku Ditemukan / Diganti', `Buku "${i.judulBuku}" telah diganti fisik barunya atau ditemukan?\n\nData ini akan dikembalikan ke menu Pengembalian untuk diproses secara normal.`, () => {

                });
            };

            const hCetak = () => {
    if (sel.length === 0) return showAlert('Pilih Data', 'Pilih minimal satu data.', 'warning');
    
    const selectedItems = sel.map(selectedId => {
        const itemHilang = dH.find(d => String(d.id) === String(selectedId));
        if (!itemHilang) return null;

        // Cari di master buku. Gunakan No Induk atau Judul sebagai cadangan terakhir
        const dataMaster = buku.find(b => 
            String(b.id) === String(itemHilang.id) || 
            (itemHilang.noInduk && String(b.noInduk) === String(itemHilang.noInduk)) ||
            (itemHilang.judulBuku && b.judulBuku === itemHilang.judulBuku)
        );
        
        const finalData = {
            ...itemHilang,
            // Paksa isi ISBN jika ditemukan di master
            isbn: dataMaster?.isbn || dataMaster?.ISBN || itemHilang.isbn || itemHilang.ISBN || ''
        };

        console.log("DEBUG LOKABACA - Item:", finalData); // Cek ini di Console F12
        return finalData;
    }).filter(Boolean);
    
    onPrintHilang(selectedItems);
};

//cetak kartu bebas perpus
const SuratBebasView = ({ anggota, peminjaman, sekolah }) => {

    // NAMA KEPALA dan NIP tidak lagi disimpan di state lokal, langsung ambil dari 'sekolah'
    const [config, setConfig] = useState({
        tanggal: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }),
        tempat: sekolah?.kota || 'Jember'
    });

    const uKlsLengkap = useMemo(() => {
        return [...new Set(anggota.filter(d => d.kategori === 'Siswa').map(d => {
            return typeof formatKelasSiswa === 'function' ? formatKelasSiswa(d, sekolah?.daftarJurusan) : d.kelas;
        }).filter(Boolean))].sort();
    }, [anggota, sekolah]);

    const tanggunganMap = useMemo(() => {
        const map = {};
        peminjaman.forEach(p => {
            if (p.status !== 'Dikembalikan' && p.status !== 'Hilang') {
                map[p.idAnggota] = (map[p.idAnggota] || 0) + 1;
            }
        });
        return map;
    }, [peminjaman]);

    const filteredSiswa = anggota.filter(a => {
        if (a.kategori !== 'Siswa' || a.status !== 'Aktif') return false;
        
        if (kelas !== 'Semua') {
            const klsLengkap = typeof formatKelasSiswa === 'function' ? formatKelasSiswa(a, sekolah?.daftarJurusan) : a.kelas;
            if (klsLengkap !== kelas) return false;
        }

        if (q) {
            const search = q.toLowerCase();
            const matchSearch = a.nama.toLowerCase().includes(search) || 
                                (a.nisn && a.nisn.includes(search)) || 
                                (a.kelas && a.kelas.toLowerCase().includes(search)) || 
                                (a.jurusan && a.jurusan.toLowerCase().includes(search));
            if (!matchSearch) return false;
        }
        return true;
    }).sort((a, b) => (a.nama || '').localeCompare(b.nama || '')); 

    const toggleSelect = (siswa) => {
        if (tanggunganMap[siswa.id] > 0) return;

        if (availableSiswa.length === 0) return;
        
        const allSelected = availableSiswa.every(s => selected.find(sel => sel.id === s.id));
        
        if (allSelected) {
            const newSelected = selected.filter(s => !availableSiswa.find(avail => avail.id === s.id));
            setSelected(newSelected);
        } else {
            const toAdd = availableSiswa.filter(s => !selected.find(sel => sel.id === s.id));
            setSelected([...selected, ...toAdd]);
        }
    };

                            );

        </div>

};


const KembaliPaketView = ({ data, anggota, buku, onUpdate, onUpdateBuku, showAlert, showConfirm, sekolah }) => {

                const vRaw = e.target.value; setSQ(vRaw); setSD(true);

                    const oId = String(a?.id || '').replace(/\s+/g, '').toUpperCase();
                    const oNisn = String(a?.nisn || '').replace(/\s+/g, '').toUpperCase();

                });

                     String(d.isbn || '').toUpperCase() === sC || 
                     String(d.kodeEksemplar || '').toUpperCase().startsWith(sC + '-'))
                );

                if (!loanRecord) {
                    showAlert('Gagal', `Barcode ${sC} tidak ditemukan dalam daftar peminjaman paket yang aktif.`, 'error', cbFocus);
                    return setVC('');
                }

                // CEK KEPEMILIKAN BUKU
                if (loanRecord.idAnggota === sA.id) {

                } else {
                    // Matikan kamera sejenak jika buku tertukar agar petugas melihat peringatan dengan jelas

            return (

                                            {sD && sQ.length > 1 && (

                                                    {fA.length === 0 ? <p className="text-center text-xs font-bold text-slate-400 py-4">Tidak ditemukan</p> : fA.map(a => (

                                                            <div className="w-8 h-8 rounded-full bg-slate-100 overflow-hidden flex-shrink-0 flex items-center justify-center border border-slate-200">

                        onDetected={(code) => {
